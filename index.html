<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Memoria</title><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: one calm column, ink-on-paper, with a highlighter-yellow marker used only for "this is active / this is you". */
:root{
  --bg:#F3F4FA; --surface:#FFFFFF; --surface-2:#E8EAF5;
  --ink:#151A3F; --ink-2:#555B86; --line:#D3D7EA;
  --hl:#FFE45C; --on-hl:#151A3F; --mark:#FFE45C;
  --warn:#9A6A00; --warn-bg:#FFF2C2; --good:#0E8F58; --good-bg:#DDF5E9; --bad:#C93A31; --bad-bg:#FCE3E0;
  --shadow:0 1px 0 rgba(21,26,63,.06), 0 10px 26px -14px rgba(21,26,63,.30);
  --f-display:'Familjen Grotesk','Helvetica Neue',Arial,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1026; --surface:#161A3A; --surface-2:#20254B;
    --ink:#EDEFFF; --ink-2:#A4AADB; --line:#2D3364;
    --hl:#FFE45C; --on-hl:#151A3F; --mark:rgba(255,228,92,.34);
    --warn:#FFD166; --warn-bg:#3F3411; --good:#4BD88F; --good-bg:#12382B; --bad:#FF8279; --bad-bg:#472122;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1026; --surface:#161A3A; --surface-2:#20254B;
  --ink:#EDEFFF; --ink-2:#A4AADB; --line:#2D3364;
  --hl:#FFE45C; --on-hl:#151A3F; --mark:rgba(255,228,92,.34);
  --warn:#FFD166; --warn-bg:#3F3411; --good:#4BD88F; --good-bg:#12382B; --bad:#FF8279; --bad-bg:#472122;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{display:inline-flex;flex:none}
.i svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mark{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 93%,transparent 93%);padding:0 .1em;margin:0 -.1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.wrap{width:100%;max-width:1040px;margin-inline:auto;padding-inline:clamp(16px,4vw,28px)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;height:60px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 6px 4px 0;font:700 21px/1 var(--f-display);letter-spacing:-.02em}
.brand svg{width:32px;height:32px;flex:none}
.brand b{font:500 13px/1 var(--f-mono);background:var(--hl);color:var(--on-hl);padding:4px 6px;border-radius:5px;transform:rotate(-3deg);letter-spacing:0}
.ver{margin-left:12px;font:500 11px/1 var(--f-mono);color:var(--ink-2);opacity:.4;letter-spacing:.03em;user-select:none;cursor:default}
.acct{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0;position:relative}
.acct-btn{display:inline-flex;align-items:center;gap:8px;min-width:0;padding:3px 10px 3px 3px;border:1.5px solid transparent;border-radius:999px;background:transparent;color:var(--ink);font:600 14px/1 var(--f-body);cursor:pointer;transition:border-color .12s,background .12s}
.acct-btn:hover{border-color:var(--line);background:var(--surface)}
.acct-nm{max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-av{position:relative;width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font:700 12px/1 var(--f-display);color:var(--ink-2);overflow:hidden;flex:none;user-select:none}
.acct-pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.acct-pop{position:absolute;right:0;top:calc(100% + 10px);z-index:7;width:min(300px,86vw);display:none;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.acct.open .acct-pop{display:flex}
.acct-pop .lbl{font:500 12px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.gsi-wrap{position:relative;display:inline-flex;align-items:center;vertical-align:middle}
.gsi-face{display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 15px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:600 14px/1 var(--f-body);cursor:pointer;white-space:nowrap;transition:border-color .12s,background .12s}
.gsi-wrap:hover .gsi-face{border-color:var(--ink)}
.gsi-wrap:focus-within{outline:2.5px solid var(--ink);outline-offset:2px;border-radius:10px}
.gsi-g{display:inline-flex;flex:none}
.gsi-g svg{width:18px;height:18px;display:block}
.gsi-hit{position:absolute;inset:-3px;overflow:hidden;opacity:0}
.gsi-hit>*{position:absolute;inset:0;width:100%!important;height:100%!important}
.gsi-hit iframe{width:100%!important;height:100%!important;border:0}
@media (max-width:560px){.gsi-long{display:none}}
.logo-bg{fill:#151A3F}
.logo-c1{fill:#E8EAF5;stroke:#151A3F;stroke-width:2;stroke-linejoin:round}
.logo-c2{fill:#FFFFFF;stroke:#151A3F;stroke-width:2;stroke-linejoin:round}
.logo-hl{fill:#FFE45C}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;line-height:1.2;text-decoration:none;transition:transform .12s, background .12s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:none}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.hl{background:var(--hl);color:var(--on-hl);border-color:var(--hl)}
.btn.ghost{border-color:var(--line);background:var(--surface)}
.btn.ghost:hover:not(:disabled){border-color:var(--ink)}
.btn.link{border-color:transparent;padding-inline:8px;color:var(--ink-2)}
.btn.link:hover:not(:disabled){color:var(--ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.browse-cta{padding:15px 24px;font-size:1.05rem;background:var(--hl);color:var(--on-hl);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn.browse-cta:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn.browse-cta .i svg{width:1.45em;height:1.45em}
.btn:disabled{opacity:.45}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border:0;border-radius:9px;background:transparent;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.round{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:background .12s,border-color .12s}
.round:hover:not(:disabled){border-color:var(--ink);background:var(--hl);color:var(--on-hl)}
.round:disabled{opacity:.35}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* views */
.view{padding-block:28px 80px;animation:rise .25s ease both}
@keyframes rise{from{transform:translateY(5px)}to{transform:none}}
.eyebrow{font:500 12px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.sec{margin-top:48px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-h h2{font-size:1.6rem}
.sub{color:var(--ink-2)}

/* hero */
.hero{display:grid}
.hero-copy{display:grid;gap:18px;justify-items:start;max-width:62ch}
.hero h1{font-size:clamp(2.3rem,6vw,3.9rem);line-height:1.02;font-weight:700;letter-spacing:-.03em}
.lead{font-size:1.15rem;color:var(--ink-2);max-width:46ch}

/* decks */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.deck{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:150px;width:100%;padding:18px;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:16px;transition:border-color .12s, transform .12s}
.deck:hover{border-color:var(--ink);transform:translateY(-2px)}
.deck.c-colored{background:color-mix(in srgb,var(--dc) 13%,var(--surface));border-color:color-mix(in srgb,var(--dc) 55%,var(--line))}
.deck.c-colored:hover{border-color:var(--dc)}
.deck h3{font-size:1.2rem;line-height:1.2;overflow-wrap:anywhere}
.deck p{color:var(--ink-2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.deck .meta{margin-top:auto;font:500 12px var(--f-mono);color:var(--ink-2);display:flex;align-items:center}
.deck-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dc);margin-right:7px;flex:none}
.deck.new{border-style:dashed;align-items:center;justify-content:center;gap:6px;background:transparent;color:var(--ink-2);font-weight:600}
.deck.new .i svg{width:1.8em;height:1.8em}
.tag{display:inline-block;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--ink-2);padding:2px 7px;border-radius:999px}
.add-round{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);background:var(--hl);color:var(--on-hl);display:grid;place-items:center;flex:none}
.add-round:hover{transform:rotate(90deg)}
.add-round{transition:transform .2s}

/* review */
.review{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:22px}
.review ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.rv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:10px 4px 10px 12px;border-radius:10px;background:var(--bg)}
.rv-t{min-width:0;overflow-wrap:anywhere}
.rv-t .arrow{color:var(--ink-2);margin-inline:8px}
.rv-deck{grid-column:1;font:500 12px var(--f-mono);color:var(--ink-2)}
.rv .icon-btn{grid-row:1/3;grid-column:2}

/* hub */
.hub-top{display:grid;gap:12px;margin:8px 0 28px}
.hub-top h1{font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.08;overflow-wrap:anywhere}
.hub-top .desc{color:var(--ink-2);max-width:62ch;white-space:pre-wrap;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fns{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,185px),1fr));gap:12px}
.fn{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:18px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);transition:transform .12s,border-color .12s}
.fn:hover:not(:disabled){border-color:var(--ink);transform:translateY(-2px)}
.fn:hover:not(:disabled) .fn-i{background:var(--hl);color:var(--on-hl)}
.fn-i{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);transition:background .12s}
.fn h3{font-size:1.15rem}
.fn p{color:var(--ink-2);font-size:14px}
.fn:disabled{opacity:.55}
.note-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-top:16px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
details.cards-list{margin-top:28px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
details.cards-list summary{padding:14px 16px;font-weight:600;cursor:pointer}
.cl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:6px 20px;padding:0 16px 16px}
.cl div{padding:8px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.cl .h{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);border:0;padding-bottom:0}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--bad-bg);border:1.5px solid var(--bad)}

/* forms */
.form{max-width:780px;display:grid;gap:22px}
.form h1{font-size:clamp(1.8rem,5vw,2.4rem)}
.field{display:grid;gap:7px}
.field>label,.lbl{font-weight:600;font-size:14px}
.in{width:100%;padding:11px 13px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;font:inherit;line-height:1.4}
.in-wrap{position:relative;display:block}
.in-wrap .in{padding-right:44px}
.in-img{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);display:grid;place-items:center;padding:0}
.in-img:hover{background:var(--surface-2);color:var(--ink)}
.in-img .i svg{width:1.15em;height:1.15em}
.in:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--mark)}
.in::placeholder{color:var(--ink-2);opacity:.7}
textarea.in{resize:vertical;min-height:44px}
.in.big{font-size:1.2rem;padding:14px 16px}
.hint{font-size:13px;color:var(--ink-2)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.setting-l{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.setting-l strong{font-family:var(--f-display);font-size:1.1rem}
.info{position:relative;display:inline-flex}
.info>button{width:30px;height:30px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.info>button:hover{color:var(--ink);background:var(--surface-2)}
.tip{display:none;position:absolute;left:0;top:36px;z-index:3;width:min(300px,78vw);padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;line-height:1.45;box-shadow:var(--shadow)}
.info.open .tip{display:block}
@media (hover:hover) and (pointer:fine){.info:hover .tip{display:block}}
.switch{width:46px;height:27px;border-radius:999px;background:var(--surface-2);border:1.5px solid var(--ink-2);position:relative;padding:0;flex:none;transition:background .15s,border-color .15s}
.switch .knob{position:absolute;top:2.5px;left:2.5px;width:19px;height:19px;border-radius:50%;background:var(--ink);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--hl);border-color:var(--ink)}
.switch[aria-checked="true"] .knob{transform:translateX(19px);background:var(--on-hl)}
.switch:disabled{opacity:.5}
.tg{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 0;font-weight:500}
.soon{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--ink-2);padding:1px 6px;border-radius:999px;margin-left:8px;font-style:normal}
.slots{display:grid;gap:18px}
.slot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto;grid-template-areas:"w d a";gap:14px;align-items:start;padding-bottom:16px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0;padding-bottom:0}
.slot-n{font:500 13px var(--f-mono);color:var(--ink-2)}
.slot .cw{grid-area:w}.slot .cd{grid-area:d}.slot-a{grid-area:a;display:flex;gap:2px;padding-top:20px}
.slots.has-ex .slot{grid-template-areas:"w d a" "e e a"}
.slot .ce{grid-area:e}
.ce .cell-lbl{color:var(--ink)}
.exnote{font:500 11px var(--f-mono);color:var(--ink-2)}
.cell-top{display:flex;align-items:baseline;gap:8px}
.cell-top .slot-n{margin-right:auto}
.cell-top .exnote{margin-right:auto;margin-left:0}
@media (max-width:640px){
  .slot{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"w a" "d a";gap:12px 8px;padding-bottom:16px}
  .slots.has-ex .slot{grid-template-areas:"w a" "d a" "e a";padding-bottom:18px}
  .slot-a{flex-direction:column;padding-top:20px}
}
.add-card{justify-self:start}
.bulk{display:grid;gap:10px;padding:0 16px 16px}
details.paste{border:1.5px dashed var(--line);border-radius:14px}
details.paste>summary{padding:14px 16px;font-weight:600;cursor:pointer}
.bulk-info{font:500 13px var(--f-mono);color:var(--ink-2)}
.err{color:var(--bad);font-weight:600;min-height:1.4em}
.form-actions{display:flex;flex-wrap:wrap;gap:10px}

/* study shell */
.sbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:22px}
.sbar-t{font-size:1.1rem;text-align:center}
.sbar .btn.link{justify-self:start}
@media (max-width:520px){.sbar{grid-template-columns:auto 1fr}.sbar>:last-child{display:none}.sbar-t{text-align:right}}
.opts{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;justify-content:center;margin-top:22px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--hl);color:var(--on-hl)}
.opts .tg{padding:0;gap:10px;font-size:14px}
.desk-only{display:none}
.touch-only{display:block}
@media (hover:hover) and (pointer:fine){.desk-only{display:block}.touch-only{display:none}.kc{display:inline-flex!important}}
.kc{display:none;flex:none;min-width:22px;height:22px;padding:0 4px;align-items:center;justify-content:center;border:1px solid var(--line);border-bottom-width:2.5px;border-radius:5px;font:500 11px var(--f-mono);color:var(--ink-2);background:var(--bg)}
.center-hint{text-align:center;font-size:13px;color:var(--ink-2);margin-top:14px}

/* flashcards */
.fc-stage{max-width:720px;margin:0 auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.fc{width:100%;aspect-ratio:3/2;min-height:230px;cursor:pointer;display:block}
.fc-inner{position:relative;width:100%;height:100%;}
.fc-inner.turn{animation:turn .3s ease}
@keyframes turn{0%{transform:scaleX(1)}50%{transform:scaleX(.02)}100%{transform:scaleX(1)}}
.fc-face{position:absolute;inset:0;border-radius:22px;background:var(--surface);border:1.5px solid var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;padding:34px 26px 26px;text-align:center;overflow:hidden}
.fc-face.back{background:var(--surface-2)}
.fc-label{position:absolute;top:14px;left:18px;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.fc-text{font:600 clamp(1.6rem,5vw,2.6rem)/1.15 var(--f-display);overflow-wrap:anywhere;letter-spacing:-.01em}
.fc-text.mid{font-size:clamp(1.3rem,3.6vw,1.9rem)}
.fc-text.long{font:500 clamp(1.05rem,2.6vw,1.3rem)/1.4 var(--f-body)}
.fc-text.xl{font:500 clamp(0.9rem,2vw,1.05rem)/1.45 var(--f-body)}
.fc-stage.in-next .fc{animation:slideR .22s ease both}
.fc-stage.in-prev .fc{animation:slideL .22s ease both}
@keyframes slideR{from{transform:translateX(26px)}to{transform:none}}
@keyframes slideL{from{transform:translateX(-26px)}to{transform:none}}
.fc-nav{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:22px}

  return Array.from(String(ans)).map(ch=>{if(!isLetter(ch))return ch;n++;return n<=k?ch:'_';}).join('');
}
function distractors(c,answer,wd,k,avoid){
  const seen=new Set([norm(answer)]),pool=[];
  shuffle(c.deck.cards).forEach(x=>{
    if(x.id===c.id)return;
    const t=plain(wd?x.d:x.w),n=norm(t);
    if(!n||seen.has(n))return;
    seen.add(n);pool.push({t,n});
  });
  const out=[];
  // Prefer options that were not already the correct answer to an earlier question
  // in this session: seeing "trovärdig" again as a distractor after answering it
  // for an earlier card is confusing. If that leaves too few options we fall back
  // to the rest, so a long deck near its end can still fill four choices.
  pool.forEach(p=>{if(out.length<k&&!(avoid&&avoid.has(p.n)))out.push(p.t);});
  pool.forEach(p=>{if(out.length<k&&out.indexOf(p.t)===-1)out.push(p.t);});
  return out;
}
function makeOptions(c,answer,wd,n,avoid){return shuffle([answer].concat(distractors(c,answer,wd,n-1,avoid))).filter(t=>typeof t==='string'&&t.trim());}

function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const k in (props||{})){
    const v=props[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else e.setAttribute(k,v);
  }
  kids.flat(Infinity).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(String(c)));});
  return e;
}

const TTS=(function(){try{return 'speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;}catch(e){return false;}})();
/* Some browsers (notably Chrome/Firefox on Linux) expose the API but have no
   speech engine installed, so every utterance would be silent. Fill the voice
   list as soon as the browser offers it, and say so once if it stays empty. */
let ttsWarned=false;
function ttsVoices(){try{return speechSynthesis.getVoices()||[];}catch(e){return [];}}
if(TTS){try{ttsVoices();speechSynthesis.onvoiceschanged=()=>{ttsVoices();};}catch(e){}}
function noVoicesNote(){
  if(ttsWarned)return;
  ttsWarned=true;
  const el=h('div',{class:'toast',role:'status'},
    h('span',null,'No speech voices were found on this device, so Read aloud stays silent. On Linux, install a speech engine such as speech-dispatcher and espeak-ng.'),
    h('button',{type:'button',class:'icon-btn','aria-label':'Dismiss','title':'Dismiss',onclick:()=>el.remove()},icon('x')));
  document.body.append(el);
  setTimeout(()=>{try{el.remove();}catch(e){}},15000);
}

const BAD_VOICES=/\b(albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|junior|organ|princess|ralph|superstar|trinoids|whisper|wobble|zarvox|fred|kathy)\b/i;
const GOOD_VOICES=/google|natural|neural|online|premium|enhanced|siri|samantha|karen|daniel|moira|alex|serena|ava|allison|zira|aria|jenny|hazel|susan|oskar|alva|klara|astrid|emma|amy|sofia|lekha/i;
function voiceFor(lang){
  try{
    const all=ttsVoices();
    if(!all.length||!lang)return null;
    const want=lang.toLowerCase();
    let c=all.filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase()===want);
    if(!c.length)c=all.filter(v=>v.lang&&v.lang.slice(0,2).toLowerCase()===want.slice(0,2));
    if(!c.length)return null;
    const score=v=>(GOOD_VOICES.test(v.name)?3:0)-(BAD_VOICES.test(v.name)?10:0)-(/\bmale\b/i.test(v.name)?1:0)+(v.default?0.5:0);
    c.sort((a,b)=>score(b)-score(a));
    return c[0];
  }catch(e){return null;}
}
let speakTok=0;
/* segs: [{t,lang}] spoken in order, {gap:ms} is silence */
function speakSeq(segs){
  if(!TTS)return;
  if(!ttsVoices().length){noVoicesNote();return;}
  const tok=++speakTok;
  try{speechSynthesis.cancel();}catch(e){}
  let i=0;
  function next(){
    if(tok!==speakTok||i>=segs.length)return;
    const s=segs[i++];
    if(s.gap){setTimeout(next,s.gap);return;}
    const t=plain(s.t).trim();
    if(!t){next();return;}
    try{
      const u=new SpeechSynthesisUtterance(t);
      if(s.lang){u.lang=s.lang;const v=voiceFor(s.lang);if(v)u.voice=v;}
      u.rate=1;u.pitch=1;
      u.onend=next;u.onerror=next;
      speechSynthesis.speak(u);
    }catch(e){}
  }
  next();
}
const speak=(text,lang)=>speakSeq([{t:text,lang}]);
function stopSpeech(){speakTok++;try{if(TTS)speechSynthesis.cancel();}catch(e){}}
const langOf=(deck,side)=>(deck&&(side==='w'?deck.langW:deck.langD))||'';
/* Reads the whole sentence and stays silent where the blank is */
function clozeSegs(c,cl,bi){
  const before=[],after=[];let seen=false;
  cl.parts.forEach(p=>{
    if(p.blank===bi){seen=true;return;}
    (seen?after:before).push(plain(p.v));
  });
  const segs=[{t:c.w,lang:langOf(c.deck,'w')}];
  const b=before.join('').trim(),a=after.join('').trim();
  if(b)segs.push({t:b,lang:langOf(c.deck,'d')});
  segs.push({gap:650});
  if(a)segs.push({t:a,lang:langOf(c.deck,'d')});
  return segs;
}

  return h('button',{type:'button',class:'icon-btn speak '+(cls||''),'aria-label':'Read aloud',title:'Read aloud',onclick:e=>{e.stopPropagation();speakSeq(getSegs());}},icon('sound'));
}

function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      try{
        const M=520;
        let w=im.naturalWidth||im.width,hh=im.naturalHeight||im.height;
        if(!w||!hh)throw new Error('size');
        const k=Math.min(1,M/Math.max(w,hh));
        w=Math.round(w*k);hh=Math.round(hh*k);
        const cv=document.createElement('canvas');cv.width=w;cv.height=hh;
        const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,hh);cx.drawImage(im,0,0,w,hh);
        URL.revokeObjectURL(url);
        res(cv.toDataURL('image/jpeg',0.8));
      }catch(e){URL.revokeObjectURL(url);rej(e);}
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('image'));};
    im.src=url;
  });
}

['hp-bygg','HP ordbyggnad','Prefix och ändelser (orddelar) som bygger svenska ord — nyckeln till att gissa okända ord i ORD.','sv-SE','sv-SE',false,[['a- / an-','Grekiskt prefix som betyder utan eller icke.','asymmetrisk = utan symmetri · anarki = utan härskare eller ordnad överhet'],['o- / van-','Svenska prefix som betyder inte eller utan.','ovederhäftig = inte tillförlitlig · vanartig = som inte uppför sig som förväntat'],['in- / im- / ir- / il-','Latinskt prefix som betyder inte. Formen rättar sig efter följande ljud.','inkompetent = inte kompetent · irrationell = inte rationell · illegal = olaglig · immateriell = inte materiell'],['dis-','Prefix som betyder åtskillnad, borttagande eller motsats.','diskvalificera = utesluta från behörighet · dissekera = skära sönder · disharmoni = bristande samklang'],['dys-','Prefix som betyder störd, bristfällig eller sjukligt nedsatt.','dysfunktionell = som inte fungerar normalt · dyslexi = svårighet att läsa · dysfori = nedstämdhet'],['anti-','Prefix som betyder mot eller riktad mot.','antites = motsats · antidot = motgift · antipatisk = som väcker motvilja'],['kontra-','Prefix som betyder mot, i motsats till eller som svar på.','kontradiktion = motsägelse · kontraproduktiv = som motverkar sitt eget syfte'],['pre-','Prefix som betyder före, i tid eller ordning.','prejudikat = tidigare rättsavgörande · prehistorisk = från tiden före historisk tid'],['pro-','Prefix som betyder för, framåt eller i stället för.','proaktiv = handlar i förväg · prolog = inledning till ett verk'],['post- / retro-','Prefix som betyder efter (i tid), respektive bakåt eller tillbaka.','postum = utgiven efter döden · retrospektiv = tillbakablickande · retroaktiv = verkande bakåt i tiden'],['inter- / intra-','Prefix som betyder mellan olika enheter, respektive inom en grupp.','internationell = mellan nationer · intramural = inom en institution eller grupp'],['sub- / super-','Prefix som betyder under, respektive över eller utöver.','subordination = underordning · superstruktur = överordnad struktur'],['före-','Prefix som betyder i förväg eller framför, i tid eller rum.','förebrå = klandra någon · förebygga = hindra i förväg · förebild = något att efterlikna · förekomma = finnas eller inträffa först'],['mono- / poly-','Prefix som betyder en eller ensam, respektive många.','monolog = tal av en person · monoteism = tro på en enda gud · polygon = månghörning · polygami = äktenskap med flera'],['homo- / hetero-','Prefix som betyder lika eller samma, respektive olik eller annan.','homogen = enhetlig · heterogen = blandad · homonym = ord med samma form men olika betydelse'],['hyper- / hypo-','Prefix som betyder över eller alltför mycket, respektive under eller för lite.','hyperaktiv = överdrivet aktiv · hyperbol = överdrift · hypotes = antagande att pröva · hypotermi = onormalt låg kroppstemperatur'],['meta-','Prefix som betyder efter, bortom eller om sig själv på en högre nivå.','metafysik = bortom det fysiska · metafor = bildlig omskrivning · metakognition = tankar om sitt eget tänkande'],['neo- / paleo-','Prefix som betyder ny, respektive gammal eller forntida.','neologi = nybildat ord · paleontologi = läran om forntida liv'],['pseudo-','Prefix som betyder falsk eller skenbar.','pseudonym = falskt namn · pseudovetenskap = något som utger sig för att vara vetenskap'],['omni- / pan-','Prefix som betyder allt eller alltigenom.','omnipotent = allsmäktig · omnivor = allätare · pandemi = sjukdom över hela världen'],['tele-','Prefix som betyder fjärran eller på avstånd.','telefon = ljud på avstånd · television = bild på avstånd · telepati = känsla över avstånd'],['syn- / sym-','Prefix som betyder med, tillsammans eller samtidigt.','sympati = medkänsla · symfoni = samklang · synonym = ord med samma betydelse'],['trans-','Prefix som betyder över, igenom eller bortom.','transport = förflyttning · transparent = genomskinlig · transcendens = överskridande av gräns'],['re-','Prefix som betyder åter, tillbaka eller på nytt.','rekonstruera = bygga upp igen · revidera = se över på nytt · reaktion = motverkan'],['de- / ex-','Prefix som betyder ned eller bort, respektive ut eller före detta.','degradera = sätta ned i rang · exkludera = stänga ute · excentrisk = utanför mitten'],['-lös','Ändelse som betyder utan eller som saknar.','samvetslös = utan samvete · grundlös = utan grund · fruktlös = utan resultat'],['-bar','Ändelse som bildar adjektiv av verb: som kan ...as eller som går att ...a. (Jämför: ett verb + denna ändelse = något som låter sig göras.)','mätbar = som kan mätas · läsbar = som går att läsa · försumbar = så liten att den kan försummas'],['-abel / -ibel','Ändelser som bildar adjektiv av verb med betydelsen möjlig att eller som kan.','acceptabel = möjlig att godta · plausibel = rimlig eller trovärdig'],['-ism','Ändelse som betecknar en lära, ideologi, riktning eller företeelse.','empirism = syn som betonar erfarenhet · pragmatism = inriktning på praktiska följder · anakronism = något felplacerat i tiden'],['-ist','Ändelse som betecknar en person som företräder en lära eller utövar en verksamhet.','empirist = anhängare av empirism · purist = någon som vill hålla något rent · nihilist = person som förnekar givna värden'],['-itet','Ändelse som bildar substantiv för en egenskap, ett tillstånd eller en grad.','validitet = giltighet · ambiguitet = tvetydighet · rigiditet = stelhet eller oflexibilitet'],['-fobi / -fil','Ändelse som betyder rädsla eller stark motvilja, respektive att tycka om eller dras till något.','xenofobi = främlingsfientlighet · hydrofob = vattenavstötande · bibliofil = bokälskare'],['bene- / mal-','Prefix som betyder väl eller gott, respektive dåligt eller illa.','benefik = välgörande eller förmånlig · malign = elakartad · malformation = missbildning'],['-logi / -logisk','Orddel som betecknar en lära, vetenskap eller systematisk undersökning.','ontologi = läran om varat · epistemologi = läran om kunskap · analogi = likhet mellan förhållanden'],['-ficera / -fikation','Orddelar som betyder att göra något till, skapa eller åstadkomma ett tillstånd.','klassificera = dela in i klasser · intensifiera = göra intensivare · verifikation = bekräftelse av riktighet'],['-het','Ändelse som bildar substantiv av adjektiv och betecknar en egenskap.','frihet = att vara fri · klarhet = att vara klar · möjlighet = att vara möjlig'],['-skap','Ändelse som bildar substantiv om tillstånd, samhörighet eller verksamhet.','vänskap = det att vara vän · kunskap = det att kunna · medlemskap = det att vara medlem'],['-ing / -ning','Ändelse som bildar substantiv av verb och betecknar en handling eller dess resultat.','prövning = det att pröva · utbildning = det att utbilda · förklaring = det att förklara'],['-sam / -full','Ändelser som bildar adjektiv: den ena betyder som har en benägenhet för, den andra som är fylld av.','arbetsam = flitig eller mödosam · vördsam = präglad av vördnad · hoppfull = fylld av hopp · betydelsefull = av stor betydelse'],['-aktig / -mässig','Ändelser som bildar adjektiv med betydelsen av det slaget, respektive enligt eller i linje med.','barnaktig = som ett barn · ordningsmässig = enligt ordningen · yrkesmässig = i yrkesutövning'],['-era','Ändelse som bildar verb, ofta med betydelsen göra, förse med eller syssla med.','kopiera = göra en kopia · duscha = tvätta sig · studera = ägna sig åt studier']],true],

/* Built-in decks keyed by id, plus helpers for linked ("saved") decks.
   A saved copy of a built-in deck keeps src:'bi:<id>' and no cards of its own:
   its cards are re-read from BUILTIN whenever the page loads, so editing a
   built-in deck updates everyone who saved it. Editing a linked deck detaches
   it first (see editView's save()). */
const BUILTIN_BY_ID={};
BUILTIN.forEach(b=>{BUILTIN_BY_ID[b[0]]={id:b[0],title:b[1],desc:b[2],langW:b[3],langD:b[4],choize:b[5],cards:b[6],example:!!b[7]};});
const builtinOf=src=>{const m=/^bi:(.+)$/.exec(String(src||''));return m?BUILTIN_BY_ID[m[1]]||null:null;};
const deckSnap=d=>JSON.stringify([d.title,d.desc||'',!!d.choize,d.langW||'',d.langD||'',!!d.example,d.cards]);
function hydrateDeck(d){
  const b=builtinOf(d&&d.src);if(!b)return false;
  const before=deckSnap(d);
  d.title=b.title;d.desc=b.desc;d.choize=!!b.choize;d.langW=b.langW||'';d.langD=b.langD||'';d.example=!!b.example;
  d.cards=b.cards.map((c,i)=>({id:'bi:'+b.id+':'+i,w:c[0],d:c[1],e:c[2]||''}));
  return deckSnap(d)!==before;
}
function hydrateAll(){
  const changed=[];
  S.decks.forEach(d=>{if(hydrateDeck(d))changed.push(d);});
  changed.forEach(touchDeck);
  return changed.length;
}
/* One-time: decks that were saved as a plain copy of a built-in deck (before
   links existed) are switched over to a link so they follow later edits too. */
function linkBuiltinCopies(){
  let changed=false;
  S.decks.forEach(d=>{
    if(d.src||d.noLink)return;
    const b=BUILTIN.find(x=>x[1]===d.title);
    if(b){d.src='bi:'+b[0];hydrateDeck(d);changed=true;}
  });
  return changed;
}

/* (The old `example` marker for seeded demo decks was retired; `example` now
   means "this deck has an example field on each card".) */
function lsSave(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function lsLoad(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null;}catch(e){return null;}}

const dq={};
function dbQueue(id,data,path){
  if(!path&&!col)return;
  if(path&&!DB)return;
  const e=dq[id]||(dq[id]={});
  e.path=path||null;
  e.data=data;clearTimeout(e.timer);
  e.timer=setTimeout(()=>dbFlush(id),350);
}
async function dbFlush(id){
  const e=dq[id];
  if(!e||(!e.path&&!col))return;
  if(e.busy){e.timer=setTimeout(()=>dbFlush(id),250);return;}
  e.busy=true;
  const data=e.data;
  let err=null;
  try{
    const ref=e.path?DB.doc(e.path):col.doc(id);
    if(data===null)await ref.delete();
    else await ref.set(data);
    e.tries=0;
  }catch(x){err=x;/* local copy stays */if(e.path)pubFail(x);}
  e.busy=false;
  if(e.data!==data){clearTimeout(e.timer);dbFlush(id);return;}
  /* A write can fail on something transient — offline, or the short per-IP
     rate limit during a big first sync. Keep the local copy and try again
     instead of dropping it, so a device never silently loses a deck. */
  if(err){
    e.tries=(e.tries||0)+1;
    if(e.tries<=6){clearTimeout(e.timer);e.timer=setTimeout(()=>dbFlush(id),Math.min(15000,800*e.tries));}
  }
}
const metaDoc=()=>({review:clone(S.review),resume:S.resume?clone(S.resume):null,profile:S.profile?clone(S.profile):{name:''},seeded:true,linked:!!S.linked});
function touchDeck(d){dirty=true;lsSave();dbQueue('d_'+d.id,clone(d));}
function touchMeta(){dirty=true;lsSave();dbQueue('meta',metaDoc());}
function usedImages(){
  const s=new Set();
  S.decks.forEach(d=>d.cards.forEach(c=>{if(c.wi)s.add(c.wi);if(c.di)s.add(c.di);}));
  return s;
}
function syncImages(fresh){
  const used=usedImages();
  Object.keys(S.images).forEach(id=>{
    if(!used.has(id)){delete S.images[id];dbQueue('i_'+id,null);}
  });
  (fresh||[]).forEach(id=>{if(used.has(id)&&S.images[id])dbQueue('i_'+id,{data:S.images[id]});});
  dirty=true;lsSave();
}
function removeDeck(id){
  S.decks=S.decks.filter(d=>d.id!==id);
  S.review=S.review.filter(r=>r.deck!==id);
  dbQueue('d_'+id,null);dbQueue('meta',metaDoc());
  syncImages();
}
const deckById=id=>S.decks.find(d=>d.id===id);
function pruneReview(silent){
  const n=S.review.length;
  S.review=S.review.filter(r=>{const d=deckById(r.deck);return d&&d.cards.some(c=>c.id===r.card);});
  if(!silent&&S.review.length!==n)touchMeta();
}
const sc=(deck,c)=>({id:c.id,w:c.w,d:c.d,e:c.e||'',wi:c.wi,di:c.di,deck});

const RESUME_NAMES={flash:'Flashcards',write:'Write',learn:'Learn'};
function setResume(name,deckId,label,data){
  S.resume={name,id:deckId,at:Date.now(),label,data:data||{}};touchMeta();
}
function clearResume(name,deckId){
  if(S.resume&&(!name||(S.resume.name===name&&S.resume.id===deckId))){S.resume=null;touchMeta();}
}
function resumeFor(name,id){
  const r=S.resume;
  return(r&&r.name===name&&r.id===id&&deckById(id))?r:null;
}

/* ----- review list: a missed card stays queued until you get it right once ----- */
function markWrong(c){
  const k=c.deck.id+':'+c.id;
  if(!S.review.some(r=>r.k===k)){S.review.push({k,deck:c.deck.id,card:c.id,last:Date.now()});touchMeta();}
}
function markRight(c){
  const k=c.deck.id+':'+c.id,e=S.review.find(r=>r.k===k);
  if(!e)return;
  S.review=S.review.filter(r=>r!==e);touchMeta();
}
function reviewItems(forDeck){
  const out=[];
  S.review.forEach(r=>{
    if(forDeck&&r.deck!==forDeck)return;
    const d=deckById(r.deck);if(!d)return;
    const c=d.cards.find(x=>x.id===r.card);if(!c)return;
    out.push({deck:d,card:c,key:r.k,e:r});
  });
  return out;
}

/* ----- records ----- */
function recordMatch(deck,ms){
  const st=deck.stats||(deck.stats={});
  const prev=st.matchBest==null?null:st.matchBest;
  const isBest=prev===null||ms<prev;
  if(isBest)st.matchBest=ms;
  st.matchPlays=(st.matchPlays||0)+1;st.matchLast=ms;
  touchDeck(deck);
  return{isBest,prev};
}
function recordTest(deck,right,total){
  const st=deck.stats||(deck.stats={});
  st.tests=(st.tests||[]).concat([{at:Date.now(),right,total}]).slice(-20);
  touchDeck(deck);
}

/* ----- Self-hosted shared database (no login) -----
   Talks to the small server in server.mjs, which serves this very page. What is
   written here is shared with everyone who opens the same server address. When
   there is no logged-in user (the normal case) we make up a random "anon id"
   and keep it in the browser, so each visitor has their own corner. */
const API_BASE='api/';
let AI=false;                 // becomes true once the server reports AI grading is on
const ANON_KEY='quizlet2.anon';
const TOKEN_KEY='quizlet2.token';
/* A secret, per-browser key used to prove "this deck is mine to change". It is
   never shown to anyone else and never stored in the shared data, so a stranger
   who can read the public decks still cannot overwrite or delete one. */
function randHex(n){
  try{const a=new Uint8Array(n);crypto.getRandomValues(a);let s='';for(const b of a)s+=('0'+b.toString(16)).slice(-2);return s;}
  catch(e){let s='';for(let i=0;i<n*2;i++)s+='0123456789abcdef'[Math.floor(Math.random()*16)];return s;}
}
function writeToken(){
  try{
    let v=localStorage.getItem(TOKEN_KEY);
    if(!v){v=randHex(32);localStorage.setItem(TOKEN_KEY,v);}
    return v;
  }catch(e){return randHex(32);}
}
function anonId(){
  try{
    let v=localStorage.getItem(ANON_KEY);
    if(!v){v='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem(ANON_KEY,v);}
    return v;
  }catch(e){return 'a'+Math.random().toString(36).slice(2,10);}
}
/* ----- signed-in account -----
   The session itself lives in an HttpOnly cookie the server sets; the profile is
   cached here only so the header can show who is signed in before the server
   answers. UID is the Google account id that owns this user's public decks/votes. */
const USER_KEY='quizlet2.user';
function storedUser(){try{const t=localStorage.getItem(USER_KEY);return t?JSON.parse(t):null;}catch(e){return null;}}
/* Whether this device has already folded its own decks into an account. The
   first sign-in on a device merges what is already here up into the account, so
   nothing is left behind; after that the account is the shared truth. */
const ACCT_KEY='quizlet2.acct.';
function acctSynced(uid){try{return localStorage.getItem(ACCT_KEY+uid)==='1';}catch(e){return false;}}
function markAcctSynced(uid){try{localStorage.setItem(ACCT_KEY+uid,'1');}catch(e){}}
function setUser(u){
  USER=(u&&u.sub)?u:null;UID=USER?USER.sub:null;
  try{if(USER)localStorage.setItem(USER_KEY,JSON.stringify(USER));else localStorage.removeItem(USER_KEY);}catch(e){}
  renderAccount();
  if(pubHook)pubChanged();
}
async function authApi(what,body){
  const r=await fetch(API_BASE+'auth/'+what,{
    method:body?'POST':'GET',cache:'no-store',credentials:'same-origin',
    headers:body?{'content-type':'application/json'}:undefined,
    body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
/* Ask the server who we are (the cookie is the real proof of identity). Falls
   back to the cached profile when the server can't be reached, so the header
   keeps its shape. Also returns the account id the personal area should use. */
async function resolveAuth(){
  if(!AUTH.on){setUser(null);return;}
  let j=null;
  try{j=await authApi('me');}catch(e){j=null;}
  if(j){if(j.clientId)AUTH.clientId=j.clientId;setUser(j.user||null);}
  else setUser(storedUser());
  loadGis();
  renderAccount();
}
let apiStream=null,apiSubs=[];
function onApiChange(fn){
  if(typeof EventSource==='undefined'){const t=setInterval(fn,15000);return()=>clearInterval(t);}
  if(!apiStream){
    apiStream=new EventSource(API_BASE+'stream');
    apiStream.onmessage=()=>apiSubs.forEach(f=>{try{f();}catch(e){}});
  }
  apiSubs.push(fn);
  return()=>{apiSubs=apiSubs.filter(f=>f!==fn);};
}
function apiDb(){
  const req=async(method,url,body)=>{
    const headers={};
    if(body)headers['content-type']='application/json';
    headers['x-write-token']=writeToken();
    const r=await fetch(url,{method,cache:'no-store',headers:Object.keys(headers).length?headers:undefined,body:body?JSON.stringify(body):undefined});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r;
  };
  const snap=docs=>({docs:docs.map(d=>({id:d.id,data:()=>d.data}))});
  const docRef=p=>({
    async set(data){await req('PUT',API_BASE+'doc/'+p,{data});},
    async delete(){await req('DELETE',API_BASE+'doc/'+p);}
  });
  return{
    doc:docRef,
    collection(name){
      return{
        doc:id=>docRef(name+'/'+id),
        async get(){const r=await req('GET',API_BASE+'col/'+name);return snap(await r.json());},
        onSnapshot(cb,errCb){
          const load=()=>req('GET',API_BASE+'col/'+name).then(r=>r.json()).then(d=>cb(snap(d))).catch(e=>{if(errCb)errCb(e);});
          const off=onApiChange(load);
          load();
          return off;
        }
      };
    }
  };
}
async function probeApi(){
  try{
    const r=await fetch(API_BASE+'health',{cache:'no-store'});
    if(!r.ok)return null;
    try{const j=await r.json();AI=!!(j&&j.ai);AUTH={on:!!(j&&j.auth),clientId:String((j&&j.clientId)||'')};}catch(e){}
    return apiDb();
  }catch(e){return null;}
}
/* Ask the server to have an AI judge whether a typed answer means the same as the
   expected one. Returns true/false, or null when AI grading is unavailable (no key,
   offline, rate-limited) — the caller then falls back to plain exact/near matching. */
async function aiGrade(q,a,u,blank){
  try{
    const r=await fetch(API_BASE+'grade',{method:'POST',cache:'no-store',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({q,a,u,t:blank?'blank':'text'})});
    if(!r.ok)return null;
    const j=await r.json();
    return j&&j.ok?(j.correct===true):null;
  }catch(e){return null;}
}
/* A short AI nudge about the meaning of the answer, or null when unavailable. */
async function aiHint(q,a){
  try{
    const r=await fetch(API_BASE+'hint',{method:'POST',cache:'no-store',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({q,a})});
    if(!r.ok)return null;
    const j=await r.json();
    return j&&j.ok?String(j.hint||''):null;
  }catch(e){return null;}
}

/* ----- the personal area -----
   When signed out it is this browser's own decks (keyed by the anonymous id);
   when signed in it is the account's decks (keyed by the Google id), so the
   same decks and progress meet on every device. */
async function readPersonal(c){
  const snap=await c.get();
  const decks=[],images={};let meta=null;
  snap.docs.forEach(s=>{
    const v=s.data();if(!v)return;
    if(s.id==='meta')meta=clone(v);
    else if(s.id.indexOf('d_')===0)decks.push(clone(v));
    else if(s.id.indexOf('i_')===0&&v.data)images[s.id.slice(2)]=v.data;
  });
  return {decks,images,meta};
}
function pushPersonal(){
  S.decks.forEach(d=>dbQueue('d_'+d.id,clone(d)));
  Object.keys(S.images).forEach(id=>dbQueue('i_'+id,{data:S.images[id]}));
  dbQueue('meta',metaDoc());
}
/* 'merge' keeps everything from both sides and sends the union up — used on the
   first sign-in on a device (nothing is left behind) and whenever this device
   has changes of its own. 'trust' takes the server's copy as the shared truth
   when there is one, so a deck deleted elsewhere does not come back. */
function applyPersonal(remote,mode){
  const hasRemote=!!remote&&((remote.decks&&remote.decks.length)||remote.meta);
  if(mode==='merge'||!hasRemote){
    if(remote&&remote.meta){
      if(!S.resume&&remote.meta.resume)S.resume=remote.meta.resume;
      if(remote.meta.linked)S.linked=true;
      /* A display name set on another device follows the account; a name set on
         this device wins on the first merge so it is not silently overwritten. */
      if(remote.meta.profile&&remote.meta.profile.name&&!(S.profile&&S.profile.name))S.profile=clone(remote.meta.profile);
    }
    if(remote){
      const have=new Set(S.decks.map(d=>d.id));
      remote.decks.forEach(d=>{if(!have.has(d.id))S.decks.push(d);});
      const keys=new Set(S.review.map(r=>r.k));
      ((remote.meta&&remote.meta.review)||[]).forEach(r=>{if(!keys.has(r.k))S.review.push(r);});
      Object.keys(remote.images).forEach(id=>{if(!S.images[id])S.images[id]=remote.images[id];});
    }
    pushPersonal();
  }else{
    S.decks=remote.decks;
    S.review=(remote.meta&&Array.isArray(remote.meta.review))?remote.meta.review:[];
    S.images=remote.images;
    S.resume=(remote.meta&&remote.meta.resume)||null;
    S.profile=(remote.meta&&remote.meta.profile)||{name:''};
    if(remote.meta&&remote.meta.linked)S.linked=true;
  }
}
async function connectDb(){
  let db=null,me=null,user=null;
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const got=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      db=got[0];
      user=got[1];
      if(user)me=await user.id();
    }
  }catch(e){db=null;}
  /* No Claude sign-in (or no Claude at all): fall back to this folder's own
     server. If it isn't reachable, everything keeps working from localStorage. */
  if(!db||!me){
    const api=await probeApi();
    if(api){if(!db)db=api;if(!me)me=anonId();}
  }
  if(db&&me){
    DB=db;ME=me;
    /* Who are we? With sign-in on, the session cookie is the proof, so ask the
       server before choosing the personal area. */
    await resolveAuth();
    /* The personal area follows the signed-in account, and this browser when
       signed out, so the same decks and progress meet on every device. */
    const key=UID||me;
    const fresh=!!UID&&!acctSynced(UID);
    try{
      const c=db.collection('data/users/'+key);
      const remote=await readPersonal(c);
      col=c;
      applyPersonal(remote,(dirty||fresh)?'merge':'trust');
      if(UID)markAcctSynced(UID);
    }catch(e){col=null;}
  }else if(AUTH.on){
    await resolveAuth();
  }
  hydrateAll();
  if(!S.linked){if(linkBuiltinCopies())hydrateAll();S.linked=true;touchMeta();}
  S.seeded=true;
  startPublic();
  pruneReview(true);
  if(!col&&!localLoaded)lsSave();
  if(pending&&navs===0&&(!pending.id||deckById(pending.id))){
    const pv=pending;pending=null;
    go(pv.name,Object.assign({},pv,{restore:pv.name==='edit',resume:!!resumeFor(pv.name,pv.id)&&!pv.review}));
  }else softRefresh();
}

/* Browser history. Every screen we open gets a history entry, so the browser
   Back button, the mouse back/forward buttons and a phone edge-swipe step
   through the app instead of dropping the visitor out of the page. navDepth
   counts the entries we pushed, which tells histBack whether it can pop. */
function viewState(){return {v:Object.assign({},view),n:navDepth};}
function histBase(){navDepth=0;try{window.history.replaceState(viewState(),'');}catch(e){}}
function go(name,params,opts){
  opts=opts||{};

  view=Object.assign({name},params||{});
  saveView();
  if(opts.replace)try{window.history.replaceState(viewState(),'');}catch(e){}
  else if(!opts.quiet){navDepth++;try{window.history.pushState(viewState(),'');}catch(e){navDepth--;}}

/* Long-press (touch) = secondary click. The capture-phase click handler stops
   the tap that follows the long press from also opening the deck. */
function longPress(el,fn){
  let t=null,sx=0,sy=0,fired=false;
  const clear=()=>{if(t){clearTimeout(t);t=null;}};
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse')return;
    fired=false;sx=e.clientX;sy=e.clientY;clear();
    t=setTimeout(()=>{t=null;fired=true;try{fn();}catch(err){}},550);
  });
  el.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)clear();});
  el.addEventListener('pointerup',clear);
  el.addEventListener('pointercancel',clear);
  el.addEventListener('click',e=>{if(fired){fired=false;e.preventDefault();e.stopPropagation();}},true);
}

    catch(e){ta.focus();ta.select();try{document.execCommand('copy');note.textContent='Copied to the clipboard.';}catch(e2){note.textContent='Select the text and copy it by hand.';}}
  }
  const dlBtn=btn('Save as .txt',{cls:'ghost',icon:'export',onclick:async()=>{
    try{
      const dl=await window.claude.use('downloads');
      if(!dl){note.textContent='Saving files is not available here. Use Copy instead.';return;}
      const name=(deck.title.replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-+|-+$/g,'')||'deck')+'.txt';
      await dl.save({filename:name,data:ta.value});
    }catch(e){if(!e||e.code!=='declined')note.textContent='Could not save the file. Use Copy instead.';}
  }});
  dlBtn.hidden=!(window.claude&&typeof window.claude.use==='function');
  build();
  return h('div',{class:'wrap view'},
    h('div',{class:'form'},
      btn('Back to deck',{cls:'link',icon:'back',onclick:()=>histBack('deck',{id:deck.id})}),
      h('h1',null,'Export “'+deck.title+'”'),
      h('div',{class:'field'},h('span',{class:'lbl'},'Separator'),
        seg([[';','; semicolon'],[':',': colon'],['-','- dash'],[',',', comma']],sep,v=>{sep=v;build();},'Separator')),
      ta,note,
      h('div',{class:'form-actions'},btn('Copy text',{cls:'primary',icon:'check',onclick:copy}),dlBtn)));
}

/* =====================================================================
   Create / edit deck
   ===================================================================== */
function editView(p){
  const orig=p.id?deckById(p.id):null;
  if(p.id&&!orig)return missing();
  const blank=()=>({id:uid(),w:'',d:'',e:''});
  let saved=null;
  if(p.restore){try{const o=JSON.parse(sessionStorage.getItem(DKEY)||'null');if(o&&o.forId===(p.id||null))saved=o.draft;}catch(e){}}
  const draft=saved||(orig?clone(orig):{id:uid(),title:'',desc:'',choize:true,example:false,color:'',langW:'',langD:'',aiHint:true,aiGrade:true,cards:[blank()],created:Date.now()});
  if(!draft.cards||!draft.cards.length)draft.cards=[blank()];
  draft.langW=draft.langW||'';draft.langD=draft.langD||'';draft.color=safeColor(draft.color);
  if(draft.aiHint==null)draft.aiHint=true;
  if(draft.aiGrade==null)draft.aiGrade=true;
  const newImgs=new Set();
  if(saved){const used=usedImages();draft.cards.forEach(c=>['wi','di'].forEach(k=>{if(c[k]&&!used.has(c[k]))newImgs.add(c[k]);}));}
  let lastField=null,saveT=null;
  function persist(){
    clearTimeout(saveT);
    saveT=setTimeout(()=>{try{sessionStorage.setItem(DKEY,JSON.stringify({forId:p.id||null,draft}));}catch(e){}},300);
  }
  onLeave(()=>{clearTimeout(saveT);try{sessionStorage.removeItem(DKEY);}catch(e){}});

  const title=h('input',{id:'f-title',class:'in',type:'text',maxlength:'80',placeholder:'e.g. Biology: parts of a cell',value:draft.title,oninput:e=>{draft.title=e.target.value;persist();}});
  const desc=h('textarea',{id:'f-desc',class:'in',rows:'2',maxlength:'240',placeholder:'What is this deck for? (optional)',oninput:e=>{draft.desc=e.target.value;persist();}},draft.desc);

  const sw=h('button',{type:'button',role:'switch',class:'switch',id:'f-choize','aria-labelledby':'choize-l','aria-checked':String(draft.choize),onclick:()=>{
    draft.choize=!draft.choize;sw.setAttribute('aria-checked',String(draft.choize));persist();renderSlots();
  }},h('span',{class:'knob'}));
  const exSw=h('button',{type:'button',role:'switch',class:'switch',id:'f-example','aria-labelledby':'example-l','aria-checked':String(!!draft.example),onclick:()=>{
    draft.example=!draft.example;exSw.setAttribute('aria-checked',String(draft.example));persist();renderSlots();
  }},h('span',{class:'knob'}));
  const aiHintSw=h('button',{type:'button',role:'switch',class:'switch',id:'f-aihint','aria-labelledby':'aihint-l','aria-checked':String(!!draft.aiHint),onclick:()=>{
    draft.aiHint=!draft.aiHint;aiHintSw.setAttribute('aria-checked',String(draft.aiHint));persist();
  }},h('span',{class:'knob'}));
  const aiGradeSw=h('button',{type:'button',role:'switch',class:'switch',id:'f-aigrade','aria-labelledby':'aigrade-l','aria-checked':String(!!draft.aiGrade),onclick:()=>{
    draft.aiGrade=!draft.aiGrade;aiGradeSw.setAttribute('aria-checked',String(draft.aiGrade));persist();
  }},h('span',{class:'knob'}));
  const infoBtn=h('button',{type:'button','aria-label':'What is Fill in the blank?','aria-expanded':'false',onclick:()=>{
    const o=info.classList.toggle('open');infoBtn.setAttribute('aria-expanded',String(o));
  }},icon('info'));
  const info=h('span',{class:'info'},infoBtn,h('span',{class:'tip',role:'tooltip'},
    'Fill in the blank turns words in {curly brackets} into blanks. Write “Paris; {the capital} of {France}” and Write asks “Paris = ____ of France” or “Paris = the capital of ____”.'));
  const closeInfo=e=>{if(!info.contains(e.target)){info.classList.remove('open');infoBtn.setAttribute('aria-expanded','false');}};
  document.addEventListener('click',closeInfo);
  onLeave(()=>document.removeEventListener('click',closeInfo));

  const langSel=(id,key,label)=>{
    const s=h('select',{id,class:'in',onchange:e=>{draft[key]=e.target.value;persist();}},LANGS.map(l=>h('option',{value:l[0]},l[1])));
    s.value=draft[key];
    return h('div',{class:'field'},h('label',{for:id},label),s);
  };

  const slotsBox=h('div',{class:'slots'});
  const countEl=h('span',{class:'sub mono'});
  const err=h('p',{class:'err',role:'alert'});

  function wrapSel(inp,l,r){
    const s=inp.selectionStart,e=inp.selectionEnd,v=inp.value;
    if(s===e){err.textContent='Select some text in the field first, then press the button.';return;}
    err.textContent='';
    inp.value=v.slice(0,s)+l+v.slice(s,e)+r+v.slice(e);
    inp.focus();inp.setSelectionRange(s+l.length,e+l.length);
    inp.dispatchEvent(new Event('input',{bubbles:true}));
  }
  async function attach(c,key,file){
    if(!file||file.type.indexOf('image/')!==0)return;
    try{
      const data=await shrink(file);
      const id=uid();S.images[id]=data;newImgs.add(id);
      c[key]=id;err.textContent='';persist();renderSlots();
    }catch(e){err.textContent='Could not read that image. Try a PNG or JPEG.';}
  }
  function cell(c,side,i,number){
    const imgKey=side==='w'?'wi':'di';
    const pv=h('div',{class:'preview'});
    const upd=()=>{
      if(/[*{]/.test(c[side])){pv.replaceChildren(h('span',{class:'pv-l'},'Preview'),previewNode(c[side]));pv.hidden=false;}
      else pv.hidden=true;
    };
    const inp=h('input',{id:side+'-'+c.id,class:'in',type:'text',maxlength:side==='w'?'100':'320',placeholder:side==='w'?'Word':'Definition','aria-label':(side==='w'?'Word ':'Definition ')+(i+1),value:c[side],
      oninput:e=>{c[side]=e.target.value;upd();persist();},
      onfocus:()=>{lastField=inp;},
      onpaste:e=>{
        const items=(e.clipboardData&&e.clipboardData.items)||[];
        for(let n=0;n<items.length;n++){
          if(items[n].kind==='file'&&items[n].type.indexOf('image/')===0){e.preventDefault();attach(c,imgKey,items[n].getAsFile());return;}
        }
      },
      onkeydown:e=>{
        if(e.key==='Enter'&&e.shiftKey){e.preventDefault();addAfter(i);return;}
        if(e.key!=='Enter')return;
        e.preventDefault();
        if(side==='w'){document.getElementById('d-'+c.id).focus();return;}
        if(draft.example){const ex=document.getElementById('e-'+c.id);if(ex){ex.focus();return;}}
        const nx=draft.cards[i+1];
        if(nx)document.getElementById('w-'+nx.id).focus();else addAfter(i);
      }});
    upd();
    const file=h('input',{type:'file',accept:'image/*',class:'sr-only',tabindex:'-1','aria-hidden':'true',onchange:e=>{attach(c,imgKey,e.target.files[0]);}});
    const fbtn=(label,tip,l,r,cls)=>h('button',{type:'button',class:'fmt '+(cls||''),title:tip,'aria-label':tip,onclick:()=>wrapSel(inp,l,r)},label);
    const has=c[imgKey]&&S.images[c[imgKey]];
    const img=k=>h('button',{type:'button',class:'in-img',title:'Add an image (you can also paste one)','aria-label':'Add an image to '+(side==='w'?'word ':'definition ')+(i+1),onclick:()=>k.click()},icon('image'));
    return h('div',{class:'cell c'+side},
      h('div',{class:'cell-top'},
        number?h('span',{class:'slot-n'},String(number)):null,
        h('span',{class:'cell-lbl'},side==='w'?'Word':'Definition')),
      h('div',{class:'in-wrap'},inp,img(file)),
      has?h('span',{class:'thumb'},h('img',{src:S.images[c[imgKey]],alt:''}),
        h('button',{type:'button',class:'icon-btn sm',title:'Remove image','aria-label':'Remove image',onclick:()=>{c[imgKey]=null;persist();renderSlots();}},icon('x'))):null,
      pv,file,
      (side==='d'&&draft.choize)?h('div',{class:'cell-t'},h('span',{class:'fmt-group'},fbtn('Blank','Hide the selected word when you practise (Fill in the blank)','{','}','blankbtn'))):null);
  }
  function exCell(c,i){
    const pv=h('div',{class:'preview'});
    const upd=()=>{
      if(/[*{]/.test(c.e||'')){pv.replaceChildren(h('span',{class:'pv-l'},'Preview'),previewNode(c.e));pv.hidden=false;}
      else pv.hidden=true;
    };
    const inp=h('input',{id:'e-'+c.id,class:'in',type:'text',maxlength:'320',placeholder:'Example (shown after the answer)','aria-label':'Example '+(i+1),value:c.e||'',
      oninput:e=>{c.e=e.target.value;upd();persist();},
      onfocus:()=>{lastField=inp;},
      onkeydown:e=>{
        if(e.key==='Enter'&&e.shiftKey){e.preventDefault();addAfter(i);return;}
        if(e.key!=='Enter')return;
        e.preventDefault();
        const nx=draft.cards[i+1];
        if(nx)document.getElementById('w-'+nx.id).focus();else addAfter(i);
      }});
    upd();
    return h('div',{class:'cell ce'},
      h('div',{class:'cell-top'},h('span',{class:'exnote'},'Shown after the answer'),h('span',{class:'cell-lbl'},'Example')),
      inp,pv);
  }
  function renderSlots(focusId){
    lastField=null;
    slotsBox.classList.toggle('has-ex',!!draft.example);
    slotsBox.replaceChildren(...draft.cards.map(slot));
    countEl.textContent=draft.cards.length+(draft.cards.length===1?' card':' cards');
    persist();
    if(focusId){const el=document.getElementById(focusId);if(el)el.focus();}
  }
  function addAfter(i){const c=blank();draft.cards.splice(i+1,0,c);renderSlots('w-'+c.id);}
  function removeAt(i){
    if(draft.cards.length===1){const c=draft.cards[0];c.w='';c.d='';c.e='';c.wi=null;c.di=null;renderSlots('w-'+c.id);return;}
    draft.cards.splice(i,1);renderSlots();
  }
  function slot(c,i){
    return h('div',{class:'slot'},
      cell(c,'w',i,i+1),cell(c,'d',i),draft.example?exCell(c,i):null,
      h('div',{class:'slot-a'},
        h('button',{type:'button',class:'icon-btn',title:'Remove this card','aria-label':'Remove card '+(i+1),onclick:()=>removeAt(i)},icon('trash'))));
  }

  /* bulk paste: one card per line, always "word ; definition" */
  const BULK_EX='ocean ; a large body of salt water\nParis ; The capital of France';
  const bulkInfo=h('p',{class:'bulk-info','aria-live':'polite'});
  const addBulk=btn('Add cards',{cls:'ghost',icon:'plus',disabled:true,onclick:doBulk});
  const bulk=h('textarea',{id:'bulk',class:'in mono',rows:'5',placeholder:BULK_EX,oninput:updBulk});
  function updBulk(){
    const r=parseBulk(bulk.value,';');
    addBulk.disabled=!r.pairs.length;
    addBulk.lastChild.textContent=r.pairs.length?'Add '+r.pairs.length+(r.pairs.length===1?' card':' cards'):'Add cards';
    bulkInfo.textContent=bulk.value.trim()?(r.pairs.length+' found'+(r.skipped.length?' · '+r.skipped.length+' skipped (needs word ; definition)':'')):'';
  }
  function doBulk(){
    const r=parseBulk(bulk.value,';');if(!r.pairs.length)return;
    const added=r.pairs.map(x=>({id:uid(),w:x.w,d:x.d,e:x.e||''}));
    if(added.some(c=>c.e)){draft.example=true;if(exSw)exSw.setAttribute('aria-checked','true');}
    const kept=draft.cards.filter(c=>c.w.trim()||c.d.trim()||c.wi||c.di||(c.e||'').trim());
    draft.cards=kept.concat(added);
    bulk.value='';updBulk();renderSlots();
  }

  function leaveEdit(){
    newImgs.forEach(id=>{delete S.images[id];});
    if(orig)histBack('deck',{id:orig.id});else histBack('home');
  }
  function save(){
    err.textContent='';
    const t=draft.title.trim();
    if(!t){err.textContent='Give the deck a title.';title.focus();return;}
    const out=[];
    for(let i=0;i<draft.cards.length;i++){
      const c=draft.cards[i],w=c.w.trim(),d=c.d.trim(),ex=(c.e||'').trim();
      if(!w&&!d&&!ex&&!c.wi&&!c.di)continue;
      if(!w||!d){err.textContent='Card '+(i+1)+' is missing its '+(w?'definition':'word')+'.';const el=document.getElementById((w?'d-':'w-')+c.id);if(el)el.focus();return;}
      const card={id:c.id,w,d};
      if(draft.example&&ex)card.e=ex;
      if(c.wi&&S.images[c.wi])card.wi=c.wi;
      if(c.di&&S.images[c.di])card.di=c.di;
      out.push(card);
    }
    if(!out.length){err.textContent='Add at least one card with a word and a definition.';return;}
    let target;
    const fields={title:t,desc:draft.desc.trim(),choize:draft.choize,example:!!draft.example,color:safeColor(draft.color),langW:draft.langW,langD:draft.langD,aiHint:!!draft.aiHint,aiGrade:!!draft.aiGrade,cards:out};
    if(orig){Object.assign(orig,fields);if(orig.src){delete orig.src;orig.noLink=true;}target=orig;}
    else{target=Object.assign({id:draft.id,created:draft.created},fields);S.decks.push(target);}
    touchDeck(target);syncImages(Array.from(newImgs));pruneReview(false);
    go('deck',{id:target.id});
  }

  const root=h('div',{class:'wrap view'},
    h('div',{class:'form'},
      btn(orig?'Back to deck':'All decks',{cls:'link',icon:'back',onclick:leaveEdit}),
      h('h1',null,orig?'Edit deck':'New deck'),
      orig&&orig.src?h('p',{class:'hint'},'This deck is linked to the built-in deck. Saving your edits makes it your own copy, and it stops following the built-in version.'):null,
      h('div',{class:'field'},h('label',{for:'f-title'},'Title'),title),
      h('div',{class:'field'},h('label',{for:'f-desc'},'Description'),desc),
      h('div',{class:'field'},h('span',{class:'lbl'},'Colour'),
        colorSwatches(draft.color,v=>{draft.color=v;persist();}),
        h('p',{class:'hint'},'Tints the deck card on the home and browse pages.')),
      h('div',{class:'setting'},
        h('div',{class:'setting-l'},
          h('div',{class:'row',style:'gap:4px'},h('strong',{id:'choize-l'},'Fill in the blank'),info),
          h('p',{class:'hint'},'Fill-in-the-blank cards. Put a word in {curly brackets} and it becomes a blank when you practise.')),sw),
      h('div',{class:'setting'},
        h('div',{class:'setting-l'},
          h('strong',{id:'example-l'},'Example'),
          h('p',{class:'hint'},'Adds a third field to each card. An example is shown only after you answer — never in the question or the choices.')),exSw),
      h('div',{class:'setting'},
        h('div',{class:'setting-l'},
          h('strong',{id:'aihint-l'},'AI hints'),
          h('p',{class:'hint'},'Adds an AI hint button to Write. The letter hint still works without it. Needs AI on the server.')),aiHintSw),
      h('div',{class:'setting'},
        h('div',{class:'setting-l'},
          h('strong',{id:'aigrade-l'},'AI grading'),
          h('p',{class:'hint'},'Lets the AI re-check typed answers that the exact match rejects, so a paraphrase can count. When on, the “very close, try again?” prompt is skipped. Needs AI on the server.')),aiGradeSw),
      TTS?h('div',{class:'field'},h('span',{class:'lbl'},'Read aloud languages'),
        h('div',{class:'two'},langSel('f-lw','langW','Words'),langSel('f-ld','langD','Definitions')),
        h('p',{class:'hint'},'Used by the speaker buttons. Your device needs a voice for the language.')):null,
      h('div',{class:'field'},
        h('div',{class:'sec-h',style:'margin-bottom:0'},h('span',{class:'lbl'},'Cards'),countEl),
        h('p',{class:'hint'},'Click into a box to add an image (you can also paste one). In a definition you can select a word and turn it into a blank.'),
        slotsBox,
        btn('Add card',{cls:'ghost add-card',icon:'plus',onclick:()=>addAfter(draft.cards.length-1)})),
      h('details',{class:'paste'},
        h('summary',null,'Paste many cards at once'),
        h('div',{class:'bulk'},
          h('p',{class:'hint'},'One card per line: word ; definition. Add an optional third part for an example: word ; definition ; example. Example: ',h('span',{class:'mono'},'Paris ; The capital of France'),' ',h('button',{type:'button',class:'btn link',style:'padding:2px 4px;font-size:13px',onclick:()=>{bulk.value='Paris ; The capital of France';updBulk();bulk.focus();}},'Insert example')),
          bulk,bulkInfo,h('div',null,addBulk))),
      err,
      h('div',{class:'form-actions'},
        btn(orig?'Save changes':'Create deck',{cls:'primary',icon:'check',onclick:save}),
        btn('Cancel',{cls:'ghost',onclick:leaveEdit}))));
  renderSlots();
  setTimeout(()=>{if(!orig&&!saved)title.focus();},0);
  return root;
}

/* =====================================================================
   Flashcards
   ===================================================================== */
function flashView(p){
  const deck=deckById(p.id);if(!deck)return missing();
  const total=deck.cards.length;
  let order=deck.cards.slice(),i=0,flipped=false,front='w',auto=false,ft=null;
  const fr=p.resume?resumeFor('flash',deck.id):null;
  if(fr&&fr.data&&fr.data.i>0&&fr.data.i<total)i=fr.data.i;
  const i0=i;
  const face=h('div',{class:'fc-face'});
  const inner=h('div',{class:'fc-inner'},face);
  const card=h('div',{class:'fc',role:'button',tabindex:'0','aria-label':'Flip card',onmousedown:e=>e.preventDefault()},inner);
  const stage=h('div',{class:'fc-stage'},card);
  const cnt=h('span',{class:'count','aria-live':'polite'});
  /* Mouse clicks must not leave the nav buttons focused: otherwise Space would
     press the last arrow again instead of flipping the card. */
  const prev=h('button',{type:'button',class:'round','aria-label':'Previous card',onmousedown:e=>e.preventDefault(),onclick:()=>move(-1)},icon('back'));
  const next=h('button',{type:'button',class:'round','aria-label':'Next card',onmousedown:e=>e.preventDefault(),onclick:()=>move(1)},icon('next'));
  const sideShown=()=>flipped?(front==='w'?'d':'w'):front;
  function say(){const c=order[i],s=sideShown();speak(c[s],langOf(deck,s));}
  const spk=speakBtn(()=>[{t:order[i][sideShown()],lang:langOf(deck,sideShown())}],'big');
  onLeave(()=>clearTimeout(ft));
  function paintFace(){
    const c=order[i],s=sideShown(),text=c[s],img=s==='w'?c.wi:c.di;
    face.classList.toggle('back',flipped);
    const kids=[h('span',{class:'fc-label'},s==='w'?'Word':'Definition'),
      h('div',{class:'fc-body'},cimg(img,'fc-img'),h('div',{class:'fc-text '+fcClass(plain(text))},rich(text)))];
    if(flipped&&deck.example&&c.e&&String(c.e).trim())kids.push(exLine(c.e));
    face.replaceChildren(...kids);
    cnt.textContent=(i+1)+' / '+total;
    prev.disabled=i===0;next.disabled=i===total-1;
  }
  function show(n,dir){
    clearTimeout(ft);
    i=n;flipped=false;paintFace();
    if(i>0&&i<total-1)setResume('flash',deck.id,'Card '+(i+1)+' of '+total,{i});
    else if(i>=total-1&&total>1)clearResume('flash',deck.id);
    if(dir){stage.classList.remove('in-next','in-prev');void stage.offsetWidth;stage.classList.add(dir>0?'in-next':'in-prev');}
    if(auto)say();
  }
  function move(d){const n=i+d;if(n<0||n>=total)return;show(n,d);}
  function flip(){
    flipped=!flipped;
    inner.classList.remove('turn');void inner.offsetWidth;inner.classList.add('turn');
    clearTimeout(ft);ft=setTimeout(paintFace,140);
    if(auto)say();
  }
  let sx=0,sy=0,swiped=false;
  stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;swiped=false;});
  stage.addEventListener('pointerup',e=>{
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){swiped=true;move(dx<0?1:-1);}
  });
  card.addEventListener('click',()=>{if(swiped){swiped=false;return;}flip();});
  setKeys(e=>{
    const t=e.target.tagName;
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
      e.preventDefault();
      if(t==='BUTTON'&&e.target.blur)e.target.blur();
      move(e.key==='ArrowLeft'?-1:1);
    }
    else if((e.key===' '||e.key==='Enter'||e.key==='ArrowUp'||e.key==='ArrowDown')&&!e.repeat&&t!=='BUTTON'&&t!=='INPUT'&&t!=='SELECT'){e.preventDefault();flip();}
  });
  const shufBtn=btn('Shuffle',{cls:'ghost',icon:'shuffle',onclick:()=>{
    order=shuffle(deck.cards);show(0);
    shufBtn.lastChild.textContent='Shuffle again';
  }});
  const opts=h('div',{class:'opts'},
    seg([['w','Word first'],['d','Definition first']],front,v=>{front=v;show(i);},'Which side shows first'),
    shufBtn,
    TTS?toggle('Read aloud automatically',false,on=>{auto=on;if(on)say();else stopSpeech();}):null);
  show(i0);
  return h('div',{class:'wrap view'},
    studyBar('Flashcards · '+deck.title,'Back',()=>histBack('deck',{id:deck.id})),
    stage,
    h('div',{class:'fc-nav'},prev,h('div',{class:'cnt-wrap'},cnt,spk),next),
    opts,
    h('p',{class:'center-hint desk-only'},'← → to move · Space to flip'),
    h('p',{class:'center-hint touch-only'},'Tap the card to flip it. Swipe left or right to change card.'));
}

/* =====================================================================
   Match engine + view (words on the left, definitions on the right)
   ===================================================================== */
function matchEngine(box,cards,o){
  o=o||{};
  const per=pairsPerRound(cards.length);
  const rounds=chunk(shuffle(cards),per);
  let ri=0,sel=null,busy=false,tiles=[],left=0,wrongTries=0,dead=false;
  const t0=Date.now(),mistakes=new Set();
  const roundEl=h('span'),missEl=h('span'),timeEl=h('span',{class:'mono'},'0:00');
  const bestEl=o.best!=null?h('span',{class:'mono'},'Best '+fmt(o.best)):null;
  const listL=h('div',{class:'mlist'}),listR=h('div',{class:'mlist'});
  const grid=h('div',{class:'mgrid'},
    h('div',{class:'mcol'},h('p',{class:'mcol-h'},'Words'),listL),
    h('div',{class:'mcol'},h('p',{class:'mcol-h'},'Definitions'),listR));
  box.replaceChildren(h('div',{class:'mbar'},roundEl,missEl,bestEl,timeEl),grid);
  const tick=setInterval(()=>{timeEl.textContent=fmt(Date.now()-t0);},250);
  function start(){
    const r=rounds[ri];
    const ws=shuffle(r.map(c=>({kind:'w',card:c,text:c.w,img:c.wi})));
    const ds=shuffle(r.map(c=>({kind:'d',card:c,text:c.d,img:c.di})));
    tiles=ws.concat(ds);
    tiles.forEach((t,n)=>{
      t.done=false;
      t.el=h('button',{type:'button',class:'tile k-'+t.kind,onclick:()=>pick(t)},
        h('span',{class:'kc'},String((n+1)%10)),h('span',{class:'tt'},cimg(t.img,'t-img'),h('span',null,rich(t.text))));
    });
    listL.replaceChildren(...ws.map(t=>t.el));
    listR.replaceChildren(...ds.map(t=>t.el));
    left=r.length;sel=null;busy=false;
    roundEl.textContent=rounds.length>1?'Round '+(ri+1)+' of '+rounds.length:'Match the pairs';
    missEl.textContent=wrongTries+(wrongTries===1?' mistake':' mistakes');
  }
  function pick(t){
    if(dead||busy||t.done)return;
    if(sel===t){t.el.classList.remove('sel');sel=null;return;}
    if(!sel||sel.kind===t.kind){
      if(sel)sel.el.classList.remove('sel');
      sel=t;t.el.classList.add('sel');return;
    }
    const a=sel,b=t;sel=null;
    a.el.classList.remove('sel');
    if(a.card===b.card){
      a.done=b.done=true;a.el.disabled=b.el.disabled=true;
      a.el.classList.add('ok');b.el.classList.add('ok');
      left--;
      setTimeout(()=>{
        if(dead)return;
        [a,b].forEach(x=>{x.el.classList.remove('ok');x.el.classList.add('done');});
        if(left===0)nextRound();
      },520);
    }else{
      busy=true;wrongTries++;
      mistakes.add(a.card.id);mistakes.add(b.card.id);
      markWrong(a.card);markWrong(b.card);
      missEl.textContent=wrongTries+(wrongTries===1?' mistake':' mistakes');
      a.el.classList.add('bad');b.el.classList.add('bad');
      setTimeout(()=>{
        if(dead)return;
        a.el.classList.remove('bad');b.el.classList.remove('bad');busy=false;
      },480);
    }
  }
  function nextRound(){
    ri++;
    if(ri<rounds.length){start();return;}
    clearInterval(tick);
    cards.forEach(c=>{if(!mistakes.has(c.id))markRight(c);});
    if(o.onDone)o.onDone({mistakes,wrongTries,ms:Date.now()-t0});
  }
  function onKey(e){
    if(!/^[0-9]$/.test(e.key))return;
    const idx=e.key==='0'?9:(+e.key-1);
    if(tiles[idx]){e.preventDefault();pick(tiles[idx]);}
  }
  start();
  return{onKey,destroy(){dead=true;clearInterval(tick);}};
}
