<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quizlet 2.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: one calm column, ink-on-paper, with a highlighter-yellow marker used only for "this is active / this is you". */
:root{
  --bg:#F3F4FA; --surface:#FFFFFF; --surface-2:#E8EAF5;
  --ink:#151A3F; --ink-2:#555B86; --line:#D3D7EA;
  --hl:#FFE45C; --on-hl:#151A3F; --mark:#FFE45C;
  --warn:#9A6A00; --warn-bg:#FFF2C2; --good:#0E8F58; --good-bg:#DDF5E9; --bad:#C93A31; --bad-bg:#FCE3E0;
  --shadow:0 1px 0 rgba(21,26,63,.06), 0 10px 26px -14px rgba(21,26,63,.30);
  --f-display:'Familjen Grotesk','Helvetica Neue',Arial,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1026; --surface:#161A3A; --surface-2:#20254B;
    --ink:#EDEFFF; --ink-2:#A4AADB; --line:#2D3364;
    --hl:#FFE45C; --on-hl:#151A3F; --mark:rgba(255,228,92,.34);
    --warn:#FFD166; --warn-bg:#3F3411; --good:#4BD88F; --good-bg:#12382B; --bad:#FF8279; --bad-bg:#472122;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1026; --surface:#161A3A; --surface-2:#20254B;
  --ink:#EDEFFF; --ink-2:#A4AADB; --line:#2D3364;
  --hl:#FFE45C; --on-hl:#151A3F; --mark:rgba(255,228,92,.34);
  --warn:#FFD166; --warn-bg:#3F3411; --good:#4BD88F; --good-bg:#12382B; --bad:#FF8279; --bad-bg:#472122;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{display:inline-flex;flex:none}
.i svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mark{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 93%,transparent 93%);padding:0 .1em;margin:0 -.1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.wrap{width:100%;max-width:1040px;margin-inline:auto;padding-inline:clamp(16px,4vw,28px)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;height:60px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 6px 4px 0;font:700 21px/1 var(--f-display);letter-spacing:-.02em}
.brand svg{width:32px;height:32px;flex:none}
.brand b{font:500 13px/1 var(--f-mono);background:var(--hl);color:var(--on-hl);padding:4px 6px;border-radius:5px;transform:rotate(-3deg);letter-spacing:0}
.logo-c1{fill:var(--surface-2);stroke:var(--ink);stroke-width:2}
.logo-c2{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.logo-hl{fill:var(--hl)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;line-height:1.2;text-decoration:none;transition:transform .12s, background .12s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:none}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.hl{background:var(--hl);color:var(--on-hl);border-color:var(--hl)}
.btn.ghost{border-color:var(--line);background:var(--surface)}
.btn.ghost:hover:not(:disabled){border-color:var(--ink)}
.btn.link{border-color:transparent;padding-inline:8px;color:var(--ink-2)}
.btn.link:hover:not(:disabled){color:var(--ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border:0;border-radius:9px;background:transparent;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.round{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:background .12s,border-color .12s}
.round:hover:not(:disabled){border-color:var(--ink);background:var(--hl);color:var(--on-hl)}
.round:disabled{opacity:.35}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* views */
.view{padding-block:28px 80px;animation:rise .25s ease both}
@keyframes rise{from{transform:translateY(5px)}to{transform:none}}
.eyebrow{font:500 12px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.sec{margin-top:48px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-h h2{font-size:1.6rem}
.sub{color:var(--ink-2)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:center}
.hero-copy{display:grid;gap:18px;justify-items:start}
.hero h1{font-size:clamp(2.3rem,6vw,3.9rem);line-height:1.02;font-weight:700;letter-spacing:-.03em}
.lead{font-size:1.15rem;color:var(--ink-2);max-width:46ch}
.hero-art svg{display:block;width:100%;max-width:440px;height:auto;margin-inline:auto}
.art .c3{fill:var(--surface-2);stroke:var(--line);stroke-width:2}
.art .c2{fill:var(--surface);stroke:var(--line);stroke-width:2}
.art .c1{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.art .swipe{fill:var(--mark)}
.art .t1{font:700 46px var(--f-display);fill:var(--ink);letter-spacing:-1px}
.art .t2{font:500 17px var(--f-body);fill:var(--ink-2)}
.art .t3{font:500 13px var(--f-mono);fill:var(--ink-2)}
.art .key{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.art .kt{font:500 15px var(--f-mono);fill:var(--ink)}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:20px}}

/* decks */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.deck{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:150px;width:100%;padding:18px;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:16px;transition:border-color .12s, transform .12s}
.deck:hover{border-color:var(--ink);transform:translateY(-2px)}
.deck h3{font-size:1.2rem;line-height:1.2;overflow-wrap:anywhere}
.deck p{color:var(--ink-2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.deck .meta{margin-top:auto;font:500 12px var(--f-mono);color:var(--ink-2)}
.deck.new{border-style:dashed;align-items:center;justify-content:center;gap:6px;background:transparent;color:var(--ink-2);font-weight:600}
.deck.new .i svg{width:1.8em;height:1.8em}
.tag{display:inline-block;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--ink-2);padding:2px 7px;border-radius:999px}
.add-round{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);background:var(--hl);color:var(--on-hl);display:grid;place-items:center;flex:none}
.add-round:hover{transform:rotate(90deg)}
.add-round{transition:transform .2s}

/* review */
.review{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:22px}
.review ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.rv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:10px 4px 10px 12px;border-radius:10px;background:var(--bg)}
.rv-t{min-width:0;overflow-wrap:anywhere}
.rv-t .arrow{color:var(--ink-2);margin-inline:8px}
.rv-deck{grid-column:1;font:500 12px var(--f-mono);color:var(--ink-2)}
.rv .icon-btn{grid-row:1/3;grid-column:2}

/* hub */
.hub-top{display:grid;gap:12px;margin:8px 0 28px}
.hub-top h1{font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.08;overflow-wrap:anywhere}
.hub-top .desc{color:var(--ink-2);max-width:62ch;white-space:pre-wrap;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fns{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,185px),1fr));gap:12px}
.fn{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:18px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);transition:transform .12s,border-color .12s}
.fn:hover:not(:disabled){border-color:var(--ink);transform:translateY(-2px)}
.fn:hover:not(:disabled) .fn-i{background:var(--hl);color:var(--on-hl)}
.fn-i{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);transition:background .12s}
.fn h3{font-size:1.15rem}
.fn p{color:var(--ink-2);font-size:14px}
.fn:disabled{opacity:.55}
.note-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-top:16px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
details.cards-list{margin-top:28px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
details.cards-list summary{padding:14px 16px;font-weight:600;cursor:pointer}
.cl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:6px 20px;padding:0 16px 16px}
.cl div{padding:8px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.cl .h{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);border:0;padding-bottom:0}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--bad-bg);border:1.5px solid var(--bad)}

/* forms */
.form{max-width:780px;display:grid;gap:22px}
.form h1{font-size:clamp(1.8rem,5vw,2.4rem)}
.field{display:grid;gap:7px}
.field>label,.lbl{font-weight:600;font-size:14px}
.in{width:100%;padding:11px 13px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;font:inherit;line-height:1.4}
.in:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--mark)}
.in::placeholder{color:var(--ink-2);opacity:.7}
textarea.in{resize:vertical;min-height:44px}
.in.big{font-size:1.2rem;padding:14px 16px}
.hint{font-size:13px;color:var(--ink-2)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.setting-l{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.setting-l strong{font-family:var(--f-display);font-size:1.1rem}
.info{position:relative;display:inline-flex}
.info>button{width:30px;height:30px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.info>button:hover{color:var(--ink);background:var(--surface-2)}
.tip{display:none;position:absolute;left:0;top:36px;z-index:3;width:min(300px,78vw);padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;line-height:1.45;box-shadow:var(--shadow)}
.info.open .tip{display:block}
@media (hover:hover) and (pointer:fine){.info:hover .tip{display:block}}
.switch{width:46px;height:27px;border-radius:999px;background:var(--surface-2);border:1.5px solid var(--ink-2);position:relative;padding:0;flex:none;transition:background .15s,border-color .15s}
.switch .knob{position:absolute;top:2.5px;left:2.5px;width:19px;height:19px;border-radius:50%;background:var(--ink);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--hl);border-color:var(--ink)}
.switch[aria-checked="true"] .knob{transform:translateX(19px);background:var(--on-hl)}
.switch:disabled{opacity:.5}
.tg{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 0;font-weight:500}
.soon{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--ink-2);padding:1px 6px;border-radius:999px;margin-left:8px;font-style:normal}
.slots{display:grid;gap:10px}
.slot{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1.6fr) auto;grid-template-areas:"n w d a";gap:10px;align-items:center}
.slot-n{grid-area:n;font:500 13px var(--f-mono);color:var(--ink-2);text-align:center}
.slot .cw{grid-area:w}.slot .cd{grid-area:d}.slot-a{grid-area:a;display:flex;gap:2px}
@media (max-width:640px){
  .slot{grid-template-columns:24px minmax(0,1fr) auto;grid-template-areas:"n w a" "n d a";gap:6px 8px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .slot-a{flex-direction:column}
}
.add-card{justify-self:start}
.bulk{display:grid;gap:10px;padding:16px;border:1.5px dashed var(--line);border-radius:14px}
.bulk-info{font:500 13px var(--f-mono);color:var(--ink-2)}
.err{color:var(--bad);font-weight:600;min-height:1.4em}
.form-actions{display:flex;flex-wrap:wrap;gap:10px}

/* study shell */
.sbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:22px}
.sbar-t{font-size:1.1rem;text-align:center}
.sbar .btn.link{justify-self:start}
@media (max-width:520px){.sbar{grid-template-columns:auto 1fr}.sbar>:last-child{display:none}.sbar-t{text-align:right}}
.opts{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;justify-content:center;margin-top:22px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--hl);color:var(--on-hl)}
.opts .tg{padding:0;gap:10px;font-size:14px}
.desk-only{display:none}
@media (hover:hover) and (pointer:fine){.desk-only{display:block}.kc{display:inline-flex!important}}
.kc{display:none;flex:none;min-width:22px;height:22px;padding:0 4px;align-items:center;justify-content:center;border:1px solid var(--line);border-bottom-width:2.5px;border-radius:5px;font:500 11px var(--f-mono);color:var(--ink-2);background:var(--bg)}
.center-hint{text-align:center;font-size:13px;color:var(--ink-2);margin-top:14px}

/* flashcards */
.fc-stage{max-width:720px;margin:0 auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.fc{width:100%;aspect-ratio:3/2;min-height:230px;cursor:pointer;display:block}
.fc-inner{position:relative;width:100%;height:100%;}
.fc-inner.turn{animation:turn .3s ease}
@keyframes turn{0%{transform:scaleX(1)}50%{transform:scaleX(.02)}100%{transform:scaleX(1)}}
.fc-face{position:absolute;inset:0;border-radius:22px;background:var(--surface);border:1.5px solid var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;padding:34px 26px 26px;text-align:center}
.fc-face.back{background:var(--surface-2)}
.fc-label{position:absolute;top:14px;left:18px;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.fc-text{font:600 clamp(1.6rem,5vw,2.6rem)/1.15 var(--f-display);max-height:100%;overflow:auto;overflow-wrap:anywhere;letter-spacing:-.01em}
.fc-text.mid{font-size:clamp(1.3rem,3.6vw,1.9rem)}
.fc-text.long{font:500 clamp(1.05rem,2.6vw,1.3rem)/1.4 var(--f-body)}
.fc-stage.in-next .fc{animation:slideR .22s ease both}
.fc-stage.in-prev .fc{animation:slideL .22s ease both}
@keyframes slideR{from{transform:translateX(26px)}to{transform:none}}
@keyframes slideL{from{transform:translateX(-26px)}to{transform:none}}
.fc-nav{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:22px}
.count{font:500 15px var(--f-mono);min-width:70px;text-align:center}

/* match */
.mbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;font-size:14px;color:var(--ink-2)}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mcol{display:grid;gap:10px;align-content:start;min-width:0}
.mcol-h{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.mlist{display:grid;gap:10px}
@media (max-width:560px){.mgrid{gap:8px}.mlist{gap:8px}.tile{min-height:76px;padding:10px 11px;font-size:13.5px}.tile.k-w{font-size:15px}}
.tile{display:flex;align-items:center;gap:10px;text-align:left;min-height:96px;padding:14px 16px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;font:500 15px/1.35 var(--f-body);overflow-wrap:anywhere;transition:background .12s,border-color .12s,opacity .25s,transform .12s}
.tile.k-w{font:600 17px/1.25 var(--f-display)}
.tile:hover:not(:disabled){border-color:var(--ink)}
.tile.sel{background:var(--hl);color:var(--on-hl);border-color:var(--ink);transform:translateY(-2px)}
.tile.sel .kc{background:transparent;border-color:var(--on-hl);color:var(--on-hl)}
.tile.ok{background:var(--good-bg);border-color:var(--good)}
.tile.bad{background:var(--bad-bg);border-color:var(--bad);animation:shake .38s}
.tile.done{opacity:.35;background:transparent;border-style:dashed}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* write, choose, learn */
.wtop{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.pbar{flex:1;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;width:0;background:var(--ink);border-radius:99px;transition:width .3s}
.wq{max-width:720px;margin:0 auto;display:grid;gap:18px}
.wprompt{position:relative;background:var(--surface);border:1.5px solid var(--ink);border-radius:20px;padding:44px 24px 30px;text-align:center;box-shadow:var(--shadow)}
.wp-text{font:600 clamp(1.5rem,4.6vw,2.4rem)/1.2 var(--f-display);overflow-wrap:anywhere}
.wp-text.long{font:500 clamp(1.1rem,3vw,1.4rem)/1.4 var(--f-body)}
.wp-text.xl{font:500 1.05rem/1.5 var(--f-body)}
.warea{display:grid;gap:14px}
.ask{font-weight:600;color:var(--ink-2);font-size:14px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:500;overflow-wrap:anywhere;transition:background .12s,border-color .12s}
.choice:hover:not(:disabled){border-color:var(--ink);background:var(--hl);color:var(--on-hl)}
.choice:hover:not(:disabled) .kc{border-color:var(--on-hl);color:var(--on-hl);background:transparent}
.choice.right{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.choice:disabled{opacity:1}
.choice:disabled:not(.right):not(.wrong){opacity:.55}
.fb{display:grid;gap:8px;padding:16px 18px;border-radius:14px;border:1.5px solid}

  const b=before.join('').trim(),a=after.join('').trim();

  segs.push({gap:650});
  if(a)segs.push({t:a,lang:langOf(c.deck,'d')});
  return segs;
}

function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      try{
        const M=520;
        let w=im.naturalWidth||im.width,hh=im.naturalHeight||im.height;
        if(!w||!hh)throw new Error('size');
        const k=Math.min(1,M/Math.max(w,hh));
        w=Math.round(w*k);hh=Math.round(hh*k);
        const cv=document.createElement('canvas');cv.width=w;cv.height=hh;
        const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,hh);cx.drawImage(im,0,0,w,hh);
        URL.revokeObjectURL(url);
        res(cv.toDataURL('image/jpeg',0.8));
      }catch(e){URL.revokeObjectURL(url);rej(e);}
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('image'));};
    im.src=url;
  });
}

const dq={};
function dbQueue(id,data){
  if(!col)return;
  const e=dq[id]||(dq[id]={});
  e.data=data;clearTimeout(e.timer);
  e.timer=setTimeout(()=>dbFlush(id),350);
}
async function dbFlush(id){
  const e=dq[id];
  if(!col||!e)return;
  if(e.busy){e.timer=setTimeout(()=>dbFlush(id),250);return;}
  e.busy=true;
  const data=e.data;
  try{
    if(data===null)await col.doc(id).delete();
    else await col.doc(id).set(data);
  }catch(err){/* local copy stays */}
  e.busy=false;
  if(e.data!==data){clearTimeout(e.timer);dbFlush(id);}
}
const metaDoc=()=>({review:clone(S.review),seeded:true});
function touchDeck(d){dirty=true;lsSave();dbQueue('d_'+d.id,clone(d));}

function usedImages(){
  const s=new Set();
  S.decks.forEach(d=>d.cards.forEach(c=>{if(c.wi)s.add(c.wi);if(c.di)s.add(c.di);}));

function syncImages(fresh){
  const used=usedImages();
  Object.keys(S.images).forEach(id=>{
    if(!used.has(id)){delete S.images[id];dbQueue('i_'+id,null);}
  });
  (fresh||[]).forEach(id=>{if(used.has(id)&&S.images[id])dbQueue('i_'+id,{data:S.images[id]});});

function removeDeck(id){

}
const deckById=id=>S.decks.find(d=>d.id===id);
function pruneReview(silent){
  const n=S.review.length;
  S.review=S.review.filter(r=>{const d=deckById(r.deck);return d&&d.cards.some(c=>c.id===r.card);});

/* ----- spaced repetition: a missed card returns after 1, 3 and 7 days ----- */
function markWrong(c){
  const k=c.deck.id+':'+c.id,now=Date.now();
  const e=S.review.find(r=>r.k===k);
  if(!e){S.review.push({k,deck:c.deck.id,card:c.id,step:0,due:now,last:now});touchMeta();return;}
  if((e.step||0)===0&&(e.due||0)<=now)return;
  e.step=0;e.due=now;e.last=now;touchMeta();
}
function markRight(c){
  const k=c.deck.id+':'+c.id,e=S.review.find(r=>r.k===k),now=Date.now();
  if(!e||(e.due||0)>now)return;
  e.step=(e.step||0)+1;e.last=now;
  if(e.step>INTERVALS.length)S.review=S.review.filter(r=>r!==e);
  else e.due=now+INTERVALS[e.step-1]*DAY;
  touchMeta();
}
function reviewItems(forDeck,all){
  const now=Date.now(),out=[];
  S.review.forEach(r=>{
    if(forDeck&&r.deck!==forDeck)return;
    if(!all&&(r.due||0)>now)return;
    const d=deckById(r.deck);if(!d)return;
    const c=d.cards.find(x=>x.id===r.card);if(!c)return;
    out.push({deck:d,card:c,key:r.k,e:r});
  });
  return out;
}
function nextDue(){
  const now=Date.now();let m=null,n=0;
  S.review.forEach(r=>{if((r.due||0)>now){n++;if(m===null||r.due<m)m=r.due;}});
  return{n,at:m};
}
function whenLabel(ms){
  const d=Math.ceil((ms-Date.now())/DAY);
  return d<=0?'later today':d===1?'tomorrow':'in '+d+' days';
}
const stepLabel=e=>(e.step||0)===0?'missed':INTERVALS[e.step-1]+'-day review';

/* ----- records ----- */
function recordMatch(deck,ms){
  const st=deck.stats||(deck.stats={});
  const prev=st.matchBest==null?null:st.matchBest;
  const isBest=prev===null||ms<prev;
  if(isBest)st.matchBest=ms;
  st.matchPlays=(st.matchPlays||0)+1;st.matchLast=ms;
  touchDeck(deck);
  return{isBest,prev};
}
function recordTest(deck,right,total){
  const st=deck.stats||(deck.stats={});
  st.tests=(st.tests||[]).concat([{at:Date.now(),right,total}]).slice(-20);
  touchDeck(deck);
}

async function connectDb(){
  let db=null,me=null;
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const got=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      db=got[0];
      if(got[1])me=await got[1].id();
    }
  }catch(e){db=null;}
  if(db&&me){
    try{
      const c=db.collection('data/users/'+me);
      const snap=await c.get();
      const remoteDecks=[],remoteImgs={};let remoteMeta=null;
      snap.docs.forEach(s=>{
        const v=s.data();if(!v)return;
        if(s.id==='meta')remoteMeta=clone(v);
        else if(s.id.indexOf('d_')===0)remoteDecks.push(clone(v));
        else if(s.id.indexOf('i_')===0&&v.data)remoteImgs[s.id.slice(2)]=v.data;
      });
      col=c;
      if(remoteDecks.length||remoteMeta){
        if(!dirty){
          S.decks=remoteDecks;
          S.review=(remoteMeta&&Array.isArray(remoteMeta.review))?remoteMeta.review:[];
          S.images=remoteImgs;
        }else{
          const have=new Set(S.decks.map(d=>d.id));
          remoteDecks.forEach(d=>{if(!have.has(d.id))S.decks.push(d);});
          const keys=new Set(S.review.map(r=>r.k));
          ((remoteMeta&&remoteMeta.review)||[]).forEach(r=>{if(!keys.has(r.k))S.review.push(r);});
          Object.keys(remoteImgs).forEach(id=>{if(!S.images[id])S.images[id]=remoteImgs[id];});
          S.decks.forEach(d=>dbQueue('d_'+d.id,clone(d)));
          Object.keys(S.images).forEach(id=>dbQueue('i_'+id,{data:S.images[id]}));
          dbQueue('meta',metaDoc());
        }
      }else{
        S.decks.forEach(d=>dbQueue('d_'+d.id,clone(d)));
        Object.keys(S.images).forEach(id=>dbQueue('i_'+id,{data:S.images[id]}));
        dbQueue('meta',metaDoc());
      }
    }catch(e){col=null;}
  }
  S.seeded=true;
  migrate().forEach(touchDeck);
  pruneReview(true);
  if(!col&&!localLoaded)lsSave();
  if(pending&&navs===0&&(!pending.id||deckById(pending.id))){
    const pv=pending;pending=null;
    go(pv.name,Object.assign({},pv,{restore:pv.name==='edit'}));
  }else softRefresh();
}

      h('span',null,h('strong',null,rv.length+(rv.length===1?' card':' cards')),' from this deck are due for review.'),
      btn('Review them',{cls:'hl',icon:'write',onclick:()=>go('write',{id:d.id,review:true})})):null,
    statsPanel(d),
    h('details',{class:'cards-list'},
      h('summary',null,'Cards in this deck ('+n+')'),
      h('div',{class:'cl'},h('div',{class:'h'},'Word'),h('div',{class:'h'},'Definition'),
        d.cards.map(c=>[
          h('div',null,cimg(c.wi,'cl-img'),rich(c.w)),
          h('div',null,cimg(c.di,'cl-img'),rich(c.d))]))));
  return root;
}

/* =====================================================================
   Export
   ===================================================================== */
function exportView(p){
  const deck=deckById(p.id);if(!deck)return missing();
  let sep=';';
  const ta=h('textarea',{class:'in mono',rows:'14',readonly:true,'aria-label':'Exported cards'});
  const note=h('p',{class:'hint','aria-live':'polite'});
  function build(){
    ta.value=deck.cards.map(c=>sep==='-'?c.w+' - '+c.d:c.w+sep+' '+c.d).join('\n');
    note.textContent=deck.cards.length+' cards. Paste this into “Paste many cards at once” with the same separator to import it again. Images are not included.';
  }
  async function copy(){
    try{await navigator.clipboard.writeText(ta.value);note.textContent='Copied to the clipboard.';}
    catch(e){ta.focus();ta.select();try{document.execCommand('copy');note.textContent='Copied to the clipboard.';}catch(e2){note.textContent='Select the text and copy it by hand.';}}
  }
  const dlBtn=btn('Save as .txt',{cls:'ghost',icon:'export',onclick:async()=>{
    try{
      const dl=await window.claude.use('downloads');
      if(!dl){note.textContent='Saving files is not available here. Use Copy instead.';return;}
      const name=(deck.title.replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-+|-+$/g,'')||'deck')+'.txt';
      await dl.save({filename:name,data:ta.value});
    }catch(e){if(!e||e.code!=='declined')note.textContent='Could not save the file. Use Copy instead.';}
  }});
  dlBtn.hidden=!(window.claude&&typeof window.claude.use==='function');
  build();
  return h('div',{class:'wrap view'},
    h('div',{class:'form'},
      btn('Back to deck',{cls:'link',icon:'back',onclick:()=>go('deck',{id:deck.id})}),
      h('h1',null,'Export “'+deck.title+'”'),
      h('div',{class:'field'},h('span',{class:'lbl'},'Separator'),
        seg([[';','; semicolon'],[':',': colon'],['-','- dash'],[',',', comma']],sep,v=>{sep=v;build();},'Separator')),
      ta,note,
      h('div',{class:'form-actions'},btn('Copy text',{cls:'primary',icon:'check',onclick:copy}),dlBtn)));
}

/* =====================================================================
   Create / edit deck
   ===================================================================== */
function editView(p){
  const orig=p.id?deckById(p.id):null;
  if(p.id&&!orig)return missing();
  const blank=()=>({id:uid(),w:'',d:''});
  let saved=null;
  if(p.restore){try{const o=JSON.parse(sessionStorage.getItem(DKEY)||'null');if(o&&o.forId===(p.id||null))saved=o.draft;}catch(e){}}
  const draft=saved||(orig?clone(orig):{id:uid(),title:'',desc:'',choize:true,langW:'',langD:'',cards:[blank()],created:Date.now()});
  if(!draft.cards||!draft.cards.length)draft.cards=[blank()];
  draft.langW=draft.langW||'';draft.langD=draft.langD||'';
  const newImgs=new Set();
  if(saved){const used=usedImages();draft.cards.forEach(c=>['wi','di'].forEach(k=>{if(c[k]&&!used.has(c[k]))newImgs.add(c[k]);}));}
  let lastField=null,saveT=null;
  function persist(){
    clearTimeout(saveT);
    saveT=setTimeout(()=>{try{sessionStorage.setItem(DKEY,JSON.stringify({forId:p.id||null,draft}));}catch(e){}},300);
  }
  onLeave(()=>{clearTimeout(saveT);try{sessionStorage.removeItem(DKEY);}catch(e){}});

  const title=h('input',{id:'f-title',class:'in',type:'text',maxlength:'80',placeholder:'e.g. Biology: parts of a cell',value:draft.title,oninput:e=>{draft.title=e.target.value;persist();}});
  const desc=h('textarea',{id:'f-desc',class:'in',rows:'2',maxlength:'240',placeholder:'What is this deck for? (optional)',oninput:e=>{draft.desc=e.target.value;persist();}},draft.desc);

  const sw=h('button',{type:'button',role:'switch',class:'switch',id:'f-choize','aria-labelledby':'choize-l','aria-checked':String(draft.choize),onclick:()=>{
    draft.choize=!draft.choize;sw.setAttribute('aria-checked',String(draft.choize));persist();renderSlots();
  }},h('span',{class:'knob'}));
  const infoBtn=h('button',{type:'button','aria-label':'What is Choize?','aria-expanded':'false',onclick:()=>{
    const o=info.classList.toggle('open');infoBtn.setAttribute('aria-expanded',String(o));
  }},icon('info'));
  const info=h('span',{class:'info'},infoBtn,h('span',{class:'tip',role:'tooltip'},
    'Choize turns words in {curly brackets} into blanks. Write “Paris; {Huvudstaden} av {Frankrike}” and Write asks “Paris = ____ av Frankrike” or “Paris = Huvudstaden av ____”.'));
  const closeInfo=e=>{if(!info.contains(e.target)){info.classList.remove('open');infoBtn.setAttribute('aria-expanded','false');}};
  document.addEventListener('click',closeInfo);
  onLeave(()=>document.removeEventListener('click',closeInfo));

  const langSel=(id,key,label)=>{
    const s=h('select',{id,class:'in',onchange:e=>{draft[key]=e.target.value;persist();}},LANGS.map(l=>h('option',{value:l[0]},l[1])));
    s.value=draft[key];
    return h('div',{class:'field'},h('label',{for:id},label),s);
  };

  const slotsBox=h('div',{class:'slots'});
  const countEl=h('span',{class:'sub mono'});
  const err=h('p',{class:'err',role:'alert'});

  function wrapSel(inp,l,r){
    const s=inp.selectionStart,e=inp.selectionEnd,v=inp.value;
    if(s===e){err.textContent='Select some text in the field first, then press the button.';return;}
    err.textContent='';
    inp.value=v.slice(0,s)+l+v.slice(s,e)+r+v.slice(e);
    inp.focus();inp.setSelectionRange(s+l.length,e+l.length);
    inp.dispatchEvent(new Event('input',{bubbles:true}));
  }
  async function attach(c,key,file){
    if(!file||file.type.indexOf('image/')!==0)return;
    try{
      const data=await shrink(file);
      const id=uid();S.images[id]=data;newImgs.add(id);
      c[key]=id;err.textContent='';persist();renderSlots();
    }catch(e){err.textContent='Could not read that image. Try a PNG or JPEG.';}
  }
  function cell(c,side,i){
    const imgKey=side==='w'?'wi':'di';
    const pv=h('div',{class:'preview'});
    const upd=()=>{
      if(/[*{]/.test(c[side])){pv.replaceChildren(h('span',{class:'pv-l'},'Preview'),previewNode(c[side]));pv.hidden=false;}
      else pv.hidden=true;
    };
    const inp=h('input',{id:side+'-'+c.id,class:'in',type:'text',placeholder:side==='w'?'Word':'Definition','aria-label':(side==='w'?'Word ':'Definition ')+(i+1),value:c[side],
      oninput:e=>{c[side]=e.target.value;upd();persist();},
      onfocus:()=>{lastField=inp;},
      onpaste:e=>{
        const items=(e.clipboardData&&e.clipboardData.items)||[];
        for(let n=0;n<items.length;n++){
          if(items[n].kind==='file'&&items[n].type.indexOf('image/')===0){e.preventDefault();attach(c,imgKey,items[n].getAsFile());return;}
        }
      },
      onkeydown:e=>{
        if((e.ctrlKey||e.metaKey)&&(e.key==='b'||e.key==='i')){e.preventDefault();const m=e.key==='b'?'**':'*';wrapSel(inp,m,m);return;}
        if(e.key!=='Enter')return;
        e.preventDefault();
        if(side==='w'){document.getElementById('d-'+c.id).focus();return;}
        const nx=draft.cards[i+1];
        if(nx)document.getElementById('w-'+nx.id).focus();else addAfter(i);
      }});
    upd();
    const file=h('input',{type:'file',accept:'image/*',class:'sr-only',tabindex:'-1','aria-hidden':'true',onchange:e=>{attach(c,imgKey,e.target.files[0]);}});
    const fbtn=(label,tip,l,r,cls)=>h('button',{type:'button',class:'fmt '+(cls||''),title:tip,'aria-label':tip,onclick:()=>wrapSel(inp,l,r)},label);
    const has=c[imgKey]&&S.images[c[imgKey]];
    return h('div',{class:'cell c'+side},inp,pv,
      h('div',{class:'cell-t'},
        h('span',{class:'fmt-group'},
          fbtn('B','Make the selected text bold','**','**','b'),
          fbtn('I','Make the selected text italic','*','*','it'),
          (side==='d'&&draft.choize)?fbtn('Blank','Hide the selected word when you practise (Choize)','{','}','blankbtn'):null),
        h('button',{type:'button',class:'fmt imgb',title:'Add an image (you can also paste one)','aria-label':'Add an image to '+(side==='w'?'word ':'definition ')+(i+1),onclick:()=>file.click()},icon('image'),'Image'),
        has?h('span',{class:'thumb'},h('img',{src:S.images[c[imgKey]],alt:''}),
          h('button',{type:'button',class:'icon-btn sm',title:'Remove image','aria-label':'Remove image',onclick:()=>{c[imgKey]=null;persist();renderSlots();}},icon('x'))):null,
        file));
  }
  function renderSlots(focusId){
    lastField=null;
    slotsBox.replaceChildren(...draft.cards.map(slot));
    countEl.textContent=draft.cards.length+(draft.cards.length===1?' card':' cards');
    persist();
    if(focusId){const el=document.getElementById(focusId);if(el)el.focus();}
  }
  function addAfter(i){const c=blank();draft.cards.splice(i+1,0,c);renderSlots('w-'+c.id);}
  function removeAt(i){
    if(draft.cards.length===1){const c=draft.cards[0];c.w='';c.d='';c.wi=null;c.di=null;renderSlots('w-'+c.id);return;}
    draft.cards.splice(i,1);renderSlots();
  }
  function slot(c,i){
    return h('div',{class:'slot'},
      h('span',{class:'slot-n'},String(i+1)),cell(c,'w',i),cell(c,'d',i),
      h('div',{class:'slot-a'},
        h('button',{type:'button',class:'icon-btn',title:'Remove this card','aria-label':'Remove card '+(i+1),onclick:()=>removeAt(i)},icon('trash'))));
  }

  /* bulk paste with an explicit separator */
  let bulkSep=';';
  const EX={';':'ocean; a large body of salt water\nParis; {Huvudstaden} av {Frankrike}',':':'ocean: a large body of salt water\nParis: {Huvudstaden} av {Frankrike}','-':'ocean - a large body of salt water\nParis - {Huvudstaden} av {Frankrike}',',':'ocean, a large body of salt water\nParis, {Huvudstaden} av {Frankrike}'};
  const bulkInfo=h('p',{class:'bulk-info','aria-live':'polite'});
  const addBulk=btn('Add cards',{cls:'ghost',icon:'plus',disabled:true,onclick:doBulk});
  const bulk=h('textarea',{id:'bulk',class:'in mono',rows:'5',placeholder:EX[';'],oninput:updBulk});
  function updBulk(){
    const r=parseBulk(bulk.value,bulkSep);
    addBulk.disabled=!r.pairs.length;
    addBulk.lastChild.textContent=r.pairs.length?'Add '+r.pairs.length+(r.pairs.length===1?' card':' cards'):'Add cards';
    bulkInfo.textContent=bulk.value.trim()?(r.pairs.length+' found'+(r.skipped.length?' · '+r.skipped.length+' skipped (no “'+bulkSep+'” in the line)':'')):'';
  }
  function doBulk(){
    const r=parseBulk(bulk.value,bulkSep);if(!r.pairs.length)return;
    const added=r.pairs.map(x=>({id:uid(),w:x.w,d:x.d}));
    const kept=draft.cards.filter(c=>c.w.trim()||c.d.trim()||c.wi||c.di);
    draft.cards=kept.concat(added);
    bulk.value='';updBulk();renderSlots();
  }

  function leaveEdit(){
    newImgs.forEach(id=>{delete S.images[id];});
    if(orig)go('deck',{id:orig.id});else go('home');
  }
  function save(){
    err.textContent='';
    const t=draft.title.trim();
    if(!t){err.textContent='Give the deck a title.';title.focus();return;}
    const out=[];
    for(let i=0;i<draft.cards.length;i++){
      const c=draft.cards[i],w=c.w.trim(),d=c.d.trim();
      if(!w&&!d&&!c.wi&&!c.di)continue;
      if(!w||!d){err.textContent='Card '+(i+1)+' is missing its '+(w?'definition':'word')+'.';const el=document.getElementById((w?'d-':'w-')+c.id);if(el)el.focus();return;}
      const card={id:c.id,w,d};
      if(c.wi&&S.images[c.wi])card.wi=c.wi;
      if(c.di&&S.images[c.di])card.di=c.di;
      out.push(card);
    }
    if(!out.length){err.textContent='Add at least one card with a word and a definition.';return;}
    let target;
    const fields={title:t,desc:draft.desc.trim(),choize:draft.choize,langW:draft.langW,langD:draft.langD,cards:out};
    if(orig){Object.assign(orig,fields);target=orig;}
    else{target=Object.assign({id:draft.id,created:draft.created},fields);S.decks.push(target);}
    touchDeck(target);syncImages(Array.from(newImgs));pruneReview(false);
    go('deck',{id:target.id});
  }

  const root=h('div',{class:'wrap view'},
    h('div',{class:'form'},
      btn(orig?'Back to deck':'All decks',{cls:'link',icon:'back',onclick:leaveEdit}),
      h('h1',null,orig?'Edit deck':'New deck'),
      h('div',{class:'field'},h('label',{for:'f-title'},'Title'),title),
      h('div',{class:'field'},h('label',{for:'f-desc'},'Description'),desc),
      h('div',{class:'setting'},
        h('div',{class:'setting-l'},
          h('div',{class:'row',style:'gap:4px'},h('strong',{id:'choize-l'},'Choize'),info),
          h('p',{class:'hint'},'Fill-in-the-blank cards. Put a word in {curly brackets} and it becomes a blank when you practise.')),sw),
      TTS?h('div',{class:'field'},h('span',{class:'lbl'},'Read aloud languages'),
        h('div',{class:'two'},langSel('f-lw','langW','Words'),langSel('f-ld','langD','Definitions')),
        h('p',{class:'hint'},'Used by the speaker buttons. Your device needs a voice for the language.')):null,
      h('div',{class:'field'},
        h('div',{class:'sec-h',style:'margin-bottom:0'},h('span',{class:'lbl'},'Cards'),countEl),
        h('p',{class:'hint'},'Select text in a field to make it bold, italic'+(draft.choize?' or a blank':'')+'. You can also add an image to either side.'),
        slotsBox,
        btn('Add card',{cls:'ghost add-card',icon:'plus',onclick:()=>addAfter(draft.cards.length-1)})),
      h('div',{class:'bulk'},
        h('span',{class:'lbl'},'Paste many cards at once'),
        h('p',{class:'hint'},'One card per line. Choose what sits between the word and the definition:'),
        seg([[';','; semicolon'],[':',': colon'],['-','- dash'],[',',', comma']],bulkSep,v=>{bulkSep=v;bulk.placeholder=EX[v];updBulk();},'Separator'),
        bulk,bulkInfo,h('div',null,addBulk)),
      err,
      h('div',{class:'form-actions'},
        btn(orig?'Save changes':'Create deck',{cls:'primary',icon:'check',onclick:save}),
        btn('Cancel',{cls:'ghost',onclick:leaveEdit}))));
  renderSlots();
  setTimeout(()=>{if(!orig&&!saved)title.focus();},0);
  return root;
}

/* =====================================================================
   Flashcards
   ===================================================================== */
function flashView(p){
  const deck=deckById(p.id);if(!deck)return missing();
  const total=deck.cards.length;
  let order=deck.cards.slice(),i=0,flipped=false,front='w',auto=false,ft=null;
  const face=h('div',{class:'fc-face'});
  const inner=h('div',{class:'fc-inner'},face);
  const card=h('div',{class:'fc',role:'button',tabindex:'0','aria-label':'Flip card'},inner);
  const stage=h('div',{class:'fc-stage'},card);
  const cnt=h('span',{class:'count','aria-live':'polite'});
  const prev=h('button',{type:'button',class:'round','aria-label':'Previous card',onclick:()=>move(-1)},icon('back'));
  const next=h('button',{type:'button',class:'round','aria-label':'Next card',onclick:()=>move(1)},icon('next'));
  const sideShown=()=>flipped?(front==='w'?'d':'w'):front;
  function say(){const c=order[i],s=sideShown();speak(c[s],langOf(deck,s));}
  const spk=speakBtn(()=>[{t:order[i][sideShown()],lang:langOf(deck,sideShown())}],'big');
  onLeave(()=>clearTimeout(ft));
  function paintFace(){
    const c=order[i],s=sideShown(),text=c[s],img=s==='w'?c.wi:c.di;
    face.classList.toggle('back',flipped);
    face.replaceChildren(h('span',{class:'fc-label'},s==='w'?'Word':'Definition'),
      h('div',{class:'fc-body'},cimg(img,'fc-img'),h('div',{class:'fc-text '+(plain(text).length>70?'long':plain(text).length>28?'mid':'')},rich(text))));
    cnt.textContent=(i+1)+' / '+total;
    prev.disabled=i===0;next.disabled=i===total-1;
  }
  function show(n,dir){
    clearTimeout(ft);
    i=n;flipped=false;paintFace();
    if(dir){stage.classList.remove('in-next','in-prev');void stage.offsetWidth;stage.classList.add(dir>0?'in-next':'in-prev');}
    if(auto)say();
  }
  function move(d){const n=i+d;if(n<0||n>=total)return;show(n,d);}
  function flip(){
    flipped=!flipped;
    inner.classList.remove('turn');void inner.offsetWidth;inner.classList.add('turn');
    clearTimeout(ft);ft=setTimeout(paintFace,140);
    if(auto)say();
  }
  let sx=0,sy=0,swiped=false;
  stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;swiped=false;});
  stage.addEventListener('pointerup',e=>{
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){swiped=true;move(dx<0?1:-1);}
  });
  card.addEventListener('click',()=>{if(swiped){swiped=false;return;}flip();});
  setKeys(e=>{
    const t=e.target.tagName;
    if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}
    else if(e.key==='ArrowRight'){e.preventDefault();move(1);}
    else if((e.key===' '||e.key==='Enter'||e.key==='ArrowUp'||e.key==='ArrowDown')&&t!=='BUTTON'&&t!=='INPUT'&&t!=='SELECT'){e.preventDefault();flip();}
  });
  const opts=h('div',{class:'opts'},
    seg([['w','Word first'],['d','Definition first']],front,v=>{front=v;show(i);},'Which side shows first'),
    toggle('Shuffle',false,on=>{order=on?shuffle(deck.cards):deck.cards.slice();show(0);}),
    TTS?toggle('Read aloud automatically',false,on=>{auto=on;if(on)say();else stopSpeech();}):null);
  show(0);
  return h('div',{class:'wrap view'},
    studyBar('Flashcards · '+deck.title,'Back',()=>go('deck',{id:deck.id})),
    stage,
    h('div',{class:'fc-nav'},prev,h('div',{class:'cnt-wrap'},cnt,spk),next),
    opts,
    h('p',{class:'center-hint desk-only'},'← → to move · Space to flip'),
    h('p',{class:'center-hint'},'Tap the card to flip it. Swipe left or right to change card.'));
}

/* =====================================================================
   Match engine + view (words on the left, definitions on the right)
   ===================================================================== */
function matchEngine(box,cards,o){
  o=o||{};
  const per=pairsPerRound(cards.length);
  const rounds=chunk(shuffle(cards),per);
  let ri=0,sel=null,busy=false,tiles=[],left=0,wrongTries=0,dead=false;
  const t0=Date.now(),mistakes=new Set();
  const roundEl=h('span'),missEl=h('span'),timeEl=h('span',{class:'mono'},'0:00');
  const bestEl=o.best!=null?h('span',{class:'mono'},'Best '+fmt(o.best)):null;
  const listL=h('div',{class:'mlist'}),listR=h('div',{class:'mlist'});
  const grid=h('div',{class:'mgrid'},
    h('div',{class:'mcol'},h('p',{class:'mcol-h'},'Words'),listL),
    h('div',{class:'mcol'},h('p',{class:'mcol-h'},'Definitions'),listR));
  box.replaceChildren(h('div',{class:'mbar'},roundEl,missEl,bestEl,timeEl),grid);
  const tick=setInterval(()=>{timeEl.textContent=fmt(Date.now()-t0);},250);
  function start(){
    const r=rounds[ri];
    const ws=shuffle(r.map(c=>({kind:'w',card:c,text:c.w,img:c.wi})));
    const ds=shuffle(r.map(c=>({kind:'d',card:c,text:c.d,img:c.di})));
    tiles=ws.concat(ds);
    tiles.forEach((t,n)=>{
      t.done=false;
      t.el=h('button',{type:'button',class:'tile k-'+t.kind,onclick:()=>pick(t)},
        h('span',{class:'kc'},String((n+1)%10)),h('span',{class:'tt'},cimg(t.img,'t-img'),h('span',null,rich(t.text))));
    });
    listL.replaceChildren(...ws.map(t=>t.el));
    listR.replaceChildren(...ds.map(t=>t.el));
    left=r.length;sel=null;busy=false;
    roundEl.textContent=rounds.length>1?'Round '+(ri+1)+' of '+rounds.length:'Match the pairs';
    missEl.textContent=wrongTries+(wrongTries===1?' mistake':' mistakes');
  }
  function pick(t){
    if(dead||busy||t.done)return;
    if(sel===t){t.el.classList.remove('sel');sel=null;return;}
    if(!sel||sel.kind===t.kind){
      if(sel)sel.el.classList.remove('sel');
      sel=t;t.el.classList.add('sel');return;
    }
    const a=sel,b=t;sel=null;
    a.el.classList.remove('sel');
    if(a.card===b.card){
      a.done=b.done=true;a.el.disabled=b.el.disabled=true;
      a.el.classList.add('ok');b.el.classList.add('ok');
      left--;
      setTimeout(()=>{
        if(dead)return;
        [a,b].forEach(x=>{x.el.classList.remove('ok');x.el.classList.add('done');});
        if(left===0)nextRound();
      },520);
    }else{
      busy=true;wrongTries++;
      mistakes.add(a.card.id);mistakes.add(b.card.id);
      markWrong(a.card);markWrong(b.card);
      missEl.textContent=wrongTries+(wrongTries===1?' mistake':' mistakes');
      a.el.classList.add('bad');b.el.classList.add('bad');
      setTimeout(()=>{
        if(dead)return;
        a.el.classList.remove('bad');b.el.classList.remove('bad');busy=false;
      },480);
    }
  }
  function nextRound(){
    ri++;
    if(ri<rounds.length){start();return;}
    clearInterval(tick);
    cards.forEach(c=>{if(!mistakes.has(c.id))markRight(c);});
    if(o.onDone)o.onDone({mistakes,wrongTries,ms:Date.now()-t0});
  }
  function onKey(e){
    if(!/^[0-9]$/.test(e.key))return;
    const idx=e.key==='0'?9:(+e.key-1);
    if(tiles[idx]){e.preventDefault();pick(tiles[idx]);}
  }
  start();
  return{onKey,destroy(){dead=true;clearInterval(tick);}};
}

/* =====================================================================
   Write engine (typed answers, Choize blanks, hints, near-miss spelling)
   ===================================================================== */
function writeEngine(box,cards,o){
  const total=cards.length;
  let queue=shuffle(cards),solved=0,fb=null,timer=null,cur=null,dead=false;
  const firstTry=new Map(),attempts=new Map();
  const fill=h('i'),bar=h('div',{class:'pbar',role:'progressbar'},fill),cnt=h('span',{class:'count'});
  const body=h('div',{class:'wq'});
  box.replaceChildren(h('div',{class:'wtop'},cnt,bar),body);
  function prog(){fill.style.width=(total?solved/total*100:0)+'%';cnt.textContent=solved+' / '+total;}
  function ask(){
    clearTimeout(timer);fb=null;cur=null;prog();
    if(!queue.length){finish();return;}
    const c=queue[0],wd=o.getDir()==='wd';
    const deck=c.deck,pSide=wd?'w':'d',aSide=wd?'d':'w';
    const pText=wd?c.w:c.d,pImg=wd?c.wi:c.di;
    const cz=!o.forceChoice&&wd&&o.getChoize&&o.getChoize(c)&&hasBlanks(c.d);
    let mode,answer,opts=null,cl=null,bi=0,promptEl,segs;
    if(cz){
      mode='cloze';cl=parseCloze(c.d);bi=Math.floor(Math.random()*cl.n);answer=blankAnswer(cl,bi);
      promptEl=h('div',{class:'wp-text cz'},h('strong',null,rich(c.w)),' = ',clozeNode(cl.parts,bi,answer.length));
      segs=clozeSegs(c,cl,bi);
    }else{
      answer=plain(wd?c.d:c.w);
      mode=o.forceChoice?'mc':'type';
      if(mode==='mc'){opts=makeOptions(c,answer,wd,4);if(opts.length<2){mode='type';opts=null;}}
      promptEl=h('div',{class:'wp-text '+lenClass(plain(pText))},rich(pText));
      segs=[{t:pText,lang:langOf(deck,pSide)}];
    }
    const area=h('div',{class:'warea'});
    cur={c,wd,answer,mode,opts,area,hints:0,aSide,cl,bi,inp:null,actions:null};
    body.replaceChildren(
      h('div',{class:'wprompt'},h('span',{class:'fc-label'},mode==='cloze'?'Word = definition':(wd?'Word':'Definition')),speakBtn(()=>segs,'corner'),cimg(pImg,'wp-img'),promptEl),
      area);
    if(o.getAuto&&o.getAuto())speakSeq(segs);
    if(mode==='mc'){
      area.append(h('p',{class:'ask'},'Choose the '+(wd?'definition':'word')),
        h('div',{class:'choices'},opts.map((t,n)=>{
          const b=h('button',{type:'button',class:'choice',onclick:()=>check(t,b)},h('span',{class:'kc'},String(n+1)),h('span',{class:'ct'},t));
          return b;
        })));
    }else{
      const inp=h('input',{id:'ans',class:'in big',type:'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false','aria-label':'Your answer',
        placeholder:mode==='cloze'?'Fill in the blank':'Type the '+(wd?'definition':'word'),
        onkeydown:e=>{if(e.key==='Enter'){e.preventDefault();check(inp.value);}}});
      const mask=h('div',{class:'hint-mask','aria-live':'polite'});
      const hintBtn=btn('Hint',{cls:'ghost',icon:'bulb',onclick:()=>{
        cur.hints++;
        mask.textContent=maskHint(answer,cur.hints);
        hintBtn.lastChild.textContent='Hint ('+cur.hints+')';
        if(cur.hints>=letterCount(answer))hintBtn.disabled=true;
        inp.focus();
      }});
      const actions=h('div',{class:'row'},
        btn('Check',{cls:'primary',onclick:()=>check(inp.value)}),
        hintBtn,
        btn('Don’t know',{cls:'ghost',onclick:()=>check('')}));
      cur.inp=inp;cur.actions=actions;
      area.append(h('p',{class:'ask'},mode==='cloze'?'Fill in the blank':'Type the '+(wd?'definition':'word')),mask,inp,actions);
      setTimeout(()=>{if(!dead&&!fb)inp.focus();},0);
    }
  }
  function nearPanel(val,res){
    const inp=cur.inp;
    if(cur.nearEl)cur.nearEl.remove();
    inp.classList.remove('bad','ok');inp.classList.add('near');
    cur.actions.hidden=true;
    const panel=h('div',{class:'fb near',role:'status'},
      h('strong',null,'Very close'),
      h('p',null,'Off by '+(res.dist===1?'one letter':'a couple of letters')+'. Want to try again?'),
      h('div',{class:'row'},
        btn('Try again',{cls:'primary',onclick:()=>{
          panel.remove();cur.nearEl=null;inp.classList.remove('near');cur.actions.hidden=false;inp.focus();inp.select();
        }}),
        btn('Show answer',{cls:'ghost',onclick:()=>{panel.remove();cur.nearEl=null;finalize(false,val,true);}})));
    cur.nearEl=panel;
    cur.area.append(panel);
    setTimeout(()=>{if(!dead)panel.querySelector('button').focus();},0);
  }
  function check(val,btnEl){
    if(fb||!cur)return;
    const answer=cur.answer;
    if(cur.mode==='mc'){finalize(val!=null&&norm(val)===norm(answer),val,false,btnEl);return;}
    const res=judge(val,answer);
    if(res.r==='near'){nearPanel(val,res);return;}
    finalize(res.r==='exact',val,false);
  }
  function finalize(ok,val,revealed,btnEl){
    if(fb||!cur)return;
    const c=cur.c,answer=cur.answer;
    const hinted=ok&&cur.hints>0;
    attempts.set(c.id,(attempts.get(c.id)||0)+1);
    fb={ok,hinted,card:c,done:false};
    if(!ok){firstTry.set(c.id,false);markWrong(c);}
    else if(hinted)firstTry.set(c.id,false);
    else if(!firstTry.has(c.id))firstTry.set(c.id,true);
    if(cur.mode==='mc'){
      cur.area.querySelectorAll('.choice').forEach(b=>{
        b.disabled=true;
        const t=b.querySelector('.ct').textContent;
        if(norm(t)===norm(answer))b.classList.add('right');
        else if(b===btnEl)b.classList.add('wrong');
      });
    }else{
      cur.inp.disabled=true;cur.inp.classList.remove('near');cur.inp.classList.add(ok?'ok':'bad');cur.actions.hidden=true;
    }
    const given=val&&String(val).trim();
    const head=ok?(hinted?'Correct, with '+cur.hints+(cur.hints===1?' hint':' hints'):'Correct'):(revealed||!given?'Here is the answer':'Not quite');
    const panel=h('div',{class:'fb '+(ok?'ok':'bad'),role:'status'},
      h('strong',null,head),
      !ok&&given&&cur.mode!=='mc'?h('p',null,'You wrote: ',h('span',{class:'ans-bad'},given)):null,
      !ok?h('p',null,'Answer: ',h('span',{class:'ans-good'},answer)):null,
      ok&&cur.mode!=='mc'?h('p',null,h('span',{class:'ans-good'},answer)):null);
    const cont=btn('Continue',{cls:'primary',onclick:()=>advance(ok)});
    const acts=h('div',{class:'row'},cont);
    if(TTS){
      acts.append(btn('Listen',{cls:'ghost',icon:'sound',onclick:()=>speakSeq(cur.mode==='cloze'
        ?[{t:c.w,lang:langOf(c.deck,'w')},{t:c.d,lang:langOf(c.deck,'d')}]
        :[{t:answer,lang:langOf(c.deck,cur.aSide)}])}));
    }
    if(!ok&&given&&cur.mode!=='mc'){
      acts.append(btn('I was right',{cls:'ghost',onclick:()=>{
        if((attempts.get(c.id)||0)<=1)firstTry.set(c.id,true);
        advance(true);
      }}));
    }
    panel.append(acts);
    cur.area.append(panel);
    if(ok)timer=setTimeout(()=>advance(true),cur.mode==='mc'?850:1200);
    else setTimeout(()=>{if(!dead)cont.focus();},0);
  }
  function advance(ok){
    if(!fb||fb.done)return;
    fb.done=true;clearTimeout(timer);
    const c=fb.card,hinted=fb.hinted;queue.shift();
    if(ok){
      if(!firstTry.has(c.id))firstTry.set(c.id,true);
      solved++;
      if(!hinted)markRight(c);
    }
    else if(o.once)solved++;
    else queue.push(c);
    ask();
  }
  function finish(){
    prog();
    const right=[],wrong=[];
    cards.forEach(c=>(firstTry.get(c.id)===false?wrong:right).push(c));
    if(!dead&&o.onDone)o.onDone({right,wrong,total});
  }
  function onKey(e){
    const tag=e.target.tagName,typing=tag==='INPUT'||tag==='TEXTAREA',isBtn=tag==='BUTTON';
    if(fb){if(e.key==='Enter'&&!isBtn&&!typing){e.preventDefault();advance(fb.ok);}return;}
    if(cur&&cur.mode==='mc'&&/^[1-9]$/.test(e.key)&&!typing){
      const n=+e.key-1;
      if(cur.opts[n]!=null){check(cur.opts[n],cur.area.querySelectorAll('.choice')[n]);}
    }
  }
  ask();
  return{onKey,refresh(){if(!fb)ask();},destroy(){dead=true;clearTimeout(timer);}};
}

/* =====================================================================
   Learn (progress is shown as a percentage; the steps stay behind the scenes)
   ===================================================================== */
function learnView(p){
  const deck=deckById(p.id);if(!deck)return missing();
  const N=deck.cards.length;
  const sizes=sectionSizes(N);
  let pos=0;
  const secs=sizes.map(n=>{const s=deck.cards.slice(pos,pos+n);pos+=n;return s.map(c=>sc(deck,c));});
  const L={sec:0,steps:0,missed:new Set(),everMissed:new Set(),dir:'wd',doneCards:0,inc:[],cor:[],again:[],t0:Date.now()};
  const fill=h('i'),pct=h('span',{class:'mono'},'0%');
  const cap=h('p',{class:'lcap'});
  const box=h('div');
  let eng=null;
  function kill(){if(eng){eng.destroy();eng=null;}setKeys(null);}
  onLeave(kill);
  function head(){
    const cur=secs[L.sec]?secs[L.sec].length:0;
    const f=Math.min(1,(L.doneCards+cur*(L.steps/5))/N);
    fill.style.width=(f*100)+'%';pct.textContent=Math.round(f*100)+'%';
  }
  const getDir=()=>L.dir;
  const wOpts=r=>Object.assign({getDir,getChoize:c=>c.deck.choize},r);

  function sLearn(){
    kill();L.steps=0;head();
    cap.textContent='Choose the correct answer';
    eng=writeEngine(box,secs[L.sec],{once:true,forceChoice:true,getDir,onDone:r=>{
      r.wrong.forEach(c=>{L.missed.add(c.id);L.everMissed.add(c.id);});
      L.steps=1;head();sMatch();
    }});
    setKeys(eng.onKey);
  }
  function sMatch(){
    kill();head();
    cap.textContent='Match each word with its definition';
    eng=matchEngine(box,secs[L.sec],{onDone:r=>{
      r.mistakes.forEach(id=>{L.missed.add(id);L.everMissed.add(id);});
      L.steps=2;head();
      L.inc=secs[L.sec].filter(c=>L.missed.has(c.id));
      L.cor=secs[L.sec].filter(c=>!L.missed.has(c.id));
      pRM();
    }});
    setKeys(eng.onKey);
  }
  function pRM(){
    kill();head();
    if(L.inc.length<2)return pWC();
    cap.textContent='Match the ones you missed once more';
    eng=matchEngine(box,L.inc,{onDone:()=>{L.steps=3;head();pWC();}});
    setKeys(eng.onKey);
  }
  function pWC(){
    kill();head();
    if(!L.cor.length){L.steps=4;head();L.again=L.inc.slice();return pWI();}
    cap.textContent='Now write the ones you knew';
    eng=writeEngine(box,L.cor,wOpts({onDone:r=>{
      r.wrong.forEach(c=>L.everMissed.add(c.id));
      L.again=L.inc.concat(r.wrong.filter(c=>L.inc.indexOf(c)===-1));
      L.steps=4;head();pWI();
    }}));
    setKeys(eng.onKey);
  }
  function pWI(){
    kill();head();
    if(!L.again.length)return secDone();
    cap.textContent='Write the ones you missed';
    eng=writeEngine(box,L.again,wOpts({onDone:()=>{L.steps=5;head();secDone();}}));
    setKeys(eng.onKey);
  }
  function secDone(){
    L.doneCards+=secs[L.sec].length;L.steps=5;
    L.sec++;
    if(L.sec>=secs.length){L.sec=secs.length-1;return finish();}
    L.steps=0;L.missed=new Set();L.again=[];L.inc=[];L.cor=[];
    sLearn();
  }
  function finish(){
    kill();cap.textContent='';
    fill.style.width='100%';pct.textContent='100%';
    const missedN=L.everMissed.size;
    box.replaceChildren(h('div',{class:'result'},
      h('p',{class:'eyebrow'},'Deck complete'),
      h('div',{class:'score'},h('span',{class:'mark'},'100% learned')),
      h('p',{class:'sub'},missedN?missedN+(missedN===1?' card needed':' cards needed')+' a second pass. Total time '+fmt(Date.now()-L.t0)+'.':'No misses at all. Total time '+fmt(Date.now()-L.t0)+'.'),
      h('div',{class:'row'},
        btn('Learn again',{cls:'primary',onclick:()=>go('learn',{id:deck.id})}),
        btn('Back to deck',{cls:'ghost',onclick:()=>go('deck',{id:deck.id})}))));
  }

  const root=h('div',{class:'wrap view'},
    studyBar('Learn · '+deck.title,'Back',()=>go('deck',{id:deck.id})),
    h('div',{class:'lhead'},
      h('div',{class:'row',style:'justify-content:space-between'},
        h('span',{class:'eyebrow'},'Progress'),
        seg([['wd','Word → Definition'],['dw','Definition → Word']],L.dir,v=>{L.dir=v;if(eng&&eng.refresh)eng.refresh();},'Direction')),
      h('div',{class:'lprog'},h('div',{class:'pbar',role:'progressbar','aria-label':'Deck learned'},fill),pct)),
    cap,box);
  sLearn();
  return root;
}

/* =====================================================================
   Test
   ===================================================================== */
function testView(p){
  const deck=deckById(p.id);if(!deck)return missing();
  const N=deck.cards.length;
  const back=()=>go('deck',{id:deck.id});
  const root=h('div',{class:'wrap view'});
  const czAvail=deck.choize&&deck.cards.some(c=>hasBlanks(c.d));
  const cfg={count:Math.min(20,N),types:{tf:N>=2,mc:N>=2,wr:true,cz:czAvail},dir:'mix'};
  const TYPE_LABEL={tf:'True / false',mc:'Multiple choice',wr:'Written',cz:'Fill in the blank'};
  const isDesk=!!(window.matchMedia&&window.matchMedia('(hover:hover) and (pointer:fine)').matches);

  function showConfig(){
    setKeys(null);
    const err=h('p',{class:'err',role:'alert'});
    const count=h('input',{id:'t-count',class:'in',type:'number',min:'1',max:'200',value:String(cfg.count),
      oninput:e=>{const v=parseInt(e.target.value,10);if(v>=1)cfg.count=Math.min(200,v);}});
    const tests=(deck.stats&&deck.stats.tests)||[];
    root.replaceChildren(studyBar('Test · '+deck.title,'Back',back),
      h('div',{class:'cfg'},
        h('h1',null,'Set up your test'),
        tests.length?h('p',{class:'sub'},'Last result '+tests[tests.length-1].right+' / '+tests[tests.length-1].total+' · best '+Math.max.apply(null,tests.map(t=>Math.round(t.right/t.total*100)))+'%'):null,
        h('div',{class:'field'},h('label',{for:'t-count'},'Number of questions'),count,
          h('p',{class:'hint'},'Your deck has '+N+' cards. Ask for more and the same word comes back later in the test, spaced out.')),
        h('div',{class:'field'},h('span',{class:'lbl'},'Question types'),
          h('div',{class:'setting',style:'display:grid;gap:4px'},
            ['tf','mc','wr','cz'].map(k=>{
              const off=(k==='cz'&&!czAvail)||(N<2&&(k==='tf'||k==='mc'));
              const note=k==='cz'?(!czAvail?' (needs Choize and {blanks})':''):(off?' (needs 2+ cards)':'');
              return toggle(TYPE_LABEL[k]+note,cfg.types[k],on=>{cfg.types[k]=on;},{disabled:off});
            }),
            toggle('AI deeper questions',false,()=>{},{disabled:true,tag:'Later'}))),
        h('div',{class:'field'},h('span',{class:'lbl'},'Direction'),
          seg([['mix','Mixed'],['wd','Word → Definition'],['dw','Definition → Word']],cfg.dir,v=>{cfg.dir=v;},'Direction')),
        err,
        h('div',{class:'form-actions'},
          btn('Start test',{cls:'primary',icon:'test',onclick:()=>{
            const types=['tf','mc','wr','cz'].filter(k=>cfg.types[k]);
            if(!types.length){err.textContent='Pick at least one question type.';return;}
            cfg.count=Math.max(1,Math.min(200,parseInt(count.value,10)||cfg.count));
            showTest(buildTest(types));
          }}),
          btn('Cancel',{cls:'ghost',onclick:back}))));
    window.scrollTo(0,0);
  }
  /* cards are dealt in shuffled rounds, so a repeated word is always a full round away */
  function dealCards(total){
    const seq=[];let prevRound=null;
    const m=Math.min(3,Math.floor(N/2));
    while(seq.length<total){
      let round=shuffle(deck.cards);
      if(prevRound&&m>0){
        const avoid=new Set(prevRound.slice(-m).map(c=>c.id));
        const front=round.filter(c=>!avoid.has(c.id)),back=round.filter(c=>avoid.has(c.id));
        round=front.slice(0,m).concat(back,front.slice(m));
      }
      seq.push(...round);prevRound=round;
    }
    return seq.slice(0,total);
  }
  function buildTest(types){
    const nonCz=types.filter(t=>t!=='cz'),czOn=types.indexOf('cz')!==-1;
    let k=0;
    const qs=dealCards(cfg.count).map((c,idx)=>{
      const card=sc(deck,c);
      if(czOn&&hasBlanks(c.d)&&(!nonCz.length||Math.random()<0.6)){
        const cl=parseCloze(c.d),bi=Math.floor(Math.random()*cl.n);
        return{card,type:'cz',wd:true,prompt:c.w,cl,bi,answer:blankAnswer(cl,bi),given:null,order:idx};
      }
      let t=nonCz.length?nonCz[(k++)%nonCz.length]:'wr';
      const wd=cfg.dir==='mix'?Math.random()<.5:cfg.dir==='wd';
      const prompt=wd?c.w:c.d,answer=plain(wd?c.d:c.w);
      const q={card,type:t,wd,prompt,answer,given:null,order:idx};
      if(t==='mc'){q.options=makeOptions(card,answer,wd,4);if(q.options.length<2)t=q.type='wr';}
      if(t==='tf'){
        const wrongOnes=distractors(card,answer,wd,1);
        if(!wrongOnes.length)t=q.type='wr';
        else{q.isTrue=Math.random()<.5;q.shown=q.isTrue?answer:wrongOnes[0];}
      }
      return q;
    });
    const order={tf:0,mc:1,wr:2,cz:3};
    return qs.sort((a,b)=>(order[a.type]-order[b.type])||(a.order-b.order));
  }
  const promptNode=q=>q.type==='cz'
    ?h('p',{class:'qp'},h('strong',null,rich(q.prompt)),' = ',clozeNode(q.cl.parts,q.bi,q.answer.length))
    :h('p',{class:'qp '+(plain(q.prompt).length>60?'long':'')},rich(q.prompt));
  function showTest(qs){
    const form=h('div');
    const arts=[];
    let lastType=null,warned=false,sel=0;
    function select(i,o){
      o=o||{};
      i=Math.max(0,Math.min(qs.length-1,i));
      if(arts[sel])arts[sel].classList.remove('sel');
      sel=i;arts[i].classList.add('sel');
      if(o.scroll!==false){try{arts[i].scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}}
      const q=qs[i];
      if(q.input){if(isDesk||o.focus)q.input.focus({preventScroll:true});}
      else{const a=document.activeElement;if(a&&a.tagName==='INPUT')a.blur();}
    }
    function choose(i,n){
      if(sel!==i)select(i,{scroll:false});
      const q=qs[i];
      q.given=q.type==='mc'?q.options[n]:(n===0);
      q.buttons.forEach((b,k)=>b.classList.toggle('picked',k===n));
      if(isDesk)select(i+1);
    }
    qs.forEach((q,i)=>{
      if(q.type!==lastType){form.append(h('p',{class:'qh'},TYPE_LABEL[q.type]));lastType=q.type;}
      const pimg=q.type==='cz'?q.card.wi:(q.wd?q.card.wi:q.card.di);
      const art=h('article',{class:'q',onclick:()=>{if(sel!==i)select(i,{scroll:false,focus:true});}},
        h('div',{class:'q-top'},h('span',null,String(i+1)+' / '+qs.length)));
      if(q.type==='mc'){
        q.buttons=q.options.map((t,n)=>h('button',{type:'button',class:'choice',onclick:()=>choose(i,n)},h('span',{class:'kc'},String(n+1)),h('span',{class:'ct'},t)));
        art.append(cimg(pimg,'q-img'),promptNode(q),h('p',{class:'ask'},'Choose the '+(q.wd?'definition':'word')),h('div',{class:'choices'},q.buttons));
      }else if(q.type==='tf'){
        q.buttons=['True','False'].map((t,n)=>h('button',{type:'button',class:'choice',onclick:()=>choose(i,n)},h('span',{class:'kc'},String(n+1)),h('span',{class:'ct'},t)));
        art.append(h('p',{class:'ask'},'Do these belong together?'),
          h('div',{class:'tf-line'},cimg(pimg,'q-img'),h('strong',null,rich(q.prompt)),h('span',{class:'arrow'},'→'),q.shown),
          h('div',{class:'choices'},q.buttons));
      }else{
        q.input=h('input',{class:'in',type:'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false','aria-label':'Answer for question '+(i+1),
          placeholder:q.type==='cz'?'Fill in the blank':'Type the '+(q.wd?'definition':'word'),
          oninput:e=>{q.given=e.target.value;},
          onfocus:()=>{if(sel!==i)select(i,{scroll:false});}});
        art.append(cimg(pimg,'q-img'),promptNode(q),h('p',{class:'ask'},q.type==='cz'?'Fill in the blank':'Type the '+(q.wd?'definition':'word')),q.input);
      }
      arts.push(art);form.append(art);
    });
    const warn=h('p',{class:'err',role:'alert'});
    const submit=btn('Check test',{cls:'primary',icon:'check',onclick:()=>{
      const un=qs.filter(q=>(q.type==='wr'||q.type==='cz')?!(q.given||'').trim():q.given==null).length;
      if(un&&!warned){warned=true;warn.textContent=un+(un===1?' question is':' questions are')+' unanswered. Press again to check anyway.';return;}
      showResults(qs);
    }});
    root.replaceChildren(studyBar('Test · '+deck.title,'Quit',back),
      h('div',{style:'max-width:760px;margin:0 auto'},form,h('div',{class:'submit-bar'},submit,warn),
        h('p',{class:'center-hint desk-only'},'1–4 to answer · ↑ ↓ ← → to move between questions · Enter in a written answer goes to the next')));
    setKeys(e=>{
      const tag=e.target.tagName,typing=tag==='INPUT'||tag==='TEXTAREA',q=qs[sel];
      if(typing){
        if(e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();select(sel+1,{focus:true});}
        else if(e.key==='ArrowUp'){e.preventDefault();select(sel-1,{focus:true});}
        return;
      }
      if(tag==='BUTTON'&&(e.key==='Enter'||e.key===' '))return;
      if(/^[1-9]$/.test(e.key)){
        const n=+e.key-1;
        if(q.buttons&&q.buttons[n]){e.preventDefault();choose(sel,n);}
        return;
      }
      if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();select(sel-1);}
      else if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();select(sel+1);}
    });
    window.scrollTo(0,0);
    select(0,{scroll:false});
  }
  function grade(q){
    if(q.type==='mc'){return q.given!=null&&norm(q.given)===norm(q.answer)?'exact':'wrong';}
    if(q.type==='tf')return q.given===q.isTrue?'exact':'wrong';
    return judge(q.given||'',q.answer).r;
  }
  function showResults(qs){
    setKeys(null);
    qs.forEach(q=>{
      q.res=grade(q);q.ok=q.res!=='wrong';
      if(q.ok)markRight(q.card);else markWrong(q.card);
    });
    const right=qs.filter(q=>q.ok).length;
    const pctv=Math.round(right/qs.length*100);
    recordTest(deck,right,qs.length);
    const hist=deck.stats.tests;
    const prevBest=hist.length>1?Math.max.apply(null,hist.slice(0,-1).map(t=>Math.round(t.right/t.total*100))):null;
    const list=qs.map((q,i)=>{
      let yours,correct;
      if(q.type==='tf'){
        yours=q.given==null?'No answer':(q.given?'True':'False');
        correct=q.isTrue?'True':'False';
      }else{
        yours=(q.given&&String(q.given).trim())||'No answer';
        correct=q.answer;
      }
      return h('article',{class:'q '+(q.ok?'ok':'bad')},
        h('div',{class:'q-top'},h('span',null,(i+1)+' · '+TYPE_LABEL[q.type])),
        q.type==='tf'?h('div',{class:'tf-line'},h('strong',null,rich(q.prompt)),h('span',{class:'arrow'},'→'),q.shown):promptNode(q),
        h('div',{class:'q-res '+(q.ok?'ok':'bad')},icon(q.ok?'check':'cross'),
          h('div',null,q.ok
            ?h('span',null,'Your answer: ',h('strong',null,yours),q.res==='near'?h('span',null,' (small typo, spelled ',h('strong',null,correct),')'):null)
            :h('span',null,'Your answer: ',h('span',{class:'ans-bad'},yours),h('br'),'Correct: ',h('span',{class:'ans-good'},correct)))));
    });
    root.replaceChildren(studyBar('Test · '+deck.title,'Back',back),
      h('div',{style:'max-width:760px;margin:0 auto'},
        h('div',{class:'result',style:'margin:0 0 26px'},
          h('p',{class:'eyebrow'},prevBest!==null&&pctv>prevBest?'New best score':'Test complete'),
          h('div',{class:'score'},h('span',{class:'mark'},right+' / '+qs.length)),
          h('p',{class:'sub'},pctv+'%'+(prevBest!==null?' · previous best '+prevBest+'%':'')+(right<qs.length?' · missed cards are scheduled for review.':' · perfect score.')),
          h('div',{class:'row'},btn('Retake test',{cls:'primary',onclick:showConfig}),btn('Back to deck',{cls:'ghost',onclick:back}))),
        list));
    window.scrollTo(0,0);
  }
  showConfig();
  return root;
}

/* =====================================================================
   Views + boot
   ===================================================================== */
const VIEWS={home:homeView,deck:deckView,edit:editView,export:exportView,flash:flashView,match:matchView,write:writeView,learn:learnView,test:testView};
document.getElementById('brand').addEventListener('click',()=>go('home'));

(function boot(){
  const loc=lsLoad();
  if(loc&&Array.isArray(loc.decks)){S={decks:loc.decks,review:Array.isArray(loc.review)?loc.review:[],images:loc.images||{},seeded:true};localLoaded=true;}
  else S={decks:[exampleDeck()],review:[],images:{},seeded:true};
  pruneReview(true);
  const sv=loadView();
  if(sv&&VIEWS[sv.name]&&sv.name!=='home'){
    if(!sv.id||deckById(sv.id))view=Object.assign({},sv,{restore:sv.name==='edit'});
    else pending=sv;
  }
  render();
  connectDb();
})();

})();
</script>
