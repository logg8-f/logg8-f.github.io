<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quizlet 2.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: one calm column, ink-on-paper, with a highlighter-yellow marker used only for "this is active / this is you". */
:root{
  --bg:#F3F4FA; --surface:#FFFFFF; --surface-2:#E8EAF5;
  --ink:#151A3F; --ink-2:#555B86; --line:#D3D7EA;
  --hl:#FFE45C; --on-hl:#151A3F; --mark:#FFE45C;
  --good:#0E8F58; --good-bg:#DDF5E9; --bad:#C93A31; --bad-bg:#FCE3E0;
  --shadow:0 1px 0 rgba(21,26,63,.06), 0 10px 26px -14px rgba(21,26,63,.30);
  --f-display:'Familjen Grotesk','Helvetica Neue',Arial,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1026; --surface:#161A3A; --surface-2:#20254B;
    --ink:#EDEFFF; --ink-2:#A4AADB; --line:#2D3364;
    --hl:#FFE45C; --on-hl:#151A3F; --mark:rgba(255,228,92,.34);
    --good:#4BD88F; --good-bg:#12382B; --bad:#FF8279; --bad-bg:#472122;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1026; --surface:#161A3A; --surface-2:#20254B;
  --ink:#EDEFFF; --ink-2:#A4AADB; --line:#2D3364;
  --hl:#FFE45C; --on-hl:#151A3F; --mark:rgba(255,228,92,.34);
  --good:#4BD88F; --good-bg:#12382B; --bad:#FF8279; --bad-bg:#472122;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{display:inline-flex;flex:none}
.i svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mark{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 93%,transparent 93%);padding:0 .1em;margin:0 -.1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.wrap{width:100%;max-width:1040px;margin-inline:auto;padding-inline:clamp(16px,4vw,28px)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;height:60px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 6px 4px 0;font:700 21px/1 var(--f-display);letter-spacing:-.02em}
.brand svg{width:32px;height:32px;flex:none}
.brand b{font:500 13px/1 var(--f-mono);background:var(--hl);color:var(--on-hl);padding:4px 6px;border-radius:5px;transform:rotate(-3deg);letter-spacing:0}
.logo-c1{fill:var(--surface-2);stroke:var(--ink);stroke-width:2}
.logo-c2{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.logo-hl{fill:var(--hl)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;line-height:1.2;text-decoration:none;transition:transform .12s, background .12s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:none}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.hl{background:var(--hl);color:var(--on-hl);border-color:var(--hl)}
.btn.ghost{border-color:var(--line);background:var(--surface)}
.btn.ghost:hover:not(:disabled){border-color:var(--ink)}
.btn.link{border-color:transparent;padding-inline:8px;color:var(--ink-2)}
.btn.link:hover:not(:disabled){color:var(--ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border:0;border-radius:9px;background:transparent;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.round{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:background .12s,border-color .12s}
.round:hover:not(:disabled){border-color:var(--ink);background:var(--hl);color:var(--on-hl)}
.round:disabled{opacity:.35}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* views */
.view{padding-block:28px 80px;animation:rise .25s ease both}
@keyframes rise{from{transform:translateY(5px)}to{transform:none}}
.eyebrow{font:500 12px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.sec{margin-top:48px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-h h2{font-size:1.6rem}
.sub{color:var(--ink-2)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:center}
.hero-copy{display:grid;gap:18px;justify-items:start}
.hero h1{font-size:clamp(2.3rem,6vw,3.9rem);line-height:1.02;font-weight:700;letter-spacing:-.03em}
.lead{font-size:1.15rem;color:var(--ink-2);max-width:46ch}
.hero-art svg{display:block;width:100%;max-width:440px;height:auto;margin-inline:auto}
.art .c3{fill:var(--surface-2);stroke:var(--line);stroke-width:2}
.art .c2{fill:var(--surface);stroke:var(--line);stroke-width:2}
.art .c1{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.art .swipe{fill:var(--mark)}
.art .t1{font:700 46px var(--f-display);fill:var(--ink);letter-spacing:-1px}
.art .t2{font:500 17px var(--f-body);fill:var(--ink-2)}
.art .t3{font:500 13px var(--f-mono);fill:var(--ink-2)}
.art .key{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.art .kt{font:500 15px var(--f-mono);fill:var(--ink)}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:20px}}

/* decks */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.deck{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:150px;width:100%;padding:18px;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:16px;transition:border-color .12s, transform .12s}
.deck:hover{border-color:var(--ink);transform:translateY(-2px)}
.deck h3{font-size:1.2rem;line-height:1.2;overflow-wrap:anywhere}
.deck p{color:var(--ink-2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.deck .meta{margin-top:auto;font:500 12px var(--f-mono);color:var(--ink-2)}
.deck.new{border-style:dashed;align-items:center;justify-content:center;gap:6px;background:transparent;color:var(--ink-2);font-weight:600}
.deck.new .i svg{width:1.8em;height:1.8em}
.tag{display:inline-block;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--ink-2);padding:2px 7px;border-radius:999px}
.add-round{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);background:var(--hl);color:var(--on-hl);display:grid;place-items:center;flex:none}
.add-round:hover{transform:rotate(90deg)}
.add-round{transition:transform .2s}

/* review */
.review{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:22px}
.review ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.rv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:10px 4px 10px 12px;border-radius:10px;background:var(--bg)}
.rv-t{min-width:0;overflow-wrap:anywhere}
.rv-t .arrow{color:var(--ink-2);margin-inline:8px}
.rv-deck{grid-column:1;font:500 12px var(--f-mono);color:var(--ink-2)}
.rv .icon-btn{grid-row:1/3;grid-column:2}

/* hub */
.hub-top{display:grid;gap:12px;margin:8px 0 28px}
.hub-top h1{font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.08;overflow-wrap:anywhere}
.hub-top .desc{color:var(--ink-2);max-width:62ch;white-space:pre-wrap;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fns{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,185px),1fr));gap:12px}
.fn{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:18px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);transition:transform .12s,border-color .12s}
.fn:hover:not(:disabled){border-color:var(--ink);transform:translateY(-2px)}
.fn:hover:not(:disabled) .fn-i{background:var(--hl);color:var(--on-hl)}
.fn-i{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);transition:background .12s}
.fn h3{font-size:1.15rem}
.fn p{color:var(--ink-2);font-size:14px}
.fn:disabled{opacity:.55}
.note-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-top:16px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
details.cards-list{margin-top:28px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
details.cards-list summary{padding:14px 16px;font-weight:600;cursor:pointer}
.cl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:6px 20px;padding:0 16px 16px}
.cl div{padding:8px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.cl .h{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);border:0;padding-bottom:0}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--bad-bg);border:1.5px solid var(--bad)}

/* forms */
.form{max-width:780px;display:grid;gap:22px}
.form h1{font-size:clamp(1.8rem,5vw,2.4rem)}
.field{display:grid;gap:7px}
.field>label,.lbl{font-weight:600;font-size:14px}
.in{width:100%;padding:11px 13px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;font:inherit;line-height:1.4}
.in:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--mark)}
.in::placeholder{color:var(--ink-2);opacity:.7}
textarea.in{resize:vertical;min-height:44px}
.in.big{font-size:1.2rem;padding:14px 16px}
.hint{font-size:13px;color:var(--ink-2)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.setting-l{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.setting-l strong{font-family:var(--f-display);font-size:1.1rem}
.info{position:relative;display:inline-flex}
.info>button{width:30px;height:30px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.info>button:hover{color:var(--ink);background:var(--surface-2)}
.tip{display:none;position:absolute;left:0;top:36px;z-index:3;width:min(300px,78vw);padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;line-height:1.45;box-shadow:var(--shadow)}
.info:hover .tip,.info.open .tip,.info:focus-within .tip{display:block}
.switch{width:46px;height:27px;border-radius:999px;background:var(--surface-2);border:1.5px solid var(--ink-2);position:relative;padding:0;flex:none;transition:background .15s,border-color .15s}
.switch .knob{position:absolute;top:2.5px;left:2.5px;width:19px;height:19px;border-radius:50%;background:var(--ink);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--hl);border-color:var(--ink)}
.switch[aria-checked="true"] .knob{transform:translateX(19px);background:var(--on-hl)}
.switch:disabled{opacity:.5}
.tg{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 0;font-weight:500}
.soon{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--ink-2);padding:1px 6px;border-radius:999px;margin-left:8px;font-style:normal}
.slots{display:grid;gap:10px}
.slot{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1.6fr) auto;grid-template-areas:"n w d a";gap:10px;align-items:center}
.slot-n{grid-area:n;font:500 13px var(--f-mono);color:var(--ink-2);text-align:center}
.slot .w{grid-area:w}.slot .d{grid-area:d}.slot-a{grid-area:a;display:flex;gap:2px}
@media (max-width:640px){
  .slot{grid-template-columns:24px minmax(0,1fr) auto;grid-template-areas:"n w a" "n d a";gap:6px 8px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .slot-a{flex-direction:column}
}
.add-card{justify-self:start}
.bulk{display:grid;gap:10px;padding:16px;border:1.5px dashed var(--line);border-radius:14px}
.bulk-info{font:500 13px var(--f-mono);color:var(--ink-2)}
.err{color:var(--bad);font-weight:600;min-height:1.4em}
.form-actions{display:flex;flex-wrap:wrap;gap:10px}

/* study shell */
.sbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:22px}
.sbar-t{font-size:1.1rem;text-align:center}
.sbar .btn.link{justify-self:start}
@media (max-width:520px){.sbar{grid-template-columns:auto 1fr}.sbar>:last-child{display:none}.sbar-t{text-align:right}}
.opts{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;justify-content:center;margin-top:22px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--hl);color:var(--on-hl)}
.opts .tg{padding:0;gap:10px;font-size:14px}
.desk-only{display:none}
@media (hover:hover) and (pointer:fine){.desk-only{display:block}.kc{display:inline-flex!important}}
.kc{display:none;flex:none;min-width:22px;height:22px;padding:0 4px;align-items:center;justify-content:center;border:1px solid var(--line);border-bottom-width:2.5px;border-radius:5px;font:500 11px var(--f-mono);color:var(--ink-2);background:var(--bg)}
.center-hint{text-align:center;font-size:13px;color:var(--ink-2);margin-top:14px}

/* flashcards */
.fc-stage{max-width:720px;margin:0 auto;perspective:1500px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.fc{width:100%;aspect-ratio:3/2;min-height:230px;cursor:pointer;display:block}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.fc-inner.flipped{transform:rotateY(180deg)}
.fc-inner.noanim{transition:none}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;background:var(--surface);border:1.5px solid var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;padding:34px 26px 26px;text-align:center}
.fc-face.back{transform:rotateY(180deg);background:var(--surface-2)}
.fc-label{position:absolute;top:14px;left:18px;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.fc-text{font:600 clamp(1.6rem,5vw,2.6rem)/1.15 var(--f-display);max-height:100%;overflow:auto;overflow-wrap:anywhere;letter-spacing:-.01em}
.fc-text.mid{font-size:clamp(1.3rem,3.6vw,1.9rem)}
.fc-text.long{font:500 clamp(1.05rem,2.6vw,1.3rem)/1.4 var(--f-body)}
.fc-stage.in-next .fc{animation:slideR .22s ease both}
.fc-stage.in-prev .fc{animation:slideL .22s ease both}
@keyframes slideR{from{transform:translateX(26px)}to{transform:none}}
@keyframes slideL{from{transform:translateX(-26px)}to{transform:none}}
.fc-nav{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:22px}
.count{font:500 15px var(--f-mono);min-width:70px;text-align:center}

/* match */
.mbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;font-size:14px;color:var(--ink-2)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.tile{display:flex;align-items:center;gap:10px;text-align:left;min-height:96px;padding:14px 16px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;font:500 15px/1.35 var(--f-body);overflow-wrap:anywhere;transition:background .12s,border-color .12s,opacity .25s,transform .12s}
.tile.k-w{font:600 17px/1.25 var(--f-display)}
.tile:hover:not(:disabled){border-color:var(--ink)}
.tile.sel{background:var(--hl);color:var(--on-hl);border-color:var(--ink);transform:translateY(-2px)}
.tile.sel .kc{background:transparent;border-color:var(--on-hl);color:var(--on-hl)}
.tile.ok{background:var(--good-bg);border-color:var(--good)}
.tile.bad{background:var(--bad-bg);border-color:var(--bad);animation:shake .38s}
.tile.done{opacity:.35;background:transparent;border-style:dashed}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* write, choose, learn */
.wtop{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.pbar{flex:1;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;width:0;background:var(--ink);border-radius:99px;transition:width .3s}
.wq{max-width:720px;margin:0 auto;display:grid;gap:18px}
.wprompt{position:relative;background:var(--surface);border:1.5px solid var(--ink);border-radius:20px;padding:44px 24px 30px;text-align:center;box-shadow:var(--shadow)}
.wp-text{font:600 clamp(1.5rem,4.6vw,2.4rem)/1.2 var(--f-display);overflow-wrap:anywhere}
.wp-text.long{font:500 clamp(1.1rem,3vw,1.4rem)/1.4 var(--f-body)}
.wp-text.xl{font:500 1.05rem/1.5 var(--f-body)}
.warea{display:grid;gap:14px}
.ask{font-weight:600;color:var(--ink-2);font-size:14px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:500;overflow-wrap:anywhere;transition:background .12s,border-color .12s}
.choice:hover:not(:disabled){border-color:var(--ink);background:var(--hl);color:var(--on-hl)}
.choice:hover:not(:disabled) .kc{border-color:var(--on-hl);color:var(--on-hl);background:transparent}
.choice.right{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.choice:disabled{opacity:1}
.choice:disabled:not(.right):not(.wrong){opacity:.55}
.fb{display:grid;gap:8px;padding:16px 18px;border-radius:14px;border:1.5px solid}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb strong{font-family:var(--f-display);font-size:1.15rem}
.ans-good{font-weight:700;overflow-wrap:anywhere}
.ans-bad{text-decoration:line-through;overflow-wrap:anywhere}
.result{max-width:640px;margin:20px auto 0;display:grid;gap:16px;justify-items:start}

.tf-line{padding:10px 12px;border-radius:10px;background:var(--bg);overflow-wrap:anywhere}
.tf-line .arrow{color:var(--ink-2);margin-inline:8px}
.choice.picked{background:var(--hl);color:var(--on-hl);border-color:var(--ink)}
.choice.picked .kc{border-color:var(--on-hl);color:var(--on-hl);background:transparent}

.q-res{display:flex;gap:10px;align-items:flex-start}

<script>
(function(){
'use strict';

/* =====================================================================
   Pure helpers
   ===================================================================== */
const uid=()=>Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,8);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function chunk(a,n){const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r;}
function norm(s){return String(s==null?'':s).normalize('NFC').toLowerCase().replace(/[\s ]+/g,' ').replace(/[.!?;,]+$/,'').trim();}
function clone(o){return JSON.parse(JSON.stringify(o));}
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function lenClass(t){return t.length>90?'xl':t.length>40?'long':'';}

const SEPS=[';','\t',' — ',' – ',' - ',':',','];
function splitLine(line){
  line=line.trim();if(!line)return null;
  for(const s of SEPS){
    const i=line.indexOf(s);
    if(i>0){const w=line.slice(0,i).trim(),d=line.slice(i+s.length).trim();if(w&&d)return{w,d};}
  }
  const m=line.match(/^(\S+)\s+([\s\S]+)$/);
  if(m)return{w:m[1],d:m[2].trim()};
  return null;
}
function parseBulk(text){
  const pairs=[],skipped=[];
  String(text||'').split(/\r?\n/).forEach(l=>{
    if(!l.trim())return;
    const p=splitLine(l);
    if(p)pairs.push(p);else skipped.push(l.trim());
  });
  return{pairs,skipped};
}
function sectionSizes(n){
  if(n<=0)return[];
  const k=Math.ceil(n/8),base=Math.floor(n/k),extra=n%k;
  return Array.from({length:k},(_,i)=>base+(i<extra?1:0));
}
function pairsPerRound(n){return n<=5?n:(n<=8?Math.ceil(n/2):5);}
function variants(ans){
  const out=new Set();
  const add=s=>{const n=norm(s);if(n)out.add(n);};
  const strip=s=>s.replace(/\([^)]*\)/g,' ');
  ans=String(ans);
  add(ans);add(strip(ans));
  ans.split(/\s*[;\/]\s*/).forEach(p=>{add(p);add(strip(p));});
  return Array.from(out);
}
function isRight(given,answer){
  const g=norm(given);
  if(!g)return false;
  return variants(answer).indexOf(g)!==-1;
}
function distractors(c,answer,wd,k){
  const seen=new Set([norm(answer)]),out=[];
  shuffle(c.deck.cards).forEach(x=>{
    if(x.id===c.id||out.length>=k)return;
    const t=wd?x.d:x.w,n=norm(t);
    if(seen.has(n))return;
    seen.add(n);out.push(t);
  });
  return out;
}
function makeOptions(c,answer,wd,n){return shuffle([answer].concat(distractors(c,answer,wd,n-1)));}

const app=document.getElementById('app');
function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const k in (props||{})){
    const v=props[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else e.setAttribute(k,v);
  }
  kids.flat(Infinity).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(String(c)));});
  return e;
}
const ICON={
  plus:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  next:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  info:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  trash:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  edit:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1zM14 7l3 3"/></svg>',
  cards:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="12" rx="2"/><path d="M7 4h12a2 2 0 012 2v9"/></svg>',
  match:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="6" rx="1.5"/><rect x="14" y="14" width="7" height="6" rx="1.5"/><path d="M10 7h2a2 2 0 012 2v5"/></svg>',
  write:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M6 16l9-9 3 3-9 9-4 1z"/></svg>',
  learn:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h5v-5h5v-5h5V5h3"/></svg>',
  test:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 14l2 2 4-4"/></svg>',
  check:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
  cross:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const icon=n=>h('span',{class:'i',html:ICON[n]});
function btn(label,o){
  o=o||{};
  return h('button',{type:'button',class:'btn '+(o.cls||''),id:o.id,disabled:o.disabled,title:o.title,onclick:o.onclick},o.icon?icon(o.icon):null,label);
}
function seg(options,value,onChange,label){
  const wrap=h('div',{class:'seg',role:'group','aria-label':label});
  const btns=options.map(op=>h('button',{type:'button','aria-pressed':String(op[0]===value),onclick:()=>{
    value=op[0];
    btns.forEach((b,i)=>b.setAttribute('aria-pressed',String(options[i][0]===value)));
    onChange(value);
  }},op[1]));
  wrap.append(...btns);
  return wrap;
}
function toggle(label,on,onChange,o){
  o=o||{};
  let state=on;
  const sw=h('button',{type:'button',role:'switch','aria-checked':String(on),class:'switch',disabled:o.disabled,onclick:()=>{
    state=!state;sw.setAttribute('aria-checked',String(state));onChange(state);
  }},h('span',{class:'knob'}));
  return h('label',{class:'tg'},h('span',null,label,o.tag?h('em',{class:'soon'},o.tag):null),sw);
}

/* =====================================================================
   Data + storage
   ===================================================================== */
const KEY='quizlet2.v1';
let S={decks:[],review:[],seeded:true};
let dirty=false,localLoaded=false,col=null;

function exampleDeck(){
  const pairs=[['kaffe','coffee'],['tack','thank you'],['hej då','goodbye'],['fika','a coffee break with something sweet'],['lagom','just the right amount'],['skärgård','archipelago'],['midsommar','midsummer'],['kanelbulle','cinnamon bun'],['tunnelbana','subway'],['hemma','at home'],['vecka','week'],['fönster','window']];
  return{id:'example',example:true,title:'Everyday Swedish',desc:'An example deck so you can try every study mode. Delete it whenever you like.',choize:true,created:Date.now(),
    cards:pairs.map((p,i)=>({id:'e'+i,w:p[0],d:p[1]}))};
}
function lsSave(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function lsLoad(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null;}catch(e){return null;}}

const dq={};
function dbQueue(id,data){
  if(!col)return;
  const e=dq[id]||(dq[id]={});
  e.data=data;clearTimeout(e.timer);
  e.timer=setTimeout(()=>dbFlush(id),350);
}
async function dbFlush(id){
  const e=dq[id];
  if(!col||!e)return;
  if(e.busy){e.timer=setTimeout(()=>dbFlush(id),250);return;}
  e.busy=true;
  const data=e.data;
  try{
    if(data===null)await col.doc(id).delete();
    else await col.doc(id).set(data);
  }catch(err){/* local copy stays */}
  e.busy=false;
  if(e.data!==data){clearTimeout(e.timer);dbFlush(id);}
}
const metaDoc=()=>({review:clone(S.review),seeded:true});
function touchDeck(d){dirty=true;lsSave();dbQueue('d_'+d.id,clone(d));}
function touchMeta(){dirty=true;lsSave();dbQueue('meta',metaDoc());}
function removeDeck(id){
  S.decks=S.decks.filter(d=>d.id!==id);
  S.review=S.review.filter(r=>r.deck!==id);
  dirty=true;lsSave();
  dbQueue('d_'+id,null);dbQueue('meta',metaDoc());
}
const deckById=id=>S.decks.find(d=>d.id===id);
function pruneReview(silent){
  const n=S.review.length;
  S.review=S.review.filter(r=>{const d=deckById(r.deck);return d&&d.cards.some(c=>c.id===r.card);});
  if(!silent&&S.review.length!==n)touchMeta();
}
const sc=(deck,c)=>({id:c.id,w:c.w,d:c.d,deck});
function markWrong(c){
  const k=c.deck.id+':'+c.id;
  if(!S.review.some(r=>r.k===k)){S.review.push({k,deck:c.deck.id,card:c.id});touchMeta();}
}
function clearReview(c){
  const k=c.deck.id+':'+c.id,n=S.review.length;
  S.review=S.review.filter(r=>r.k!==k);
  if(S.review.length!==n)touchMeta();
}
function reviewItems(forDeck){
  const out=[];
  S.review.forEach(r=>{
    if(forDeck&&r.deck!==forDeck)return;
    const d=deckById(r.deck);if(!d)return;
    const c=d.cards.find(x=>x.id===r.card);if(!c)return;
    out.push({deck:d,card:c,key:r.k});
  });
  return out;
}

async function connectDb(){
  let db=null,me=null;
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const got=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      db=got[0];
      if(got[1])me=await got[1].id();
    }
  }catch(e){db=null;}
  if(!db||!me){if(!localLoaded)lsSave();return;}
  try{
    const c=db.collection('data/users/'+me);
    const snap=await c.get();
    const remoteDecks=[];let remoteMeta=null;
    snap.docs.forEach(s=>{
      const v=s.data();if(!v)return;
      if(s.id==='meta')remoteMeta=clone(v);
      else if(s.id.indexOf('d_')===0)remoteDecks.push(clone(v));
    });
    col=c;
    if(remoteDecks.length||remoteMeta){
      if(!dirty){
        S.decks=remoteDecks;
        S.review=(remoteMeta&&Array.isArray(remoteMeta.review))?remoteMeta.review:[];
      }else{
        const have=new Set(S.decks.map(d=>d.id));
        remoteDecks.forEach(d=>{if(!have.has(d.id))S.decks.push(d);});
        const keys=new Set(S.review.map(r=>r.k));
        ((remoteMeta&&remoteMeta.review)||[]).forEach(r=>{if(!keys.has(r.k))S.review.push(r);});
        S.decks.forEach(d=>dbQueue('d_'+d.id,clone(d)));
        dbQueue('meta',metaDoc());
      }
    }else{
      S.decks.forEach(d=>dbQueue('d_'+d.id,clone(d)));
      dbQueue('meta',metaDoc());
    }
    S.seeded=true;
    pruneReview(true);
    lsSave();
    softRefresh();
  }catch(e){
    col=null;
    if(!localLoaded)lsSave();
  }
}

/* =====================================================================
   Router
   ===================================================================== */
let view={name:'home'},keyFn=null,leave=[];
const setKeys=fn=>{keyFn=fn;};
const onLeave=fn=>{leave.push(fn);};
document.addEventListener('keydown',e=>{if(keyFn&&!e.metaKey&&!e.ctrlKey&&!e.altKey)keyFn(e);});
function go(name,params){
  leave.forEach(f=>{try{f();}catch(e){}});leave=[];keyFn=null;
  view=Object.assign({name},params||{});
  render();
  window.scrollTo(0,0);
}
function render(){
  app.replaceChildren();
  const fn=VIEWS[view.name]||VIEWS.home;
  app.append(fn(view));
}
function softRefresh(){
  if(view.name==='home'||view.name==='deck')render();
}
function missing(){
  view={name:'home'};
  return homeView();
}
function studyBar(title,backLabel,backFn){

   Home
   ===================================================================== */
const ART='<svg class="art" viewBox="0 0 420 300" role="img" aria-label="A stack of flashcards with a highlighted word">'+
'<g transform="rotate(-9 210 150)"><rect x="70" y="50" width="280" height="190" rx="18" class="c3"/></g>'+
'<g transform="rotate(5 210 150)"><rect x="70" y="50" width="280" height="190" rx="18" class="c2"/></g>'+
'<g transform="rotate(-2 210 150)"><rect x="70" y="50" width="280" height="190" rx="18" class="c1"/>'+
'<rect x="132" y="128" width="158" height="26" rx="3" class="swipe" transform="rotate(-1.5 210 140)"/>'+
'<text x="210" y="152" text-anchor="middle" class="t1">lagom</text>'+
'<text x="210" y="192" text-anchor="middle" class="t2">just the right amount</text>'+
'<text x="92" y="82" class="t3">5 / 12</text></g>'+
'<rect x="118" y="256" width="34" height="30" rx="7" class="key"/><text x="135" y="277" text-anchor="middle" class="kt">←</text>'+
'<rect x="268" y="256" width="34" height="30" rx="7" class="key"/><text x="285" y="277" text-anchor="middle" class="kt">→</text>'+
'</svg>';

function deckTile(d){
  return h('button',{type:'button',class:'deck',onclick:()=>go('deck',{id:d.id})},
    d.example?h('span',{class:'tag'},'Example'):null,
    h('h3',null,d.title),
    d.desc?h('p',null,d.desc):null,
    h('span',{class:'meta'},d.cards.length+(d.cards.length===1?' card':' cards')));

function homeView(){
  const ex=S.decks.find(d=>d.example);
  const totalCards=S.decks.reduce((n,d)=>n+d.cards.length,0);
  const hero=h('section',{class:'hero'},
    h('div',{class:'hero-copy'},
      h('p',{class:'eyebrow'},S.decks.length+(S.decks.length===1?' deck':' decks')+' · '+totalCards+(totalCards===1?' card':' cards')),
      h('h1',null,'Welcome to ',h('span',{class:'mark'},'Quizlet 2.0'),'.'),
      h('p',{class:'lead'},'To get started, create a deck of words and definitions. Then study it with flashcards, match, write, learn and test.'),
      h('div',{class:'row'},
        btn('Create a deck',{cls:'primary',icon:'plus',onclick:()=>go('edit')}),
        ex?btn('Open the example deck',{cls:'ghost',onclick:()=>go('deck',{id:ex.id})}):null)),
    h('div',{class:'hero-art',html:ART}));

  const decks=h('section',{class:'sec'},
    h('div',{class:'sec-h'},h('h2',null,'Your decks'),
      h('button',{type:'button',class:'add-round','aria-label':'Create new deck',title:'Create new deck',onclick:()=>go('edit')},icon('plus'))),
    S.decks.length?null:h('p',{class:'sub',style:'margin-bottom:14px'},'No decks yet. Create your first one.'),
    h('div',{class:'decks'},S.decks.map(deckTile),
      h('button',{type:'button',class:'deck new',onclick:()=>go('edit')},icon('plus'),h('span',null,'New deck'))));

  const root=h('div',{class:'wrap view'},hero,decks);

  pruneReview(false);
  const items=reviewItems();
  if(items.length){
    let all=false;
    const list=h('ul');
    const more=h('button',{type:'button',class:'btn link',onclick:()=>{all=!all;paint();}});
    function paint(){
      const shown=all?items:items.slice(0,6);
      list.replaceChildren(...shown.map(it=>h('li',{class:'rv'},
        h('div',{class:'rv-t'},h('strong',null,it.card.w),h('span',{class:'arrow'},'→'),it.card.d),
        h('span',{class:'rv-deck'},it.deck.title),
        h('button',{type:'button',class:'icon-btn','aria-label':'Dismiss '+it.card.w,title:'Dismiss',onclick:()=>{
          S.review=S.review.filter(r=>r.k!==it.key);touchMeta();render();
        }},icon('x')))));
      more.textContent=all?'Show fewer':'Show all '+items.length;
      more.hidden=items.length<=6;
    }
    paint();
    root.append(h('section',{class:'review sec'},
      h('div',{class:'sec-h',style:'margin-bottom:0'},
        h('div',null,h('h2',null,h('span',{class:'mark'},'Correct'),' these'),
          h('p',{class:'sub'},'Cards you got wrong. Answer them right once to clear them.')),
        btn('Correct '+items.length+(items.length===1?' card':' cards'),{cls:'primary',icon:'write',onclick:()=>go('write',{review:true})})),
      list,more));
  }
  return root;
}

/* =====================================================================
   Deck hub
   ===================================================================== */
const FN=[
  {k:'flash',t:'Flashcards',s:'Flip through the cards one at a time.',i:'cards',min:1},
  {k:'match',t:'Match',s:'Pair words with definitions as fast as you can.',i:'match',min:2},
  {k:'write',t:'Write',s:'Recall the answer and type it.',i:'write',min:1},
  {k:'learn',t:'Learn',s:'Work through the deck in sections of about 8.',i:'learn',min:2},
  {k:'test',t:'Test',s:'A mixed test built from this deck.',i:'test',min:2}
];
function deckView(p){
  const d=deckById(p.id);if(!d)return missing();
  const n=d.cards.length;
  const delBox=h('div');
  function askDelete(){
    delBox.replaceChildren(h('div',{class:'confirm',role:'alertdialog'},
      h('span',null,'Delete “'+d.title+'” and its '+n+' cards?'),
      btn('Delete',{cls:'danger',icon:'trash',onclick:()=>{removeDeck(d.id);go('home');}}),
      btn('Keep it',{cls:'ghost',onclick:()=>delBox.replaceChildren()})));
  }
  const rv=reviewItems(d.id);
  const root=h('div',{class:'wrap view'},
    btn('All decks',{cls:'link',icon:'back',onclick:()=>go('home')}),
    h('div',{class:'hub-top'},
      d.example?h('span',{class:'tag',style:'justify-self:start'},'Example'):null,
      h('h1',null,d.title),
      d.desc?h('p',{class:'desc'},d.desc):null,
      h('div',{class:'chips'},h('span',{class:'tag'},n+(n===1?' card':' cards')),h('span',{class:'tag'},'Choize '+(d.choize?'on':'off'))),
      h('div',{class:'row'},
        btn('Edit deck',{cls:'ghost',icon:'edit',onclick:()=>go('edit',{id:d.id})}),
        btn('Delete',{cls:'ghost',icon:'trash',onclick:askDelete})),
      delBox),

  function updBulk(){

    addBulk.disabled=!r.pairs.length;
    addBulk.lastChild.textContent=r.pairs.length?'Add '+r.pairs.length+(r.pairs.length===1?' card':' cards'):'Add cards';

  }

    const r=parseBulk(bulk.value);if(!r.pairs.length)return;

    h('div',{class:'form'},
      btn(orig?'Back to deck':'All decks',{cls:'link',icon:'back',onclick:()=>orig?go('deck',{id:orig.id}):go('home')}),
      h('h1',null,orig?'Edit deck':'New deck'),
      h('div',{class:'field'},h('label',{for:'f-title'},'Title'),title),
      h('div',{class:'field'},h('label',{for:'f-desc'},'Description'),desc),
      h('div',{class:'setting'},
        h('div',{class:'setting-l'},h('strong',{id:'choize-l'},'Choize'),info),sw),
      h('div',{class:'field'},
        h('div',{class:'sec-h',style:'margin-bottom:0'},h('span',{class:'lbl'},'Cards'),countEl),
        slotsBox,
        btn('Add card',{cls:'ghost add-card',icon:'plus',onclick:()=>addAfter(draft.cards.length-1)})),
      h('div',{class:'bulk'},
        h('span',{class:'lbl'},'Paste many cards at once'),
        h('p',{class:'hint'},'One card per line: Word; Definition. A colon, comma, dash, tab or space between the two works too.'),
        bulk,bulkInfo,h('div',null,addBulk)),
      err,
      h('div',{class:'form-actions'},
        btn(orig?'Save changes':'Create deck',{cls:'primary',icon:'check',onclick:save}),
        btn('Cancel',{cls:'ghost',onclick:()=>orig?go('deck',{id:orig.id}):go('home')}))));
  renderSlots();
  setTimeout(()=>{if(!orig)title.focus();},0);
  return root;
}

function flashView(p){
  const deck=deckById(p.id);if(!deck)return missing();
  const total=deck.cards.length;
  let order=deck.cards.slice(),i=0,flipped=false,front='w';
  const faceF=h('div',{class:'fc-face front'}),faceB=h('div',{class:'fc-face back'});
  const inner=h('div',{class:'fc-inner'},faceF,faceB);
  const card=h('div',{class:'fc',role:'button',tabindex:'0','aria-label':'Flip card'},inner);
  const stage=h('div',{class:'fc-stage'},card);
  const cnt=h('span',{class:'count','aria-live':'polite'});
  const prev=h('button',{type:'button',class:'round','aria-label':'Previous card',onclick:()=>move(-1)},icon('back'));
  const next=h('button',{type:'button',class:'round','aria-label':'Next card',onclick:()=>move(1)},icon('next'));
  function face(f,label,text){
    f.replaceChildren(h('span',{class:'fc-label'},label),h('div',{class:'fc-text '+(text.length>70?'long':text.length>28?'mid':'')},text));
  }
  function fill(){
    const c=order[i],a=front==='w'?c.w:c.d,b=front==='w'?c.d:c.w;
    face(faceF,front==='w'?'Word':'Definition',a);
    face(faceB,front==='w'?'Definition':'Word',b);
    cnt.textContent=(i+1)+' / '+total;
    prev.disabled=i===0;next.disabled=i===total-1;
  }
  function show(n,dir){
    i=n;flipped=false;
    inner.classList.add('noanim');inner.classList.remove('flipped');
    fill();void inner.offsetWidth;inner.classList.remove('noanim');
    if(dir){stage.classList.remove('in-next','in-prev');void stage.offsetWidth;stage.classList.add(dir>0?'in-next':'in-prev');}
  }
  function move(d){const n=i+d;if(n<0||n>=total)return;show(n,d);}
  function flip(){flipped=!flipped;inner.classList.toggle('flipped',flipped);}
  let sx=0,sy=0,swiped=false;
  stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;swiped=false;});
  stage.addEventListener('pointerup',e=>{
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){swiped=true;move(dx<0?1:-1);}
  });
  card.addEventListener('click',()=>{if(swiped){swiped=false;return;}flip();});
  setKeys(e=>{
    const t=e.target.tagName;
    if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}
    else if(e.key==='ArrowRight'){e.preventDefault();move(1);}
    else if((e.key===' '||e.key==='Enter'||e.key==='ArrowUp'||e.key==='ArrowDown')&&t!=='BUTTON'&&t!=='INPUT'){e.preventDefault();flip();}
  });
  const opts=h('div',{class:'opts'},
    seg([['w','Word first'],['d','Definition first']],front,v=>{front=v;show(i);},'Which side shows first'),
    toggle('Shuffle',false,on=>{order=on?shuffle(deck.cards):deck.cards.slice();show(0);}));
  show(0);
  return h('div',{class:'wrap view'},
    studyBar('Flashcards · '+deck.title,'Back',()=>go('deck',{id:deck.id})),
    stage,
    h('div',{class:'fc-nav'},prev,cnt,next),
    opts,
    h('p',{class:'center-hint desk-only'},'← → to move · Space to flip'),
    h('p',{class:'center-hint'},'Tap the card to flip it. Swipe left or right to change card.'));
}

/* =====================================================================
   Match engine + view
   ===================================================================== */
function matchEngine(box,cards,o){
  o=o||{};
  const per=pairsPerRound(cards.length);
  const rounds=chunk(shuffle(cards),per);
  let ri=0,sel=null,busy=false,tiles=[],left=0,wrongTries=0,dead=false;
  const t0=Date.now(),mistakes=new Set();
  const roundEl=h('span'),missEl=h('span'),timeEl=h('span',{class:'mono'},'0:00');
  const grid=h('div',{class:'mgrid'});
  box.replaceChildren(h('div',{class:'mbar'},roundEl,missEl,timeEl),grid);
  const tick=setInterval(()=>{timeEl.textContent=fmt(Date.now()-t0);},250);
  function start(){
    const r=rounds[ri];
    const list=shuffle(r.flatMap(c=>[{kind:'w',card:c,text:c.w},{kind:'d',card:c,text:c.d}]));
    tiles=list.map((t,n)=>{
      t.done=false;
      t.el=h('button',{type:'button',class:'tile k-'+t.kind,onclick:()=>pick(t)},
        h('span',{class:'kc'},String((n+1)%10)),h('span',null,t.text));
      return t;
    });
    grid.replaceChildren(...tiles.map(t=>t.el));
    left=r.length;sel=null;busy=false;
    roundEl.textContent=rounds.length>1?'Round '+(ri+1)+' of '+rounds.length:'Match the pairs';
    missEl.textContent=wrongTries+(wrongTries===1?' mistake':' mistakes');
  }
  function pick(t){
    if(dead||busy||t.done)return;
    if(sel===t){t.el.classList.remove('sel');sel=null;return;}
    if(!sel||sel.kind===t.kind){
      if(sel)sel.el.classList.remove('sel');
      sel=t;t.el.classList.add('sel');return;
    }
    const a=sel,b=t;sel=null;
    a.el.classList.remove('sel');
    if(a.card===b.card){
      a.done=b.done=true;a.el.disabled=b.el.disabled=true;
      a.el.classList.add('ok');b.el.classList.add('ok');
      left--;
      setTimeout(()=>{
        if(dead)return;
        [a,b].forEach(x=>{x.el.classList.remove('ok');x.el.classList.add('done');});
        if(left===0)nextRound();
      },520);
    }else{
      busy=true;wrongTries++;
      mistakes.add(a.card.id);mistakes.add(b.card.id);
      markWrong(a.card);markWrong(b.card);
      missEl.textContent=wrongTries+(wrongTries===1?' mistake':' mistakes');
      a.el.classList.add('bad');b.el.classList.add('bad');
      setTimeout(()=>{
        if(dead)return;
        a.el.classList.remove('bad');b.el.classList.remove('bad');busy=false;
      },480);
    }
  }
  function nextRound(){
    ri++;
    if(ri<rounds.length){start();return;}
    clearInterval(tick);
    if(o.onDone)o.onDone({mistakes,wrongTries,ms:Date.now()-t0});
  }
  function onKey(e){
    if(!/^[0-9]$/.test(e.key))return;
    const idx=e.key==='0'?9:(+e.key-1);
    if(tiles[idx]){e.preventDefault();pick(tiles[idx]);}
  }
  start();
  return{onKey,destroy(){dead=true;clearInterval(tick);}};
}
function matchView(p){
  const deck=deckById(p.id);if(!deck)return missing();
  const cards=deck.cards.map(c=>sc(deck,c));
  const box=h('div');
  let eng=null;
  function kill(){if(eng){eng.destroy();eng=null;}setKeys(null);}
  onLeave(kill);
  function play(){
    kill();
    eng=matchEngine(box,cards,{onDone:r=>{
      eng=null;setKeys(null);
      box.replaceChildren(h('div',{class:'result'},
        h('p',{class:'eyebrow'},'All matched'),
        h('div',{class:'score'},h('span',{class:'mark'},fmt(r.ms))),
        h('p',{class:'sub'},r.wrongTries===0?'No mistakes. Clean run.':r.wrongTries+(r.wrongTries===1?' mistake':' mistakes')+' along the way. Those cards are now in your Correct list.'),
        h('div',{class:'row'},btn('Play again',{cls:'primary',onclick:play}),btn('Back to deck',{cls:'ghost',onclick:()=>go('deck',{id:deck.id})}))));
    }});
    setKeys(eng.onKey);

/* =====================================================================
   Write engine (typed answers or Choize)
   ===================================================================== */
function writeEngine(box,cards,o){
  const total=cards.length;
  let queue=shuffle(cards),solved=0,fb=null,timer=null,cur=null,dead=false;
  const firstTry=new Map(),attempts=new Map();
  const fill=h('i'),bar=h('div',{class:'pbar',role:'progressbar'},fill),cnt=h('span',{class:'count'});
  const body=h('div',{class:'wq'});
  box.replaceChildren(h('div',{class:'wtop'},cnt,bar),body);
  function prog(){fill.style.width=(total?solved/total*100:0)+'%';cnt.textContent=solved+' / '+total;}
  function ask(){
    clearTimeout(timer);fb=null;cur=null;prog();
    if(!queue.length){finish();return;}
    const c=queue[0],wd=o.getDir()==='wd',prompt=wd?c.w:c.d,answer=wd?c.d:c.w;
    let mode=(o.forceChoice||(o.getChoize&&o.getChoize(c)))?'mc':'type',opts=null;
    if(mode==='mc'){opts=makeOptions(c,answer,wd,4);if(opts.length<2){mode='type';opts=null;}}
    const area=h('div',{class:'warea'});
    cur={c,wd,answer,mode,opts,area};
    body.replaceChildren(
      h('div',{class:'wprompt'},h('span',{class:'fc-label'},wd?'Word':'Definition'),h('div',{class:'wp-text '+lenClass(prompt)},prompt)),
      area);
    if(mode==='mc'){
      area.append(h('p',{class:'ask'},'Choose the '+(wd?'definition':'word')),
        h('div',{class:'choices'},opts.map((t,n)=>{
          const b=h('button',{type:'button',class:'choice',onclick:()=>check(t,b)},h('span',{class:'kc'},String(n+1)),h('span',{class:'ct'},t));
          return b;
        })));
    }else{
      const inp=h('input',{id:'ans',class:'in big',type:'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false','aria-label':'Your answer',placeholder:'Type the '+(wd?'definition':'word'),
        onkeydown:e=>{if(e.key==='Enter'){e.preventDefault();if(inp.value.trim())check(inp.value);}}});
      area.append(h('p',{class:'ask'},'Type the '+(wd?'definition':'word')),inp,
        h('div',{class:'row'},
          btn('Check',{cls:'primary',onclick:()=>{if(inp.value.trim())check(inp.value);}}),
          btn('Don’t know',{cls:'ghost',onclick:()=>check('')})));
      setTimeout(()=>{if(!dead&&!fb)inp.focus();},0);
    }
  }
  function check(val,btnEl){
    if(fb||!cur)return;
    const c=cur.c,answer=cur.answer;
    const ok=cur.mode==='mc'?(val!=null&&norm(val)===norm(answer)):isRight(val,answer);
    attempts.set(c.id,(attempts.get(c.id)||0)+1);
    fb={ok,card:c,done:false};
    if(!ok){firstTry.set(c.id,false);markWrong(c);}
    else if(!firstTry.has(c.id))firstTry.set(c.id,true);
    if(cur.mode==='mc'){
      cur.area.querySelectorAll('.choice').forEach(b=>{
        b.disabled=true;
        const t=b.querySelector('.ct').textContent;
        if(norm(t)===norm(answer))b.classList.add('right');
        else if(b===btnEl)b.classList.add('wrong');
      });
    }
    const given=val&&String(val).trim();
    const panel=h('div',{class:'fb '+(ok?'ok':'bad'),role:'status'},
      h('strong',null,ok?'Correct':(given?'Not quite':'Here is the answer')),
      !ok&&given&&cur.mode==='type'?h('p',null,'You wrote: ',h('span',{class:'ans-bad'},given)):null,
      !ok?h('p',null,'Answer: ',h('span',{class:'ans-good'},answer)):null,
      ok&&cur.mode==='type'?h('p',null,h('span',{class:'ans-good'},answer)):null);
    const cont=btn('Continue',{cls:'primary',onclick:()=>advance(ok)});
    const acts=h('div',{class:'row'},cont);
    if(!ok&&given&&cur.mode==='type'){
      acts.append(btn('I was right',{cls:'ghost',onclick:()=>{
        if((attempts.get(c.id)||0)<=1)firstTry.set(c.id,true);
        advance(true);
      }}));
    }
    panel.append(acts);
    if(cur.mode==='type')cur.area.replaceChildren(panel);else cur.area.append(panel);
    if(ok)timer=setTimeout(()=>advance(true),cur.mode==='mc'?850:1200);
    else setTimeout(()=>{if(!dead)cont.focus();},0);
  }
  function advance(ok){
    if(!fb||fb.done)return;
    fb.done=true;clearTimeout(timer);
    const c=fb.card;queue.shift();
    if(ok){if(!firstTry.has(c.id))firstTry.set(c.id,true);solved++;clearReview(c);}
    else if(o.once)solved++;
    else queue.push(c);
    ask();
  }
  function finish(){
    prog();
    const right=[],wrong=[];
    cards.forEach(c=>(firstTry.get(c.id)===false?wrong:right).push(c));
    if(!dead&&o.onDone)o.onDone({right,wrong,total});
  }
  function onKey(e){
    const tag=e.target.tagName,typing=tag==='INPUT'||tag==='TEXTAREA',isBtn=tag==='BUTTON';
    if(fb){if(e.key==='Enter'&&!isBtn&&!typing){e.preventDefault();advance(fb.ok);}return;}
    if(cur&&cur.mode==='mc'&&/^[1-9]$/.test(e.key)&&!typing){
      const n=+e.key-1;
      if(cur.opts[n]!=null){check(cur.opts[n],cur.area.querySelectorAll('.choice')[n]);}
    }
  }
  ask();
  return{onKey,refresh(){if(!fb)ask();},destroy(){dead=true;clearTimeout(timer);}};
}

          r.wrong.length?h('div',{style:'width:100%'},h('h3',{style:'margin-bottom:10px'},'Keep working on these'),missList(r.wrong)):h('p',null,'Clean sweep. Nothing to review.'),
          h('div',{class:'row'},
            r.wrong.length?btn('Practice the missed ones',{cls:'primary',onclick:()=>start(r.wrong)}):null,
            btn('Go again',{cls:r.wrong.length?'ghost':'primary',onclick:()=>start(cards)}),
            btn('Done',{cls:'ghost',onclick:back}))));
      }});
    setKeys(eng.onKey);
  }
  start(cards);
  const opts=h('div',{class:'opts'},
    seg([['wd','Word → Definition'],['dw','Definition → Word']],cfg.dir,v=>{cfg.dir=v;if(eng)eng.refresh();},'Direction'),
    choizeAvail?toggle('Choize',false,on=>{cfg.choize=on;if(eng)eng.refresh();}):null,
    toggle('AI',false,()=>{},{disabled:true,tag:'Later'}));
  return h('div',{class:'wrap view'},studyBar(title,'Back',back),opts,h('div',{style:'height:22px'}),box);
}

/* =====================================================================
   Learn
   ===================================================================== */
function learnView(p){
  const deck=deckById(p.id);if(!deck)return missing();
  const N=deck.cards.length;
  const sizes=sectionSizes(N);
  let pos=0;
  const secs=sizes.map(n=>{const s=deck.cards.slice(pos,pos+n);pos+=n;return s.map(c=>sc(deck,c));});
  const L={sec:0,stage:'learn',steps:0,missed:new Set(),everMissed:new Set(),dir:'wd',doneCards:0,inc:[],cor:[],again:[],t0:Date.now()};
  const trail=h('div',{class:'trail'});
  const fill=h('i'),pct=h('span',{class:'mono'},'0%');
  const secLbl=h('span',{class:'eyebrow'});
  const cap=h('p',{class:'lcap'});
  const box=h('div');
  let eng=null;
  function kill(){if(eng){eng.destroy();eng=null;}setKeys(null);}
  onLeave(kill);

  const chip=(label,cur,done)=>h('span',{class:'chip'+(cur?' cur':'')+(done&&!cur?' done':'')},(done&&!cur?'✓ ':'')+label);
  function head(){
    const s=L.sec+1;
    trail.replaceChildren(
      chip('S'+s,L.stage==='learn',L.steps>=1),h('span',{class:'sep'},'→'),
      chip('S'+s+' Match',L.stage==='match',L.steps>=2),h('span',{class:'sep'},'→'),
      chip('S'+s+' Redo',L.stage==='redo',L.steps>=5));
    const cur=secs[L.sec]?secs[L.sec].length:0;
    const f=Math.min(1,(L.doneCards+cur*(L.steps/5))/N);
    fill.style.width=(f*100)+'%';pct.textContent=Math.round(f*100)+'%';
    secLbl.textContent='Section '+s+' of '+secs.length;
  }
  function intro(title,sub,onGo,label){
    kill();cap.textContent='';
    const go1=btn(label||'Continue',{cls:'primary',onclick:onGo});
    box.replaceChildren(h('div',{class:'intro'},h('h2',null,title),h('p',null,sub),go1));
    setKeys(e=>{if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();onGo();}});
    setTimeout(()=>go1.focus(),0);
  }
  const getDir=()=>L.dir;

  function sLearn(){
    kill();L.stage='learn';L.steps=0;head();
    cap.textContent='Choose the correct answer';
    eng=writeEngine(box,secs[L.sec],{once:true,forceChoice:true,getDir,onDone:r=>{
      r.wrong.forEach(c=>{L.missed.add(c.id);L.everMissed.add(c.id);});
      L.steps=1;head();
      intro('S'+(L.sec+1)+' Match',(r.wrong.length?r.wrong.length+' missed so far. ':'No misses so far. ')+'Now match every word in this section with its definition.',sMatch,'Start matching');
    }});
    setKeys(eng.onKey);
  }
  function sMatch(){
    kill();L.stage='match';head();
    cap.textContent='Match each word with its definition';
    eng=matchEngine(box,secs[L.sec],{onDone:r=>{
      r.mistakes.forEach(id=>{L.missed.add(id);L.everMissed.add(id);});
      L.steps=2;head();
      L.inc=secs[L.sec].filter(c=>L.missed.has(c.id));
      L.cor=secs[L.sec].filter(c=>!L.missed.has(c.id));
      intro('S'+(L.sec+1)+' Redo',
        L.inc.length?'First match the '+L.inc.length+' you missed, then write the '+L.cor.length+' you knew, then write the missed ones again.':'You knew all of them. Write each one to lock it in.',
        pRM,'Start redo');
    }});
    setKeys(eng.onKey);
  }
  function pRM(){
    kill();L.stage='redo';head();
    if(L.inc.length<2)return pWC();
    cap.textContent='Redo · match the cards you missed';
    eng=matchEngine(box,L.inc,{onDone:()=>{L.steps=3;head();pWC();}});
    setKeys(eng.onKey);
  }
  function pWC(){
    kill();L.stage='redo';head();
    if(!L.cor.length){L.steps=4;head();L.again=L.inc.slice();return pWI();}
    cap.textContent='Redo · write the cards you knew';
    eng=writeEngine(box,L.cor,{getDir,getChoize:()=>false,onDone:r=>{
      r.wrong.forEach(c=>L.everMissed.add(c.id));
      L.again=L.inc.concat(r.wrong.filter(c=>L.inc.indexOf(c)===-1));
      L.steps=4;head();pWI();
    }});
    setKeys(eng.onKey);
  }
  function pWI(){
    kill();L.stage='redo';head();
    if(!L.again.length)return secDone();
    cap.textContent='Redo · write the cards you missed, again';
    eng=writeEngine(box,L.again,{getDir,getChoize:()=>false,onDone:()=>{L.steps=5;head();secDone();}});
    setKeys(eng.onKey);
  }
  function secDone(){
    L.doneCards+=secs[L.sec].length;L.steps=5;
    const done=L.sec+1;
    L.sec++;
    if(L.sec>=secs.length){L.sec=secs.length-1;return finish();}
    L.stage='learn';L.steps=0;L.missed=new Set();L.again=[];L.inc=[];L.cor=[];
    const left=N-L.doneCards;
    kill();
    fill.style.width=(L.doneCards/N*100)+'%';pct.textContent=Math.round(L.doneCards/N*100)+'%';
    secLbl.textContent='Section '+(L.sec+1)+' of '+secs.length;
    intro('Section '+done+' done',L.doneCards+' of '+N+' cards learned, '+left+' to go.',sLearn,'Start S'+(L.sec+1));
  }
  function finish(){
    kill();cap.textContent='';
    fill.style.width='100%';pct.textContent='100%';
    trail.replaceChildren();
    const missedN=L.everMissed.size;
    box.replaceChildren(h('div',{class:'result'},
      h('p',{class:'eyebrow'},'Deck complete'),
      h('div',{class:'score'},h('span',{class:'mark'},N+' / '+N+' learned')),
      h('p',{class:'sub'},missedN?missedN+(missedN===1?' card needed':' cards needed')+' a second pass. Total time '+fmt(Date.now()-L.t0)+'.':'No misses at all. Total time '+fmt(Date.now()-L.t0)+'.'),
      h('div',{class:'row'},
        btn('Learn again',{cls:'primary',onclick:()=>go('learn',{id:deck.id})}),
        btn('Back to deck',{cls:'ghost',onclick:()=>go('deck',{id:deck.id})}))));
  }

  const root=h('div',{class:'wrap view'},
    studyBar('Learn · '+deck.title,'Back',()=>go('deck',{id:deck.id})),
    h('div',{class:'lhead'},
      h('div',{class:'row',style:'justify-content:space-between'},secLbl,
        seg([['wd','Word → Definition'],['dw','Definition → Word']],L.dir,v=>{L.dir=v;if(eng&&eng.refresh)eng.refresh();},'Direction')),
      trail,
      h('div',{class:'lprog'},h('div',{class:'pbar',role:'progressbar','aria-label':'Deck learned'},fill),pct)),
    cap,box);
  sLearn();
  return root;
}

/* =====================================================================
   Test
   ===================================================================== */
function testView(p){
  const deck=deckById(p.id);if(!deck)return missing();
  const N=deck.cards.length;
  const back=()=>go('deck',{id:deck.id});
  const root=h('div',{class:'wrap view'});
  const cfg={count:Math.min(20,N),types:{tf:N>=2,mc:N>=2,wr:true},dir:'mix'};
  const TYPE_LABEL={tf:'True / false',mc:'Multiple choice',wr:'Written'};

  function showConfig(){
    const err=h('p',{class:'err',role:'alert'});
    const count=h('input',{id:'t-count',class:'in',type:'number',min:'1',max:String(N),value:String(cfg.count),
      oninput:e=>{const v=parseInt(e.target.value,10);if(v>=1)cfg.count=Math.min(N,v);}});
    root.replaceChildren(studyBar('Test · '+deck.title,'Back',back),
      h('div',{class:'cfg'},
        h('h1',null,'Set up your test'),
        h('div',{class:'field'},h('label',{for:'t-count'},'Questions (up to '+N+')'),count),
        h('div',{class:'field'},h('span',{class:'lbl'},'Question types'),
          h('div',{class:'setting',style:'display:grid;gap:4px'},
            ['tf','mc','wr'].map(k=>toggle(TYPE_LABEL[k]+(N<2&&k!=='wr'?' (needs 2+ cards)':''),cfg.types[k],on=>{cfg.types[k]=on;},{disabled:N<2&&k!=='wr'})),
            toggle('AI deeper questions',false,()=>{},{disabled:true,tag:'Later'}))),
        h('div',{class:'field'},h('span',{class:'lbl'},'Direction'),
          seg([['mix','Mixed'],['wd','Word → Definition'],['dw','Definition → Word']],cfg.dir,v=>{cfg.dir=v;},'Direction')),
        err,
        h('div',{class:'form-actions'},
          btn('Start test',{cls:'primary',icon:'test',onclick:()=>{
            const types=['tf','mc','wr'].filter(k=>cfg.types[k]);
            if(!types.length){err.textContent='Pick at least one question type.';return;}
            cfg.count=Math.max(1,Math.min(N,parseInt(count.value,10)||cfg.count));
            showTest(buildTest(types));
          }}),
          btn('Cancel',{cls:'ghost',onclick:back}))));
    window.scrollTo(0,0);
  }
  function buildTest(types){
    const pool=shuffle(deck.cards).slice(0,cfg.count);
    const qs=pool.map((c,i)=>{
      let t=types[i%types.length];
      const wd=cfg.dir==='mix'?Math.random()<.5:cfg.dir==='wd';
      const card=sc(deck,c),prompt=wd?c.w:c.d,answer=wd?c.d:c.w;
      const q={card,type:t,wd,prompt,answer,given:null};
      if(t==='mc'){q.options=makeOptions(card,answer,wd,4);if(q.options.length<2)t=q.type='wr';}
      if(t==='tf'){
        const wrongOnes=distractors(card,answer,wd,1);
        if(!wrongOnes.length)t=q.type='wr';
        else{q.isTrue=Math.random()<.5;q.shown=q.isTrue?answer:wrongOnes[0];}
      }
      return q;
    });
    const order={tf:0,mc:1,wr:2};
    return qs.sort((a,b)=>order[a.type]-order[b.type]);
  }
  function showTest(qs){
    const form=h('div');
    let lastType=null,warned=false;
    qs.forEach((q,i)=>{
      if(q.type!==lastType){form.append(h('p',{class:'qh'},TYPE_LABEL[q.type]));lastType=q.type;}
      const dirLabel=q.wd?'Word':'Definition';
      const card=h('article',{class:'q'},
        h('div',{class:'q-top'},h('span',null,String(i+1)+' / '+qs.length)));
      if(q.type==='mc'){
        const bs=q.options.map((t,n)=>{
          const b=h('button',{type:'button',class:'choice',onclick:()=>{
            q.given=t;bs.forEach(x=>x.classList.remove('picked'));b.classList.add('picked');
          }},h('span',{class:'kc'},String(n+1)),h('span',{class:'ct'},t));
          return b;
        });
        card.append(h('p',{class:'qp '+(q.prompt.length>60?'long':'')},q.prompt),h('p',{class:'ask'},'Choose the '+(q.wd?'definition':'word')),h('div',{class:'choices'},bs));
      }else if(q.type==='tf'){
        const yes=h('button',{type:'button',class:'choice',onclick:()=>{q.given=true;yes.classList.add('picked');no.classList.remove('picked');}},'True');
        const no=h('button',{type:'button',class:'choice',onclick:()=>{q.given=false;no.classList.add('picked');yes.classList.remove('picked');}},'False');
        card.append(h('p',{class:'ask'},'Do these belong together?'),
          h('div',{class:'tf-line'},h('strong',null,q.prompt),h('span',{class:'arrow'},'→'),q.shown),
          h('div',{class:'choices'},yes,no));
      }else{
        const inp=h('input',{class:'in',type:'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false','aria-label':'Answer for question '+(i+1),placeholder:'Type the '+(q.wd?'definition':'word'),oninput:e=>{q.given=e.target.value;}});
        card.append(h('p',{class:'qp '+(q.prompt.length>60?'long':'')},q.prompt),h('p',{class:'ask'},dirLabel+' given. Type the '+(q.wd?'definition':'word')),inp);
      }
      form.append(card);
    });
    const warn=h('p',{class:'err',role:'alert'});
    const submit=btn('Check test',{cls:'primary',icon:'check',onclick:()=>{
      const un=qs.filter(q=>q.type==='wr'?!(q.given||'').trim():q.given==null).length;
      if(un&&!warned){warned=true;warn.textContent=un+(un===1?' question is':' questions are')+' unanswered. Press again to check anyway.';return;}
      showResults(qs);
    }});
    root.replaceChildren(studyBar('Test · '+deck.title,'Quit',back),
      h('div',{style:'max-width:760px;margin:0 auto'},form,h('div',{class:'submit-bar'},submit,warn)));
    window.scrollTo(0,0);
  }
  function grade(q){
    if(q.type==='mc')return q.given!=null&&norm(q.given)===norm(q.answer);
    if(q.type==='tf')return q.given===q.isTrue;
    return isRight(q.given||'',q.answer);
  }
  function showResults(qs){
    qs.forEach(q=>{q.ok=grade(q);if(q.ok)clearReview(q.card);else markWrong(q.card);});
    const right=qs.filter(q=>q.ok).length;
    const pctv=Math.round(right/qs.length*100);
    const list=qs.map((q,i)=>{
      let yours,correct;
      if(q.type==='tf'){
        yours=q.given==null?'No answer':(q.given?'True':'False');
        correct=q.isTrue?'True':'False';
      }else{
        yours=(q.given&&String(q.given).trim())||'No answer';
        correct=q.answer;
      }
      return h('article',{class:'q '+(q.ok?'ok':'bad')},
        h('div',{class:'q-top'},h('span',null,(i+1)+' · '+TYPE_LABEL[q.type])),
        q.type==='tf'?h('div',{class:'tf-line'},h('strong',null,q.prompt),h('span',{class:'arrow'},'→'),q.shown):h('p',{class:'qp '+(q.prompt.length>60?'long':'')},q.prompt),
        h('div',{class:'q-res '+(q.ok?'ok':'bad')},icon(q.ok?'check':'cross'),
          h('div',null,q.ok?h('span',null,'Your answer: ',h('strong',null,yours)):h('span',null,'Your answer: ',h('span',{class:'ans-bad'},yours),h('br'),'Correct: ',h('span',{class:'ans-good'},correct)))));
    });
    root.replaceChildren(studyBar('Test · '+deck.title,'Back',back),
      h('div',{style:'max-width:760px;margin:0 auto'},
        h('div',{class:'result',style:'margin:0 0 26px'},
          h('p',{class:'eyebrow'},'Test complete'),
          h('div',{class:'score'},h('span',{class:'mark'},right+' / '+qs.length)),
          h('p',{class:'sub'},pctv+'%'+(right<qs.length?' · missed cards are in your Correct list.':' · perfect score.')),
          h('div',{class:'row'},btn('Retake test',{cls:'primary',onclick:showConfig}),btn('Back to deck',{cls:'ghost',onclick:back}))),
        list));
    window.scrollTo(0,0);
  }
  showConfig();
  return root;
}

/* =====================================================================
   Views + boot
   ===================================================================== */
const VIEWS={home:homeView,deck:deckView,edit:editView,flash:flashView,match:matchView,write:writeView,learn:learnView,test:testView};

(function boot(){
  const loc=lsLoad();
  if(loc&&Array.isArray(loc.decks)){S={decks:loc.decks,review:Array.isArray(loc.review)?loc.review:[],seeded:true};localLoaded=true;}
  else S={decks:[exampleDeck()],review:[],seeded:true};
  pruneReview(true);
  render();
  connectDb();
})();

})();
