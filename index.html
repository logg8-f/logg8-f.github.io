/* =====================================================================
   Write engine (typed answers, Choize blanks, hints, near-miss spelling)
   ===================================================================== */
function writeEngine(box,cards,o){
  const total=cards.length;
  let queue=shuffle(cards),solved=0,fb=null,timer=null,cur=null,dead=false,tap=null;
  if(o.resume&&Array.isArray(o.resume.q)){
    const map=new Map(cards.map(c=>[c.id,c]));
    const q=o.resume.q.map(id=>map.get(id)).filter(Boolean);
    if(q.length){queue=q;solved=Math.max(0,total-new Set(q.map(c=>c.id)).size);}
  }
  let tapDown=null,busy=false;
  // Correct answers already shown as options this run, so a later question does
  // not offer one of them as a distractor (see distractors()).
  const usedAns=new Set();
  const tapSkip=e=>!!(e.target.closest&&e.target.closest('.keep,.speak,.sbar,.opts,.tg,header'));
  function unTap(){if(tap){document.removeEventListener('click',tap);tap=null;}if(tapDown){document.removeEventListener('mousedown',tapDown);tapDown=null;}}
  const firstTry=new Map(),attempts=new Map();
  const fill=h('i'),bar=h('div',{class:'pbar',role:'progressbar'},fill),cnt=h('span',{class:'count'});
  const body=h('div',{class:'wq'});
  box.replaceChildren(...(o.hideProg?[body]:[h('div',{class:'wtop'},cnt,bar),body]));
  function prog(){fill.style.width=(total?solved/total*100:0)+'%';cnt.textContent=solved+' / '+total;}
  function ask(){
    clearTimeout(timer);unTap();fb=null;cur=null;prog();
    if(!queue.length){finish();return;}
    const c=queue[0],wd=o.getDir()==='wd';
    const deck=c.deck,pSide=wd?'w':'d',aSide=wd?'d':'w';
    const pText=wd?c.w:c.d,pImg=wd?c.wi:c.di;
    const cz=!o.forceChoice&&wd&&o.getChoize&&o.getChoize(c)&&hasBlanks(c.d);
    let mode,answer,opts=null,cl=null,bi=0,promptEl,segs;
    if(cz){
      mode='cloze';cl=parseCloze(c.d);bi=Math.floor(Math.random()*cl.n);answer=blankAnswer(cl,bi);
      promptEl=h('div',{class:'wp-text cz'},h('strong',null,rich(c.w)),' = ',clozeNode(cl.parts,bi,answer.length));
      segs=clozeSegs(c,cl,bi);
    }else{
      answer=plain(wd?c.d:c.w);
      mode=o.forceChoice?'mc':'type';
      if(mode==='mc'){opts=makeOptions(c,answer,wd,4,usedAns);if(opts.length<2){mode='type';opts=null;}}
      usedAns.add(norm(answer));
      promptEl=h('div',{class:'wp-text '+lenClass(plain(pText))},rich(pText));
      segs=[{t:pText,lang:langOf(deck,pSide)}];
    }
    const area=h('div',{class:'warea'});
    cur={c,wd,answer,mode,opts,area,hints:0,aSide,cl,bi,inp:null,actions:null};
    body.replaceChildren(
      h('div',{class:'wprompt'},h('span',{class:'fc-label'},mode==='cloze'?'Word = definition':(wd?'Word':'Definition')),speakBtn(()=>segs,'corner'),cimg(pImg,'wp-img'),promptEl),
      area);
    if(o.getAuto&&o.getAuto())speakSeq(segs);
    if(mode==='mc'){
      area.append(h('p',{class:'ask'},'Choose the '+(wd?'definition':'word')),
        h('div',{class:'choices'},opts.map((t,n)=>{
          const b=h('button',{type:'button',class:'choice',onclick:()=>{if(!fb)check(t,b);}},h('span',{class:'kc'},String(n+1)),h('span',{class:'ct'},t));
          return b;
        })));
    }else{
      const inp=h('input',{id:'ans',class:'in big',type:'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false','aria-label':'Your answer',
        placeholder:mode==='cloze'?'Fill in the blank':'Type the '+(wd?'definition':'word'),
        onbeforeinput:e=>{if(fb)e.preventDefault();},
        onkeydown:e=>{
          if(fb){
            if((e.key==='Enter'||e.key===' '||/^[1-4]$/.test(e.key))&&!e.repeat){e.preventDefault();advance(fb.ok);}
            else if(e.key.length===1||e.key==='Backspace'||e.key==='Delete')e.preventDefault();
            return;
          }
          if(e.key==='Enter'){e.preventDefault();check(inp.value);}
        }});
      const mask=h('div',{class:'hint-mask','aria-live':'polite'});
      const aiLine=h('p',{class:'hint ai-hint','aria-live':'polite'});
      const hintBtn=btn('Hint',{cls:'ghost',icon:'bulb',onclick:()=>{
        cur.hints++;
        mask.textContent=maskHint(answer,cur.hints);
        hintBtn.lastChild.textContent='Hint ('+cur.hints+')';
        if(cur.hints>=letterCount(answer))hintBtn.disabled=true;
        inp.focus();
      }});
      const aiBtn=AI&&c.deck.aiHint!==false?btn('AI hint',{cls:'ghost',icon:'bulb',onclick:async()=>{
        if(fb||aiBtn.disabled)return;
        const mine=cur;
        aiBtn.disabled=true;
        aiLine.textContent='Thinking of a hint…';
        const h=await aiHint(plain(mine.wd?mine.c.w:mine.c.d),answer);
        if(dead||fb||cur!==mine)return;
        if(h){
          aiLine.textContent='Hint: '+h;
          mine.hints++;
          hintBtn.lastChild.textContent='Hint ('+mine.hints+')';
          if(mine.hints>=letterCount(answer))hintBtn.disabled=true;
        }else{
          aiLine.textContent='No AI hint right now — use the letter hint instead.';
          aiBtn.disabled=false;
        }
        try{inp.focus();}catch(e){}
      }}):null;
      const actions=h('div',{class:'row'},
        btn('Check',{cls:'primary',onclick:()=>check(inp.value)}),
        hintBtn,
        aiBtn,
        btn('Don’t know',{cls:'ghost',onclick:()=>check('')}));
      actions.querySelectorAll('button').forEach(b=>{b.addEventListener('mousedown',e=>e.preventDefault());});
      cur.inp=inp;cur.actions=actions;
      area.append(h('p',{class:'ask'},mode==='cloze'?'Fill in the blank':'Type the '+(wd?'definition':'word')),mask,aiLine,inp,actions);
      try{inp.focus();}catch(e){}
      setTimeout(()=>{if(!dead&&!fb&&document.activeElement!==inp)inp.focus();},0);
    }
  }
  function nearPanel(val,res){
    const inp=cur.inp;
    if(cur.nearEl)cur.nearEl.remove();
    inp.classList.remove('bad','ok');inp.classList.add('near');
    cur.actions.hidden=true;
    const panel=h('div',{class:'fb near',role:'status'},
      h('strong',null,'Very close'),
      h('p',null,'Off by '+(res.dist===1?'one letter':'a couple of letters')+'. Want to try again?'),
      h('div',{class:'row'},
        btn('Try again',{cls:'primary',onclick:()=>{
          panel.remove();cur.nearEl=null;inp.classList.remove('near');cur.actions.hidden=false;inp.focus();inp.select();
        }}),
        btn('Show answer',{cls:'ghost',onclick:()=>{panel.remove();cur.nearEl=null;finalize(false,val,true);}})));
    panel.querySelectorAll('button').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));
    cur.nearEl=panel;
    cur.area.append(panel);
  }
  async function check(val,btnEl){
    if(fb||!cur||busy)return;
    const answer=cur.answer;
    if(cur.mode==='mc'){finalize(val!=null&&norm(val)===norm(answer),val,false,btnEl);return;}
    const res=judge(val,answer);
    const useAI=AI&&cur.c.deck.aiGrade!==false;
    if(res.r==='near'&&!useAI){nearPanel(val,res);return;}
    if(res.r==='exact'){finalize(true,val,false);return;}
    const raw=val!=null?String(val).trim():'';
    if(raw&&useAI){
      const mine=cur;
      busy=true;mine.actions.hidden=true;
      const note=h('p',{class:'ask ai-note'},'Checking your wording…');
      mine.area.append(note);
      const ok=await aiGrade(plain(mine.wd?mine.c.w:mine.c.d),answer,raw,mine.mode==='cloze');
      busy=false;
      if(dead||fb||cur!==mine)return;
      note.remove();
      if(ok===true){finalize(true,val,false,undefined,true);return;}
    }
    finalize(false,val,false);
  }
  function finalize(ok,val,revealed,btnEl,aiAccepted){
    if(fb||!cur)return;
    const c=cur.c,answer=cur.answer;
    const hinted=ok&&cur.hints>0;
    attempts.set(c.id,(attempts.get(c.id)||0)+1);
    fb={ok,hinted,card:c,done:false};
    if(!ok){firstTry.set(c.id,false);if(!o.noReview)markWrong(c);}
    else if(hinted)firstTry.set(c.id,false);
    else if(!firstTry.has(c.id))firstTry.set(c.id,true);
    if(o.onAnswer){try{o.onAnswer(c,ok);}catch(e){}}
    if(cur.mode==='mc'){
      cur.area.querySelectorAll('.choice').forEach(b=>{
        b.classList.add('locked');b.setAttribute('aria-disabled','true');b.tabIndex=-1;
        const t=b.querySelector('.ct').textContent;
        if(norm(t)===norm(answer))b.classList.add('right');
        else if(b===btnEl)b.classList.add('wrong');
      });
    }else{
      cur.inp.classList.remove('near');cur.inp.classList.add(ok?'ok':'bad');cur.actions.hidden=true;
    }
    const given=val&&String(val).trim();
    const head=ok?(hinted?'Correct, with '+cur.hints+(cur.hints===1?' hint':' hints'):(aiAccepted?'Correct — accepted':'Correct')):(revealed||!given?'Here is the answer':'Not quite');
    const panel=h('div',{class:'fb '+(ok?'ok':'bad'),role:'status'},
      h('strong',null,head),
      ok&&aiAccepted?h('p',null,'The AI accepted your wording as equivalent to the answer.'):null,
      !ok&&given&&cur.mode!=='mc'?h('p',null,'You wrote: ',h('span',{class:'ans-bad'},given)):null,
      !ok?h('p',null,'Answer: ',h('span',{class:'ans-good'},answer)):null,
      ok&&cur.mode!=='mc'?h('p',null,h('span',{class:'ans-good'},answer)):null,
      (c.deck.example&&c.e&&String(c.e).trim())?exLine(c.e):null);
    const cont=btn('Continue',{cls:'primary',onclick:()=>advance(ok)});
    const acts=h('div',{class:'row'},cont);
    if(TTS){
      acts.append(btn('Listen',{cls:'ghost keep',icon:'sound',onclick:()=>speakSeq(cur.mode==='cloze'
        ?[{t:c.w,lang:langOf(c.deck,'w')},{t:c.d,lang:langOf(c.deck,'d')}]
        :[{t:answer,lang:langOf(c.deck,cur.aSide)}])}));
    }
    if(!ok&&given&&cur.mode!=='mc'){
      acts.append(btn('I was right',{cls:'ghost keep',onclick:()=>{
        if((attempts.get(c.id)||0)<=1)firstTry.set(c.id,true);
        advance(true);
      }}));
    }
    panel.append(acts,h('p',{class:'hint tapnote'},'Tap anywhere, or press Space or 1–4 to continue.'));
    cur.area.append(panel);
    const mine=fb;
    setTimeout(()=>{
      if(dead||fb!==mine||mine.done)return;
      tap=e=>{
        if(!fb||fb.done)return;
        if(tapSkip(e))return;
        advance(fb.ok);
      };
      tapDown=e=>{if(!tapSkip(e)&&cur&&cur.inp)e.preventDefault();};
      document.addEventListener('click',tap);
      document.addEventListener('mousedown',tapDown);
    },40);
    cont.addEventListener('mousedown',e=>e.preventDefault());
  }
  function advance(ok){
    if(!fb||fb.done)return;
    fb.done=true;clearTimeout(timer);unTap();
    const c=fb.card,hinted=fb.hinted;queue.shift();
    if(ok){
      if(!firstTry.has(c.id))firstTry.set(c.id,true);

    }
    else if(o.once)solved++;

    if(o.onProgress)o.onProgress({q:queue.map(x=>x.id),done:Math.max(0,total-new Set(queue.map(x=>x.id)).size),total});

  }
  function finish(){

  }
  function onKey(e){
    const tag=e.target.tagName,typing=tag==='INPUT'||tag==='TEXTAREA',isBtn=tag==='BUTTON';
    if(fb){

      }

    }
    if(cur&&cur.mode==='mc'&&/^[1-9]$/.test(e.key)&&!typing){
      const n=+e.key-1;
      if(cur.opts[n]!=null){check(cur.opts[n],cur.area.querySelectorAll('.choice')[n]);}
    }
  }
  ask();
  return{onKey,refresh(){if(!fb)ask();},destroy(){dead=true;clearTimeout(timer);unTap();}};
}

/* =====================================================================
   Learn (progress is shown as a percentage; the steps stay behind the scenes)
   ===================================================================== */
function learnView(p){
  const deck=deckById(p.id);if(!deck)return missing();
  const N=deck.cards.length;
  const sizes=sectionSizes(N);
  let pos=0;
  const secs=sizes.map(n=>{const s=deck.cards.slice(pos,pos+n);pos+=n;return s.map(c=>sc(deck,c));});
  const L={sec:0,steps:0,missed:new Set(),everMissed:new Set(),dir:'wd',doneCards:0,q:null,t0:Date.now()};
  // Resume where we left off — whether we arrived from the home "Continue" card
  // or simply pressed Learn on the deck. A session that is finished (or cleared)
  // has no saved state, so this starts from the beginning.
  const lr=resumeFor('learn',deck.id),rd=lr&&lr.data?lr.data:null;
  if(rd){
    if(typeof rd.sec==='number'&&rd.sec>=0&&rd.sec<secs.length){L.sec=rd.sec;L.doneCards=sizes.slice(0,L.sec).reduce((a,b)=>a+b,0);}
    if(typeof rd.step==='number')L.steps=rd.step;
    if(rd.dir==='wd'||rd.dir==='dw')L.dir=rd.dir;
    if(Array.isArray(rd.missed))L.missed=new Set(rd.missed);
    if(Array.isArray(rd.everMissed))L.everMissed=new Set(rd.everMissed);
    if(rd.doneCards!=null)L.doneCards=rd.doneCards;
    if(Array.isArray(rd.q))L.q=rd.q;
  }
  const resuming=!!rd;
  const fill=h('i'),pct=h('span',{class:'mono'},'0%');
  const cap=h('p',{class:'lcap'});
  const box=h('div');
  let eng=null;
  function kill(){if(eng){eng.destroy();eng=null;}setKeys(null);}
  onLeave(kill);
  function head(){
    const cur=secs[L.sec]?secs[L.sec].length:0;
    const qf=(cur&&Array.isArray(L.q))?Math.max(0,Math.min(1,1-L.q.length/cur)):0;
    const f=Math.min(1,(L.doneCards+cur*((L.steps+qf)/3))/N);
    fill.style.width=(f*100)+'%';pct.textContent=Math.round(f*100)+'%';
  }
  const getDir=()=>L.dir;
  const wOpts=r=>Object.assign({getDir,getChoize:c=>c.deck.choize},r);
  /* Save enough to continue exactly where we are, including the current step and
     the cards still queued, so leaving mid-section does not lose progress. */
  function saveLearn(){
    if(L.sec>=secs.length)return;
    setResume('learn',deck.id,Math.round(L.doneCards/N*100)+'% learned',{
      sec:L.sec,step:L.steps,dir:L.dir,q:L.q||null,
      missed:[...L.missed],everMissed:[...L.everMissed],doneCards:L.doneCards
    });
  }
  function sLearn(){
    kill();L.steps=0;head();
    cap.textContent='Choose the correct answer';
    eng=writeEngine(box,secs[L.sec],{once:true,forceChoice:true,noReview:true,hideProg:true,getDir,resume:L.q?{q:L.q}:null,
      onProgress:s=>{L.q=s.q;head();saveLearn();},
      onAnswer:(c,ok)=>{if(!ok){L.missed.add(c.id);L.everMissed.add(c.id);}saveLearn();},
      onDone:r=>{
        L.q=null;
        r.wrong.forEach(c=>{L.missed.add(c.id);L.everMissed.add(c.id);});
        L.steps=1;head();saveLearn();
        L.inc=secs[L.sec].filter(c=>L.missed.has(c.id));
        pMC2();
      }});
    setKeys(eng.onKey);
  }
  function pMC2(){
    kill();head();
    if(!L.inc.length){L.q=null;L.steps=2;head();saveLearn();return pW();}
    cap.textContent='Choose again until you get the missed ones right';
    eng=writeEngine(box,L.inc,{forceChoice:true,noReview:true,hideProg:true,getDir,resume:L.q?{q:L.q}:null,
      onProgress:s=>{L.q=s.q;head();saveLearn();},
      onDone:()=>{L.q=null;L.steps=2;head();saveLearn();pW();}});
    setKeys(eng.onKey);
  }
  function pW(){
    kill();head();
    cap.textContent='Now write the answers';
    eng=writeEngine(box,secs[L.sec],wOpts({noReview:true,hideProg:true,resume:L.q?{q:L.q}:null,
      onProgress:s=>{L.q=s.q;head();saveLearn();},
      onAnswer:(c,ok)=>{if(!ok)L.everMissed.add(c.id);saveLearn();},
      onDone:r=>{
        L.q=null;
        r.wrong.forEach(c=>L.everMissed.add(c.id));
        L.steps=3;head();secDone();
      }}));
    setKeys(eng.onKey);
  }
  function secDone(){
    L.doneCards+=secs[L.sec].length;L.steps=3;
    L.sec++;
    if(L.sec>=secs.length){L.sec=secs.length-1;return finish();}
    L.steps=0;L.missed=new Set();L.inc=[];L.q=null;
    saveLearn();
    sLearn();
  }
  function finish(){
    kill();cap.textContent='';
    fill.style.width='100%';pct.textContent='100%';
    clearResume('learn',deck.id);
    const missedN=L.everMissed.size;
    box.replaceChildren(h('div',{class:'result'},
      h('p',{class:'eyebrow'},'Deck complete'),
      h('div',{class:'score'},h('span',{class:'mark'},'100% learned')),
      h('p',{class:'sub'},missedN?missedN+(missedN===1?' card needed':' cards needed')+' a second pass. Total time '+fmt(Date.now()-L.t0)+'.':'No misses at all. Total time '+fmt(Date.now()-L.t0)+'.'),
      h('div',{class:'row'},
        btn('Learn again',{cls:'primary',onclick:()=>{clearResume('learn',deck.id);go('learn',{id:deck.id});}}),
        btn('Back to deck',{cls:'ghost',onclick:()=>histBack('deck',{id:deck.id})}))));
  }

  const root=h('div',{class:'wrap view'},
    studyBar('Learn · '+deck.title,'Back',()=>histBack('deck',{id:deck.id})),
    h('div',{class:'lhead'},
      h('div',{class:'row',style:'justify-content:space-between'},
        h('div',{class:'row',style:'gap:12px;align-items:baseline'},
          h('span',{class:'eyebrow'},'Progress'),
          resuming?btn('Start over',{cls:'link',onclick:()=>{clearResume('learn',deck.id);go('learn',{id:deck.id});}}):null),
        seg([['wd','Word → Definition'],['dw','Definition → Word']],L.dir,v=>{L.dir=v;saveLearn();if(eng&&eng.refresh)eng.refresh();},'Direction')),
      h('div',{class:'lprog'},h('div',{class:'pbar',role:'progressbar','aria-label':'Deck learned'},fill),pct)),
    cap,box);
  head();
  if(L.steps===1){L.inc=secs[L.sec].filter(c=>L.missed.has(c.id));pMC2();}
  else if(L.steps===2){pW();}
  else{L.steps=0;sLearn();}
  return root;
}

function testView(p){
  const deck=deckById(p.id);if(!deck)return missing();
  const N=deck.cards.length;
  const back=()=>histBack('deck',{id:deck.id});
  const root=h('div',{class:'wrap view'});
  let alive=true;
  onLeave(()=>{alive=false;});
  const czAvail=deck.choize&&deck.cards.some(c=>hasBlanks(c.d));
  const cfg={count:N,types:{tf:N>=2,mc:N>=2,wr:true,cz:czAvail},dir:'mix'};
  const TYPE_LABEL={tf:'True / false',mc:'Multiple choice',wr:'Written',cz:'Fill in the blank'};
  const isDesk=!!(window.matchMedia&&window.matchMedia('(hover:hover) and (pointer:fine)').matches);

  function showConfig(){
    setKeys(null);
    const err=h('p',{class:'err',role:'alert'});
    const tests=(deck.stats&&deck.stats.tests)||[];
    root.replaceChildren(studyBar('Test · '+deck.title,'Back',back),
      h('div',{class:'cfg'},
        h('h1',null,'Set up your test'),
        tests.length?h('p',{class:'sub'},'Last result '+tests[tests.length-1].right+' / '+tests[tests.length-1].total+' · best '+Math.max.apply(null,tests.map(t=>Math.round(t.right/t.total*100)))+'%'):null,
        h('p',{class:'sub'},N+' questions, one for every card in the deck.'),
        h('div',{class:'field'},h('span',{class:'lbl'},'Question types'),
          h('div',{class:'setting',style:'display:grid;gap:4px'},
            ['tf','mc','wr'].map(k=>{
              const off=N<2&&(k==='tf'||k==='mc');
              return toggle(TYPE_LABEL[k]+(off?' (needs 2+ cards)':''),cfg.types[k],on=>{cfg.types[k]=on;},{disabled:off});
            }),
            czAvail?toggle(TYPE_LABEL.cz,cfg.types.cz,on=>{cfg.types.cz=on;}):null)),
        h('div',{class:'field'},h('span',{class:'lbl'},'Direction'),
          seg([['mix','Mixed'],['wd','Word → Definition'],['dw','Definition → Word']],cfg.dir,v=>{cfg.dir=v;},'Direction')),
        err,
        h('div',{class:'form-actions'},
          btn('Start test',{cls:'primary',icon:'test',onclick:()=>{
            const types=['tf','mc','wr','cz'].filter(k=>cfg.types[k]);
            if(!types.length){err.textContent='Pick at least one question type.';return;}
            showTest(buildTest(types));
          }}),
          btn('Cancel',{cls:'ghost',onclick:back}))));
    window.scrollTo(0,0);
  }
  /* cards are dealt in shuffled rounds, so a repeated word is always a full round away */
  function dealCards(total){
    const seq=[];let prevRound=null;
    const m=Math.min(3,Math.floor(N/2));
    while(seq.length<total){
      let round=shuffle(deck.cards);
      if(prevRound&&m>0){
        const avoid=new Set(prevRound.slice(-m).map(c=>c.id));
        const front=round.filter(c=>!avoid.has(c.id)),back=round.filter(c=>avoid.has(c.id));
        round=front.slice(0,m).concat(back,front.slice(m));
      }
      seq.push(...round);prevRound=round;
    }
    return seq.slice(0,total);
  }
  function buildTest(types){
    const nonCz=types.filter(t=>t!=='cz'),czOn=types.indexOf('cz')!==-1;
    let k=0;
    const used=new Set();
    const qs=dealCards(cfg.count).map((c,idx)=>{
      const card=sc(deck,c);
      if(czOn&&hasBlanks(c.d)&&(!nonCz.length||Math.random()<0.6)){
        const cl=parseCloze(c.d),bi=Math.floor(Math.random()*cl.n);
        const answer=blankAnswer(cl,bi);used.add(norm(answer));
        return{card,type:'cz',wd:true,prompt:c.w,cl,bi,answer,given:null,order:idx};
      }
      let t=nonCz.length?nonCz[(k++)%nonCz.length]:'wr';
      const wd=cfg.dir==='mix'?Math.random()<.5:cfg.dir==='wd';
      const prompt=wd?c.w:c.d,answer=plain(wd?c.d:c.w);
      const q={card,type:t,wd,prompt,answer,given:null,order:idx};
      if(t==='mc'){q.options=makeOptions(card,answer,wd,4,used);if(q.options.length<2)t=q.type='wr';}
      if(t==='tf'){
        const wrongOnes=distractors(card,answer,wd,1,used);
        if(!wrongOnes.length)t=q.type='wr';
        else{q.isTrue=Math.random()<.5;q.shown=q.isTrue?answer:wrongOnes[0];}
      }
      used.add(norm(answer));
      return q;
    });
    const order={tf:0,mc:1,wr:2,cz:3};
    return qs.sort((a,b)=>(order[a.type]-order[b.type])||(a.order-b.order));
  }
  const promptNode=q=>q.type==='cz'
    ?h('p',{class:'qp'},h('strong',null,rich(q.prompt)),' = ',clozeNode(q.cl.parts,q.bi,q.answer.length))
    :h('p',{class:'qp '+(plain(q.prompt).length>60?'long':'')},rich(q.prompt));
  function showTest(qs){
    const form=h('div');
    const arts=[];
    let lastType=null,warned=false,sel=0;
    function select(i,o){
      o=o||{};
      i=Math.max(0,Math.min(qs.length-1,i));
      if(arts[sel])arts[sel].classList.remove('sel');
      sel=i;arts[i].classList.add('sel');
      if(o.scroll!==false){try{arts[i].scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}}
      const q=qs[i];
      if(q.input){if(isDesk||o.focus)q.input.focus({preventScroll:true});}
      else{const a=document.activeElement;if(a&&a.tagName==='INPUT')a.blur();}
    }
    function choose(i,n){
      if(sel!==i)select(i,{scroll:false});
      const q=qs[i];
      q.given=q.type==='mc'?q.options[n]:(n===0);
      q.buttons.forEach((b,k)=>b.classList.toggle('picked',k===n));
      if(isDesk)select(i+1);
    }
    qs.forEach((q,i)=>{
      if(q.type!==lastType){form.append(h('p',{class:'qh'},TYPE_LABEL[q.type]));lastType=q.type;}
      const pimg=q.type==='cz'?q.card.wi:(q.wd?q.card.wi:q.card.di);
      const art=h('article',{class:'q',onclick:()=>{if(sel!==i)select(i,{scroll:false,focus:true});}},
        h('div',{class:'q-top'},h('span',null,String(i+1)+' / '+qs.length)));
      if(q.type==='mc'){
        q.buttons=q.options.map((t,n)=>h('button',{type:'button',class:'choice',onclick:()=>choose(i,n)},h('span',{class:'kc'},String(n+1)),h('span',{class:'ct'},t)));
        art.append(...[cimg(pimg,'q-img'),promptNode(q),h('p',{class:'ask'},'Choose the '+(q.wd?'definition':'word')),h('div',{class:'choices'},q.buttons)].filter(Boolean));
      }else if(q.type==='tf'){
        q.buttons=['True','False'].map((t,n)=>h('button',{type:'button',class:'choice',onclick:()=>choose(i,n)},h('span',{class:'kc'},String(n+1)),h('span',{class:'ct'},t)));
        art.append(h('p',{class:'ask'},'Do these belong together?'),
          h('div',{class:'tf-line'},cimg(pimg,'q-img'),h('strong',null,rich(q.prompt)),h('span',{class:'arrow'},'→'),rich(q.shown)),
          h('div',{class:'choices'},q.buttons));
      }else{
        q.input=h('input',{class:'in',type:'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false','aria-label':'Answer for question '+(i+1),
          placeholder:q.type==='cz'?'Fill in the blank':'Type the '+(q.wd?'definition':'word'),
          oninput:e=>{q.given=e.target.value;},
          onfocus:()=>{if(sel!==i)select(i,{scroll:false});}});
        art.append(...[cimg(pimg,'q-img'),promptNode(q),h('p',{class:'ask'},q.type==='cz'?'Fill in the blank':'Type the '+(q.wd?'definition':'word')),q.input].filter(Boolean));
      }
      arts.push(art);form.append(art);
    });
    const warn=h('p',{class:'err',role:'alert'});
    const submit=btn('Check test',{cls:'primary',icon:'check',onclick:()=>{
      const un=qs.filter(q=>(q.type==='wr'||q.type==='cz')?!(q.given||'').trim():q.given==null).length;
      if(un&&!warned){warned=true;warn.textContent=un+(un===1?' question is':' questions are')+' unanswered. Press again to check anyway.';return;}
      showResults(qs);
    }});
    root.replaceChildren(studyBar('Test · '+deck.title,'Quit',back),
      h('div',{style:'max-width:760px;margin:0 auto'},form,h('div',{class:'submit-bar'},submit,warn),
        h('p',{class:'center-hint desk-only'},'1–4 to answer · ↑ ↓ ← → to move between questions · Enter in a written answer goes to the next')));
    setKeys(e=>{
      const tag=e.target.tagName,typing=tag==='INPUT'||tag==='TEXTAREA',q=qs[sel];
      if(typing){
        if(e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();select(sel+1,{focus:true});}
        else if(e.key==='ArrowUp'){e.preventDefault();select(sel-1,{focus:true});}
        return;
      }
      if(tag==='BUTTON'&&(e.key==='Enter'||e.key===' '))return;
      if(/^[1-9]$/.test(e.key)){
        const n=+e.key-1;
        if(q.buttons&&q.buttons[n]){e.preventDefault();choose(sel,n);}
        return;
      }
      if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();select(sel-1);}
      else if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();select(sel+1);}
    });
    window.scrollTo(0,0);
    select(0,{scroll:false});
  }
  function grade(q){
    if(q.type==='mc'){return q.given!=null&&norm(q.given)===norm(q.answer)?'exact':'wrong';}
    if(q.type==='tf')return q.given===q.isTrue?'exact':'wrong';
    return judge(q.given||'',q.answer).r;
  }
  /* In the results, a true/false question shows the statement that was on
     screen and — when that pairing was wrong — the correct word/definition
     pair too, so the answer key always reveals the real definition. */
  function tfFacit(q){
    const line=(cls,other)=>h('div',{class:'tf-line'+(cls?' '+cls:'')},
      h('strong',null,rich(q.prompt)),h('span',{class:'arrow'},'→'),rich(other));
    return h('div',{class:'tf-res'},line('',q.shown),q.isTrue?null:line('good',q.answer));
  }
  const AI_MAX_CHECKS=20;
  async function showResults(qs){
    setKeys(null);
    qs.forEach(q=>{q.res=grade(q);q.ok=q.res!=='wrong';});
    /* Written answers the exact match rejected get one more look from the AI,
       exactly like Write does. Only a handful at a time (the server allows 20
       per minute), and any failure simply keeps the built-in verdict. */
    const pending=AI&&deck.aiGrade!==false?qs.filter(q=>(q.type==='wr'||q.type==='cz')&&q.res==='wrong'&&String(q.given||'').trim()).slice(0,AI_MAX_CHECKS):[];
    if(pending.length){
      root.replaceChildren(studyBar('Test · '+deck.title,'Back',back),
        h('div',{class:'result',style:'margin-top:40px'},
          h('p',{class:'eyebrow'},'Checking'),
          h('p',{class:'sub'},'The AI is reading '+pending.length+(pending.length===1?' written answer':' written answers')+' that the exact match rejected…')));
      const queue=pending.slice();
      async function worker(){
        while(queue.length&&alive){
          const q=queue.shift();
          const ok=await aiGrade(q.prompt,q.answer,String(q.given).trim(),q.type==='cz');
          if(ok===true){q.res='ai';q.ok=true;}
        }
      }
      await Promise.all([worker(),worker(),worker()]);
      if(!alive)return;
    }
    qs.forEach(q=>{q.ok=q.res!=='wrong';if(q.ok)markRight(q.card);else markWrong(q.card);});
    const right=qs.filter(q=>q.ok).length;
    const aiN=qs.filter(q=>q.res==='ai').length;
    const pctv=Math.round(right/qs.length*100);
    recordTest(deck,right,qs.length);
    const hist=deck.stats.tests;
    const prevBest=hist.length>1?Math.max.apply(null,hist.slice(0,-1).map(t=>Math.round(t.right/t.total*100))):null;
    const list=qs.map((q,i)=>{
      let yours,correct;
      if(q.type==='tf'){
        yours=q.given==null?'No answer':(q.given?'True':'False');
        correct=q.isTrue?'True':'False';
      }else{
        yours=(q.given&&String(q.given).trim())||'No answer';
        correct=q.answer;
      }
      return h('article',{class:'q '+(q.ok?'ok':'bad')},
        h('div',{class:'q-top'},h('span',null,(i+1)+' · '+TYPE_LABEL[q.type])),
        q.type==='tf'?tfFacit(q):promptNode(q),
        (deck.example&&q.card.e&&String(q.card.e).trim())?exLine(q.card.e):null,
        h('div',{class:'q-res '+(q.ok?'ok':'bad')},icon(q.ok?'check':'cross'),
          h('div',null,q.ok
            ?h('span',null,'Your answer: ',h('strong',null,yours),
              q.res==='near'?h('span',null,' (small typo, spelled ',h('strong',null,correct),')'):null,
              q.res==='ai'?h('span',null,' (accepted by AI)'):null)
            :h('span',null,'Your answer: ',h('span',{class:'ans-bad'},yours),h('br'),'Correct: ',h('span',{class:'ans-good'},correct)))));
    });
    root.replaceChildren(studyBar('Test · '+deck.title,'Back',back),
      h('div',{style:'max-width:760px;margin:0 auto'},
        h('div',{class:'result',style:'margin:0 0 26px'},
          h('p',{class:'eyebrow'},prevBest!==null&&pctv>prevBest?'New best score':'Test complete'),
          h('div',{class:'score'},h('span',{class:'mark'},right+' / '+qs.length)),
          h('p',{class:'sub'},pctv+'%'+(prevBest!==null?' · previous best '+prevBest+'%':'')+(aiN?' · '+aiN+(aiN===1?' answer':' answers')+' accepted by AI.':'')+(right<qs.length?' · missed cards are scheduled for review.':' · perfect score.')),
          h('div',{class:'row'},btn('Retake test',{cls:'primary',onclick:showConfig}),btn('Back to deck',{cls:'ghost',onclick:back}))),
        list));
    window.scrollTo(0,0);
  }
  showConfig();
  return root;
}

/* =====================================================================
   Public decks: built-in decks plus community decks (shared db) with likes
   ===================================================================== */
const HIDE_AT=-3,MAX_PUBLISHED=15,MIN_CARDS=4;
function startPublic(){
  if(!DB){pubReady=true;pubChanged();return;}
  try{
    DB.collection('pub').onSnapshot(snap=>{
      const m={};
      snap.docs.forEach(s=>{const v=s.data();if(v&&v.decks&&typeof v.decks==='object')m[s.id]=v.decks;});
      PUB=m;pubReady=true;pubChanged();
    },()=>{pubReady=true;pubChanged();});
    DB.collection('votes').onSnapshot(snap=>{
      const m={};
      snap.docs.forEach(s=>{const v=s.data();if(v&&v.v&&typeof v.v==='object')m[s.id]=v.v;});
      VOTES=m;pubChanged();
    },()=>{});
  }catch(e){pubReady=true;}
}
function pubChanged(){if(pubHook){try{pubHook();}catch(e){}}}
function setPubHook(fn){pubHook=fn;onLeave(()=>{if(pubHook===fn)pubHook=null;});}

function tally(){
  const t={};
  Object.keys(VOTES).forEach(u=>{
    const mv=VOTES[u];
    Object.keys(mv).forEach(g=>{
      const owner=g.split('~')[0];
      if(owner===u)return;
      const e=t[g]||(t[g]={up:0,down:0});
      if(mv[g]===1)e.up++;else if(mv[g]===-1)e.down++;
    });
  });
  return t;
}
function pubItems(){
  const t=tally(),out=[];
  BUILTIN.forEach(b=>out.push({gid:'bi:'+b[0],builtin:true,mine:false,deck:{title:b[1],desc:b[2],langW:b[3],langD:b[4],choize:b[5],cards:b[6],example:!!b[7]},up:0,down:0,score:0,at:0}));
  Object.keys(PUB).forEach(u=>{
    const decks=PUB[u];
    Object.keys(decks).forEach(k=>{
      const d=decks[k];
      if(!d||!Array.isArray(d.cards)||typeof d.title!=='string')return;
      const cards=d.cards.filter(c=>Array.isArray(c)&&typeof c[0]==='string'&&typeof c[1]==='string').slice(0,500)
        .map(c=>[String(c[0]),String(c[1]),typeof c[2]==='string'?c[2].slice(0,400):'',
          typeof c[3]==='string'?c[3]:'',typeof c[4]==='string'?c[4]:'']);
      if(!cards.length)return;
      const images={};
      if(d.images&&typeof d.images==='object'&&!Array.isArray(d.images)){
        Object.keys(d.images).slice(0,60).forEach(id=>{
          const v=d.images[id];
          if(typeof v==='string'&&/^data:image\//.test(v)&&v.length<=200000)images[id]=v;
        });
      }
      const clean={title:d.title.slice(0,120),desc:typeof d.desc==='string'?d.desc.slice(0,300):'',cards,choize:!!d.choize,example:!!d.example,aiHint:d.aiHint!==false,aiGrade:d.aiGrade!==false,
        images,color:safeColor(d.color),
        langW:typeof d.langW==='string'?d.langW:'',langD:typeof d.langD==='string'?d.langD:'',at:+d.at||0};
      const gid=u+'~'+k,v=t[gid]||{up:0,down:0};
      out.push({gid,builtin:false,mine:u===UID,key:k,deck:clean,up:v.up,down:v.down,score:v.up-v.down,at:d.at||0});
    });
  });
  return out;
}
const pubFind=gid=>pubItems().find(x=>x.gid===gid)||null;
const myVote=gid=>((UID&&VOTES[UID])||{})[gid]||0;
function castVote(gid,val){
  if(!canShare())return;
  const cur=Object.assign({},(UID&&VOTES[UID])||{});
  if(cur[gid]===val)delete cur[gid];else cur[gid]=val;
  VOTES[UID]=cur;
  dbQueue('votes_me',{v:cur},'votes/'+UID);
  pubChanged();
}
const myPublished=()=>(UID&&PUB[UID])||{};
const MAX_PUB_CHARS=1600000;
/* Public decks are text plus small images. Each picture is re-encoded at 360 px
   on its long edge (JPEG, quality .6) so a normal deck with a handful of images
   stays well under the server's request limit. */
function pubImage(src){
  return new Promise(res=>{
    try{
      const im=new Image();
      im.onload=()=>{
        try{
          const M=360;
          let w=im.naturalWidth||im.width,hh=im.naturalHeight||im.height;
          if(!w||!hh)return res(null);
          const k=Math.min(1,M/Math.max(w,hh));
          w=Math.max(1,Math.round(w*k));hh=Math.max(1,Math.round(hh*k));
          const cv=document.createElement('canvas');cv.width=w;cv.height=hh;
          const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,hh);cx.drawImage(im,0,0,w,hh);
          res(cv.toDataURL('image/jpeg',.6));
        }catch(e){res(null);}
      };
      im.onerror=()=>res(null);
      im.src=src;
    }catch(e){res(null);}
  });
}
async function publishDeck(d){
  const mine=Object.assign({},myPublished());
  if(!mine[d.id]&&Object.keys(mine).length>=MAX_PUBLISHED)return 'You can have at most '+MAX_PUBLISHED+' public decks. Unpublish one first.';
  if(d.cards.length<MIN_CARDS)return 'A public deck needs at least '+MIN_CARDS+' cards.';
  const images={},seen=new Set();
  for(const c of d.cards){
    for(const k of ['wi','di']){
      const id=c[k];
      if(!id||seen.has(id)||!S.images[id])continue;
      seen.add(id);
      const small=await pubImage(S.images[id]);
      if(small)images[id]=small;
    }
  }
  const cards=d.cards.map(c=>[c.w,c.d,d.example?(c.e||''):'',c.wi&&images[c.wi]?c.wi:'',c.di&&images[c.di]?c.di:'']);
  mine[d.id]={title:d.title,desc:d.desc||'',cards,choize:!!d.choize,example:!!d.example,aiHint:d.aiHint!==false,aiGrade:d.aiGrade!==false,langW:d.langW||'',langD:d.langD||'',images,color:safeColor(d.color),at:Date.now()};
  if(JSON.stringify(mine).length>MAX_PUB_CHARS)return 'That deck is too large to publish, even after shrinking its images. Remove a few images or split the deck.';
  PUB[UID]=mine;
  dbQueue('pub_me',{decks:mine},'pub/'+UID);
  pubChanged();
  return null;
}
function unpublishDeck(key){
  const mine=Object.assign({},myPublished());
  delete mine[key];PUB[UID]=mine;
  dbQueue('pub_me',{decks:mine},'pub/'+UID);
  pubChanged();
}
/* ----- Sign in with Google -----
   We draw our own button, styled to match the app, and let the real Google
   button sit invisibly on top of it: clicking runs Google's sign-in exactly as
   Google requires, but the user sees our design. Google Identity Services hands
   us a signed ID token, which the server verifies (signature + audience) before
   starting a session. The script is only fetched once the server says sign-in is
   on; pressing our button with the keyboard falls back to Google's One Tap. */
let gsiLoading=false,gsiReady=false,gsiHits=[];
const GOOGLE_G='<svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>';
function gsiButton(){
  const face=h('button',{type:'button',class:'gsi-face','aria-label':'Sign in with Google',
    onclick:()=>{try{google.accounts.id.prompt();}catch(e){}}},
    h('span',{class:'gsi-g',html:GOOGLE_G}),
    h('span',null,'Sign in',h('span',{class:'gsi-long'},' with Google')));
  const hit=h('span',{class:'gsi-hit','aria-hidden':'true'});
  const wrap=h('span',{class:'gsi-wrap'},face,hit);
  gsiHits.push(hit);loadGis();
  setTimeout(()=>paintGsi(hit),0);   // the box is often not in the DOM yet at this point
  return wrap;
}
function paintGsi(hit){
  if(!hit||!hit.isConnected||!gsiReady||hit.firstChild)return;
  try{google.accounts.id.renderButton(hit,{theme:'outline',size:'large',shape:'rectangular',text:'signin_with',width:240});}catch(e){}
}
function loadGis(){
  if(gsiReady||gsiLoading||!AUTH.clientId)return;
  if(window.google&&google.accounts&&google.accounts.id){initGis();return;}
  gsiLoading=true;
  const s=document.createElement('script');
  s.src='https://accounts.google.com/gsi/client';s.async=true;s.defer=true;
  s.onload=()=>{gsiLoading=false;initGis();};
  s.onerror=()=>{gsiLoading=false;};
  document.head.appendChild(s);
}
function initGis(){
  if(gsiReady||!(window.google&&google.accounts&&google.accounts.id))return;
  try{
    google.accounts.id.initialize({client_id:AUTH.clientId,callback:onCredential,auto_select:false,cancel_on_tap_outside:true});
    gsiReady=true;
  }catch(e){return;}
  gsiHits=gsiHits.filter(b=>b.isConnected);
  gsiHits.forEach(paintGsi);
}
async function onCredential(resp){
  if(!resp||!resp.credential)return;
  try{
    const j=await authApi('google',{credential:resp.credential});
    if(j&&j.ok&&j.user){
      setUser(j.user);
      /* Reload so connectDb can bring in this account's decks and progress
         (merging whatever this device already had the first time). */
      try{location.reload();}catch(e){}
    }
  }catch(e){}
}
async function signOut(){
  try{await authApi('logout',{});}catch(e){}
  try{if(window.google&&google.accounts)google.accounts.id.disableAutoSelect();}catch(e){}
  setUser(null);
  /* Reload so the personal area goes back to this browser's own decks. */
  try{location.reload();}catch(e){}
}
function acctName(){
  const custom=(S.profile&&S.profile.name)?String(S.profile.name).trim():'';
  return custom||USER.name||USER.email||'Signed in';
}
function acctAvatar(name){
  const av=h('span',{class:'acct-av','aria-hidden':'true'},String((name||'?').trim().charAt(0)||'?').toUpperCase());
  if(USER.picture){
    const img=h('img',{class:'acct-pic',src:USER.picture,alt:'',referrerpolicy:'no-referrer'});
    img.addEventListener('error',()=>img.remove());   // fall back to the initial
    av.append(img);
  }
  return av;
}
function saveAcctName(value){
  S.profile=Object.assign({},S.profile,{name:String(value||'').trim().slice(0,40)});
  touchMeta();
  renderAccount();
}
function renderAccount(){
  const el=document.getElementById('acct');
  if(!el)return;
  if(!USER){
    if(AUTH.on&&AUTH.clientId)el.replaceChildren(gsiButton());
    else el.replaceChildren();
    return;
  }
  const name=acctName();
  const input=h('input',{id:'acct-name',class:'in',type:'text',maxlength:'40',autocomplete:'nickname',
    placeholder:USER.name||USER.email||'Your display name',
    value:(S.profile&&S.profile.name)||'',
    onkeydown:e=>{if(e.key==='Enter'){e.preventDefault();saveAcctName(e.target.value);}}});
  const pop=h('div',{class:'acct-pop',role:'dialog','aria-label':'Account'},
    h('span',{class:'lbl'},'Display name'),
    input,
    h('div',{class:'row'},
      btn('Save',{cls:'primary',onclick:()=>saveAcctName(input.value)}),
      (S.profile&&S.profile.name)?btn('Use Google name',{cls:'ghost',onclick:()=>saveAcctName('')}):null),
    h('p',{class:'hint'},'Shown in the top corner on every device signed in to this account.'),
    h('div',{class:'row'},btn('Sign out',{cls:'link',onclick:signOut})));
  const toggle=h('button',{type:'button',class:'acct-btn','aria-haspopup':'dialog','aria-expanded':'false',title:'Account settings',onclick:()=>{
    const open=el.classList.toggle('open');
    toggle.setAttribute('aria-expanded',String(open));
    if(open){const i=el.querySelector('#acct-name');if(i){i.focus();if(i.select)i.select();}}
  }},acctAvatar(name),h('span',{class:'acct-nm'},name));
  el.replaceChildren(toggle,pop);
}
/* The account menu lives in the header, outside the view router, so closing it
   on an outside click or Escape is handled once, globally. */
document.addEventListener('click',e=>{
  const a=document.getElementById('acct');
  if(a&&a.classList.contains('open')&&!a.contains(e.target)){
    a.classList.remove('open');
    const b=a.querySelector('.acct-btn');if(b)b.setAttribute('aria-expanded','false');
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  const a=document.getElementById('acct');
  if(a&&a.classList.contains('open')){
    a.classList.remove('open');
    const b=a.querySelector('.acct-btn');if(b){b.setAttribute('aria-expanded','false');b.focus();}
  }
});
function addCopy(deck,gid){
  const pubImages=deck.images&&typeof deck.images==='object'?deck.images:{};
  const remap={};
  Object.keys(pubImages).forEach(id=>{
    let nid=id;
    if(S.images[id]&&S.images[id]!==pubImages[id]){nid=uid();while(S.images[nid])nid=uid();}
    S.images[nid]=pubImages[id];remap[id]=nid;
  });
  const imgId=id=>id&&remap[id]?remap[id]:null;
  const d={id:uid(),title:deck.title,desc:deck.desc||'',choize:!!deck.choize,example:!!deck.example,aiHint:deck.aiHint!==false,aiGrade:deck.aiGrade!==false,langW:deck.langW||'',langD:deck.langD||'',color:safeColor(deck.color),created:Date.now(),pubGid:gid||'',
    cards:deck.cards.map(c=>Array.isArray(c)
      ?{id:uid(),w:c[0],d:c[1],e:c[2]||'',wi:imgId(c[3]),di:imgId(c[4])}
      :{id:uid(),w:c.w,d:c.d,e:c.e||'',wi:imgId(c.wi),di:imgId(c.di)})};
  // Saving a built-in deck keeps a live link to it instead of a frozen copy, so
  // later edits to the built-in deck show up here too. Community decks are still
  // copied as before.
  if(gid&&/^bi:/.test(gid)&&builtinOf(gid)){d.src=gid;hydrateDeck(d);}
  S.decks.push(d);touchDeck(d);
  if(Object.keys(remap).length)syncImages(Object.keys(remap).map(k=>remap[k]));
  return d;
}
/* --- Public decks, opened like any other deck ---
   Clicking a deck in Browse goes straight to its study screen, exactly like a
   deck you already own. We only copy it into "my decks" the moment one of the
   study modes is actually started, so browsing stays non-committal and the
   old "Add to my decks, then pick a mode" detour is gone. */
function ownCopyOf(it){
  if(it.mine)return deckById(it.key)||null;
  if(it.builtin)return S.decks.find(d=>d.src===it.gid)||null;
  return S.decks.find(d=>d.pubGid===it.gid)||null;
}
function ensureCopy(it){
  const own=ownCopyOf(it);
  return own||addCopy(it.deck,it.gid);
}
function openPublic(it){
  const own=ownCopyOf(it);
  if(own)go('deck',{id:own.id});
  else go('pubdeck',{id:it.gid});
}
const loginOk=()=>!(AUTH.on&&!UID);
const canShare=()=>!!DB&&loginOk();
function pubFail(err){
  pubNotice='Could not save to the shared database'+(err&&err.code?' ('+err.code+')':'')+'. The page owner may need to give you edit access.';
  pubChanged();
}
function loginNote(what){
  const kids=[h('span',null,'Sign in to '+what+'.')];
  kids.push((AUTH.on&&AUTH.clientId)?gsiButton():h('span',{class:'hint'},'Sign-in is not set up on this server.'));
  return h('div',{class:'confirm login',role:'status'},...kids);
}
const hidden=it=>!it.builtin&&!it.mine&&it.score<=HIDE_AT;

function pubTile(it){
  const dc=safeColor(it.deck.color);
  return h('button',{type:'button',class:'deck'+(dc?' c-colored':''),style:dc?('--dc:'+dc):null,onclick:()=>openPublic(it)},
    h('span',{class:'tag'+(it.builtin?' hl':'')},it.builtin?'Built in':(it.mine?'Yours':'Community')),
    h('h3',null,it.deck.title),
    it.deck.desc?h('p',null,it.deck.desc):null,
    h('span',{class:'meta'},dc?h('span',{class:'deck-dot','aria-hidden':'true'}):null,it.deck.cards.length+' cards',
      it.builtin?null:' · ',
      it.builtin?null:h('span',{class:'vote-net',title:'Likes minus dislikes'},icon('like'),(it.score>0?'+':it.score<0?'−':'')+Math.abs(it.score))));
}
function browseView(){
  let q='',cat='all',sort='top';
  const info=h('p',{class:'sub','aria-live':'polite'});
  const list=h('div',{class:'decks'});
  const search=h('input',{type:'search',class:'in',placeholder:'Search decks, words or definitions',autocomplete:'off','aria-label':'Search public decks',
    oninput:e=>{q=e.target.value;paint();}});
  const catSeg=seg([['all','All'],['builtin','Built in'],['community','Community'],['mine','Yours']],cat,v=>{cat=v;paint();},'Show');
  const sortSeg=seg([['top','Top rated'],['popular','Popular']],sort,v=>{sort=v;paint();},'Sort community decks');
  function match(it){
    const toks=norm(q).split(' ').filter(Boolean);
    if(!toks.length)return true;
    const hay=norm(it.deck.title+' '+(it.deck.desc||'')+' '+it.deck.cards.map(c=>plain(c[0]||'')+' '+plain(c[1]||'')).join(' '));
    return toks.every(t=>hay.indexOf(t)>=0);
  }
  function paint(){
    let items=pubItems().filter(it=>!hidden(it)).filter(match);
    if(cat==='builtin')items=items.filter(i=>i.builtin);
    else if(cat==='community')items=items.filter(i=>!i.builtin);
    else if(cat==='mine')items=items.filter(i=>i.mine);
    const b=items.filter(i=>i.builtin),c=items.filter(i=>!i.builtin);
    c.sort(sort==='popular'?(x,y)=>(y.up-x.up)||(y.score-x.score)||(y.at-x.at):(x,y)=>(y.score-x.score)||(y.at-x.at));
    const all=b.concat(c);
    list.replaceChildren(...all.map(pubTile));
    const nc=c.length;
    info.textContent=all.length?(all.length+(all.length===1?' deck':' decks')+(q?' match “'+q.trim()+'”':'')+'.'):
      (!pubReady?'Loading…':(q?'Nothing matches “'+q.trim()+'”.':(cat==='mine'?'You have not published any decks yet. Open one of your decks and press Publish.':'No decks here yet.')));
    sortSeg.hidden=cat==='builtin'||nc<2;
  }
  setPubHook(paint);
  paint();
  return h('div',{class:'wrap view'},
    btn('Home',{cls:'link',icon:'back',onclick:()=>histBack('home')}),
    h('div',{class:'intro',style:'justify-items:start;text-align:left;padding:6px 0 18px'},h('h1',null,'Browse public decks'),
      h('p',{class:'sub'},'Built-in decks and decks shared by other people. Open any of them to study right away: it is added to your own decks when you begin.')),
    h('div',{class:'toolbar'},search),
    h('div',{class:'row',style:'margin:12px 0'},catSeg,sortSeg),
    info,list);
}
function pubDeckView(p){
  const root=h('div',{class:'wrap view'});
  function paint(){
    const it=pubFind(p.id);
    if(!it){
      if(pubReady){setTimeout(()=>histBack('browse'),0);return;}
      root.replaceChildren(btn('Back',{cls:'link',icon:'back',onclick:()=>histBack('browse')}),h('p',{class:'sub',style:'margin-top:16px'},'Loading…'));
      return;
    }
    const d=it.deck,n=d.cards.length;
    const own=ownCopyOf(it);
    const canVote=canShare()&&!it.builtin&&!it.mine;
    const mv=myVote(it.gid);
    const msg=h('p',{class:'hint','aria-live':'polite'});
    const vote=it.builtin?null:h('div',{class:'votes',role:'group','aria-label':'Rate this deck'},
      h('button',{type:'button',class:'vbtn','aria-pressed':String(mv===1),disabled:!canVote,title:canVote?'Like':'Voting needs the shared database',onclick:()=>castVote(it.gid,1)},icon('up'),h('span',null,String(it.up))),
      h('button',{type:'button',class:'vbtn','aria-pressed':String(mv===-1),disabled:!canVote,title:canVote?'Dislike':'Voting needs the shared database',onclick:()=>castVote(it.gid,-1)},icon('down'),h('span',null,String(it.down))));
    const rowBtns=h('div',{class:'row'},
      btn(own?'Open my copy':'Add to my decks',{cls:'ghost',icon:own?'next':'plus',onclick:()=>go('deck',{id:ensureCopy(it).id})}),
      (it.mine&&own)?btn('Edit deck',{cls:'ghost',icon:'edit',onclick:()=>go('edit',{id:own.id})}):null,
      it.mine?btn('Unpublish',{cls:'ghost',icon:'trash',onclick:()=>{unpublishDeck(it.key);histBack('browse');}}):null);
    root.replaceChildren(...[
      btn('Browse public decks',{cls:'link',icon:'back',onclick:()=>histBack('browse')}),
      h('div',{class:'hub-top'},
        h('span',{class:'tag'+(it.builtin?' hl':''),style:'justify-self:start'},it.builtin?'Built in':(it.mine?'Yours':'Community')),
        h('h1',null,d.title),
        d.desc?h('p',{class:'desc'},d.desc):null,
        h('div',{class:'chips'},h('span',{class:'tag'},n+' cards'),h('span',{class:'tag'},'Blanks '+(d.choize?'on':'off')),d.example?h('span',{class:'tag'},'Example'):null),
        rowBtns,
        h('p',{class:'hint'},it.builtin?'Studying a built-in deck saves a link to it: if it is edited later, your copy follows.':'Pick a study mode to start. The deck is added to your own decks when you begin.'),
        vote,msg,
        (!it.builtin&&!canVote&&!it.mine)?(DB?loginNote('vote'):h('p',{class:'hint'},'Voting needs the shared server, which this page cannot reach right now.')):null,
        pubNotice?h('p',{class:'hint warnline'},pubNotice):null),
      moduleGrid(d,k=>go(k,{id:ensureCopy(it).id})),
      h('details',{class:'cards-list'},
        h('summary',null,'Cards in this deck ('+n+')'),
        h('div',{class:'cl'},h('div',{class:'h'},'Word'),h('div',{class:'h'},'Definition'),
          d.cards.slice(0,200).map(c=>[h('div',null,pubCimg(d,c[3],'cl-img'),rich(c[0])),h('div',null,pubCimg(d,c[4],'cl-img'),rich(c[1]))]))),
      n>200?h('p',{class:'hint'},'Showing the first 200 of '+n+' cards.'):null].filter(Boolean));
  }
  setPubHook(paint);
  paint();
  return root;
}

/* =====================================================================
   Views + boot
   ===================================================================== */
const VIEWS={home:homeView,deck:deckView,edit:editView,export:exportView,flash:flashView,match:matchView,write:writeView,learn:learnView,test:testView,browse:browseView,pubdeck:pubDeckView};
document.getElementById('brand').addEventListener('click',()=>go('home'));

(function boot(){
  const loc=lsLoad();
  if(loc&&Array.isArray(loc.decks)){S={decks:loc.decks,review:Array.isArray(loc.review)?loc.review:[],images:loc.images||{},resume:loc.resume||null,profile:(loc.profile&&typeof loc.profile.name==='string')?{name:loc.profile.name}:{name:''},seeded:true,linked:!!loc.linked};localLoaded=true;}
  else S={decks:[],review:[],images:{},resume:null,profile:{name:''},seeded:true,linked:false};
  hydrateAll();
  if(!S.linked){if(linkBuiltinCopies())hydrateAll();S.linked=true;}
  pruneReview(true);
  const sv=loadView();
  if(sv&&VIEWS[sv.name]&&sv.name!=='home'){
    if(sv.name==='browse'||sv.name==='pubdeck'||!sv.id||deckById(sv.id))view=Object.assign({},sv,{restore:sv.name==='edit',resume:!sv.review&&!!resumeFor(sv.name,sv.id)});
    else pending=sv;
  }
  const verEl=document.getElementById('ver');
  if(verEl){verEl.textContent='v'+APP_VERSION;verEl.title='Memoria '+APP_VERSION;}
  render();
  histBase();
  connectDb();
})();

})();
